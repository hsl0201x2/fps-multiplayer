      if (avatar.group.userData.dropGun) scene.remove(avatar.group.userData.dropGun);
      if (avatar.group.parent) avatar.group.parent.remove(avatar.group);
      const label = avatar.group.userData.nameLabel;
      if (label) { label.material.map?.dispose(); label.material.dispose(); }
      remoteAvatarById.delete(playerId);
    }

    function clearRemoteAvatars() {
      for (const [playerId, avatar] of remoteAvatarById) {
        removeRemoteAvatar(playerId, avatar);
      }
      latestPlayersSnapshot = [];
    }

    function setLobbyStatus(message, kind = "") {
      const status = document.getElementById("lobbyStatus");
      if (!status) return;
      status.textContent = message;
      status.dataset.kind = kind;
    }

    function updateLobbyInterface() {
      const active = !!activeLobbyCode;
      const strip = document.getElementById("activeLobbyStrip");
      const actions = document.getElementById("lobbyActions");
      const activePanel = document.getElementById("lobbyActive");
      const connected = multiplayerSocket.connected;
      const count = Math.max(1, lobbyPlayerSnapshots.length);
      const countLabel = `${count} ${count === 1 ? "player" : "players"} connected`;

      if (strip) strip.hidden = !active;
      if (actions) actions.hidden = active;
      if (activePanel) activePanel.hidden = !active;
      for (const id of ["modeLobbyCode", "lobbyCodeDisplay"]) {
        const element = document.getElementById(id);
        if (element) element.textContent = activeLobbyCode || "";
      }
      const modeCount = document.getElementById("modeLobbyPlayers");
      if (modeCount) modeCount.textContent = countLabel;
      const lobbyCount = document.getElementById("lobbyPlayerCount");
      if (lobbyCount) lobbyCount.textContent = countLabel;

      const disabled = lobbyRequestBusy || !connected;
      for (const id of ["createLobbyBtn", "joinLobbyBtn", "lobbyCodeInput", "leaveLobbyBtn", "modeLeaveLobbyBtn"]) {
        const element = document.getElementById(id);
        if (element) element.disabled = disabled;
      }
      const joinButton = document.getElementById("joinLobbyBtn");
      if (joinButton) joinButton.disabled = disabled;
    }

    function requestLobby(eventName, payload = {}) {
      return new Promise((resolve) => {
        if (!multiplayerSocket.connected) {
          resolve({ ok: false, error: "Not connected to the game server yet." });
          return;
        }
        let settled = false;
        const timeout = setTimeout(() => {
          if (settled) return;
          settled = true;
          resolve({ ok: false, error: "The server did not respond. Please try again." });
        }, 7000);
        multiplayerSocket.emit(eventName, payload, (result) => {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          resolve(result || { ok: false, error: "The server returned an invalid response." });
        });
      });
    }

    function applyLobbyResult(result) {
      if (!result?.ok) {
        setLobbyStatus(result?.error || "Could not connect to that lobby.", "error");
        return false;
      }
      activeLobbyCode = result.code;
      lobbyPlayerSnapshots = Array.isArray(result.players) ? result.players : [];
      syncRemotePlayers(lobbyPlayerSnapshots);
      updateLobbyInterface();
      setLobbyStatus("Lobby connected. Share the code, then continue to a game mode.");
      return true;
    }

    function clearLobbyState() {
      activeLobbyCode = null;
      lobbyPlayerSnapshots = [];
      window.__fpsVersusActive = false;
      window.__fpsLocalTeam = null;
      window.__fpsSoloMenuSettings = null;
      window.__fpsSoloHotbar = null;
      PLAYER_MAX_HP = 100;
      clearRemoteAvatars();
      updateLobbyInterface();
    }

    function syncRemotePlayers(players) {
      if (!Array.isArray(players)) return;
      latestPlayersSnapshot = players;
      lobbyPlayerSnapshots = players.filter((player) =>
        player &&
        typeof player.id === "string" &&
        !player.stale,
      );
      updateLobbyInterface();
      if (!scene) return;

      const visiblePlayerIds = new Set();
      const playerById = new Map();
      for (const player of lobbyPlayerSnapshots) {
        if (player.id === multiplayerSocket.id) continue;
        playerById.set(player.id, player);
      }

      for (const [playerId, player] of playerById) {
        if (!player.position || !player.aim) continue;
        const { x, y, z } = player.position;
        const { yaw: playerYaw, pitch: playerPitch } = player.aim;
        if (![x, y, z, playerYaw, playerPitch].every(Number.isFinite)) continue;

        visiblePlayerIds.add(playerId);
        let avatar = remoteAvatarById.get(playerId);
        if (avatar && avatar.skin !== (player.profile?.skin || "rifler")) {
          removeRemoteAvatar(playerId, avatar);
          avatar = null;
        }
        if (!avatar) {
          avatar = createRemoteAvatar(player);
          remoteAvatarById.set(playerId, avatar);
        }

        if (avatar.group.parent !== scene) scene.add(avatar.group);
        const now = performance.now();
        const nextPos = new THREE.Vector3(x, y, z);
        if (avatar.lastPosition && now > avatar.lastAt) {
          const dt = Math.max(0.02, (now - avatar.lastAt) / 1000);
          avatar.group.userData.vel.copy(nextPos).sub(avatar.lastPosition).multiplyScalar(1 / dt);
        }
        avatar.lastPosition = nextPos.clone(); avatar.lastAt = now;
        if (!avatar.target) { avatar.target = nextPos.clone(); avatar.group.position.copy(nextPos); }
        else avatar.target.copy(nextPos);
        avatar.targetYaw = playerYaw;
        avatar.group.userData.remotePitch = playerPitch;
        avatar.group.userData.remotePlayerId = playerId;
        const wasAlive = avatar.group.userData.alive !== false;
        const previousHp = avatar.group.userData.hp;
        avatar.group.userData.maxHp = Number.isFinite(mpState?.config?.health) ? mpState.config.health : (Number.isFinite(PLAYER_MAX_HP) ? PLAYER_MAX_HP : 100);
        avatar.group.userData.hp = Number.isFinite(player.hp) ? player.hp : 100;
        if (settings.blood && avatar.group.userData.hp < previousHp) drawHealthBar(avatar.group);
        avatar.group.userData.team = player.team || null;
        avatar.group.userData.alive = player.alive !== false;
        if (avatar.label && player.profile) {
          const key = (player.profile.username || "Player") + "|" + (player.team || "");
          if (avatar.tagText !== key) { avatar.tagText = key; drawNameTag(avatar, player.profile.username || "Player", player.team || null); }
        }
        avatar.group.visible = true;
        if (!avatar.group.userData.alive && wasAlive) {
          avatar.group.userData.keepCorpse = true;
          startEnemyDeath(avatar.group, killOriginFor(playerId));
        }
        // enemy names are hidden behind walls; teammates stay visible
        if (avatar.label) avatar.label.material.depthTest = !(player.team && player.team === window.__fpsLocalTeam);   // teammates show through walls, enemies don't
      }

      for (const [playerId, avatar] of remoteAvatarById) {
        if (!visiblePlayerIds.has(playerId)) removeRemoteAvatar(playerId, avatar);
      }
    }

    // Smooth + animate every remote player each frame, using the same walk/run/aim rig as the enemies.
    (function remoteLoop() {
      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.1, Math.max(0.001, (now - last) / 1000)); last = now;
        if ((!locked || !roundActive) && window.__fpsVersusActive) updateLiveGrenades(dt);
        for (const avatar of remoteAvatarById.values()) {
          const g = avatar.group;
          if (!avatar.target || !g.visible) continue;
          const tag=g.userData.nameLabel;
          if(tag){
            const tagWorld=new THREE.Vector3(g.position.x,g.position.y+(tag.position.y||2.55),g.position.z);
            tag.visible=!lineBlockedBySmoke(camera.position,tagWorld);
          }
          if (g.userData.dying) {
            if (!locked || !roundActive) updateDyingEnemies(dt, g);
            continue;
          }
          const k = 1 - Math.exp(-dt * 16);
          const px = g.position.x, pz = g.position.z;
          g.position.x += (avatar.target.x - g.position.x) * k;
          g.position.y += (avatar.target.y - g.position.y) * k;
          g.position.z += (avatar.target.z - g.position.z) * k;
          if (Math.hypot(avatar.target.x - g.position.x, avatar.target.z - g.position.z) > 6) g.position.copy(avatar.target);
          let dy = ((avatar.targetYaw - g.rotation.y + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
          g.rotation.y += dy * k;
          const vk = 1 - Math.exp(-dt * 10);
          g.userData.vel.x += ((g.position.x - px) / dt - g.userData.vel.x) * vk;
          g.userData.vel.z += ((g.position.z - pz) / dt - g.userData.vel.z) * vk;
          if (!g.userData.dying) { try { animateEnemy(g, dt); } catch (e) {} }
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();

    multiplayerSocket.on("connect", () => {
      console.log("Connected to game server:", multiplayerSocket.id);
      if (activeLobbyCode) {
        const reconnectCode = activeLobbyCode;
        clearRemoteAvatars();
        setLobbyStatus("Reconnecting to your lobby…");
        requestLobby("lobby:join", { code: reconnectCode, profile: window.__fpsProfile?.() }).then((result) => {
          if (!applyLobbyResult(result)) clearLobbyState();
        });
      } else {
        syncRemotePlayers([]);
        setLobbyStatus("Connected. Create a lobby or enter a friend's code.");
      }
      updateLobbyInterface();
    });
    multiplayerSocket.on("players:snapshot", syncRemotePlayers);
    multiplayerSocket.on("match:utility", (data = {}) => {
      if (!window.__fpsVersusActive || data.playerId === multiplayerSocket.id || !["frag","flash","smoke"].includes(data.type)) return;
      const p=data.position,v=data.velocity;
      if(!p||!v||![p.x,p.y,p.z,v.x,v.y,v.z,data.fuse,data.serverTime].every(Number.isFinite))return;
      const age=Math.max(0,Math.min(3,(Date.now()-data.serverTime)/1000));
      const mesh=makeUtilityModel(data.type,GR_R/0.042);
      const col=data.type==="flash"?0x55ccff:data.type==="smoke"?0xe0e4df:0xff2a2a;
      const led=new THREE.Mesh(new THREE.SphereGeometry(0.011*(GR_R/0.042),8,8),new THREE.MeshBasicMaterial({color:col}));
      led.position.y=0.093*(GR_R/0.042);mesh.add(led);
      mesh.position.set(p.x+v.x*age,p.y+v.y*age-0.5*GRENADE.gravity*age*age,p.z+v.z*age);
      scene.add(mesh);
      const vel=new THREE.Vector3(v.x,v.y-GRENADE.gravity*age,v.z);
      const fuse=99;
      const projectile={mesh,led,vel,fuse,type:data.type,spin:new THREE.Vector3(rand(-1,1),rand(-1,1),rand(-1,1)).normalize(),lastSfx:-1e9,visualOnly:true,networkId:data.projectileId||null,air:Math.max(0.5,6-age)};
      mesh.userData.liveGrenade=projectile;
      liveGrenades.push(projectile);
    });
    multiplayerSocket.on("match:utility-hit", (data = {}) => {
      const projectile=liveGrenades.find(g=>g.networkId===data.projectileId);
      if(!projectile||!data.direction||![data.direction.x,data.direction.y,data.direction.z].every(Number.isFinite))return;
      applyGrenadeShot(projectile,data.action,new THREE.Vector3(data.direction.x,data.direction.y,data.direction.z));
    });
    multiplayerSocket.on("player:disconnected", (playerId) => {
      latestPlayersSnapshot = latestPlayersSnapshot.filter((player) => player?.id !== playerId);
      lobbyPlayerSnapshots = lobbyPlayerSnapshots.filter((player) => player?.id !== playerId);
      const avatar = remoteAvatarById.get(playerId);
      if (avatar) removeRemoteAvatar(playerId, avatar);
      updateLobbyInterface();
    });
    multiplayerSocket.on("disconnect", () => {
      setLobbyStatus(activeLobbyCode ? "Connection lost. Reconnecting…" : "Disconnected from the game server.", "error");
      updateLobbyInterface();
    });
    multiplayerSocket.on("connect_error", () => {
      setLobbyStatus("Could not connect to the game server. Retrying…", "error");
      updateLobbyInterface();
    });

    document.getElementById("createLobbyBtn").onclick = async () => {
      const profile = window.__fpsProfile?.();
      if (!profile?.username || !profile.skin) {
        setLobbyStatus("Enter a username and choose a soldier first.", "error");
        document.getElementById(profile?.username ? "mpSkin" : "mpUsername").focus();
        return;
      }
      lobbyRequestBusy = true;
      setLobbyStatus("Creating a lobby…");
      updateLobbyInterface();
      const result = await requestLobby("lobby:create", { profile });
      lobbyRequestBusy = false;
      applyLobbyResult(result);
      updateLobbyInterface();
    };

    const lobbyCodeInput = document.getElementById("lobbyCodeInput");
    lobbyCodeInput.addEventListener("input", () => {
      lobbyCodeInput.value = lobbyCodeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
    });
    document.getElementById("joinLobbyBtn").onclick = async () => {
      const profile = window.__fpsProfile?.();
      if (!profile?.username || !profile.skin) {
        setLobbyStatus("Enter a username and choose a soldier first.", "error");
        document.getElementById(profile?.username ? "mpSkin" : "mpUsername").focus();
        return;
      }
      const code = lobbyCodeInput.value.trim().toUpperCase();
      if (code.length !== 6) {
        setLobbyStatus("Enter all six letters and numbers from the lobby code.", "error");
        lobbyCodeInput.focus();
        return;
      }
      lobbyRequestBusy = true;
      setLobbyStatus("Joining lobby…");
      updateLobbyInterface();
      const result = await requestLobby("lobby:join", { code, profile });
      lobbyRequestBusy = false;
      if (applyLobbyResult(result)) lobbyCodeInput.value = "";
      updateLobbyInterface();
    };

    async function leaveActiveLobby() {
      if (!activeLobbyCode) return;
      lobbyRequestBusy = true;
      updateLobbyInterface();
      const result = await requestLobby("lobby:leave");
      clearLobbyState();
      lobbyRequestBusy = false;
      setLobbyStatus(result.ok ? "You left the lobby." : "Lobby connection ended.");
      updateLobbyInterface();
    }

    document.getElementById("leaveLobbyBtn").onclick = leaveActiveLobby;
    document.getElementById("modeLeaveLobbyBtn").onclick = leaveActiveLobby;
    document.getElementById("manageLobbyBtn").onclick = () => setMenuStage("multiplayer");

    document.getElementById("copyLobbyCodeBtn").onclick = async () => {
      if (!activeLobbyCode) return;
      try {
        await navigator.clipboard.writeText(activeLobbyCode);
        setLobbyStatus("Lobby code copied.");
      } catch (error) {
        lobbyCodeInput.value = activeLobbyCode;
        lobbyCodeInput.focus();
        lobbyCodeInput.select();
        setLobbyStatus("Clipboard unavailable. The code is selected so you can copy it.");
      }
    };
    updateLobbyInterface();

    setInterval(() => {
      if (!multiplayerSocket.connected || !camera) return;

      multiplayerSocket.emit("player:update", {
        position: {
          x: camera.position.x,
          y: camera.position.y - curEye,
          z: camera.position.z,
        },
        aim: { yaw, pitch },
      });
    }, 50);
  </script>

/* pause */
.pRow{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:17px;letter-spacing:.05em}

/* ===== round win / loss splash (full-screen title card) ===== */
.spl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;animation:splOut .28s ease-in .88s forwards}
.spl::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 4px),radial-gradient(circle,rgba(255,255,255,.08) 1px,transparent 1.5px) 0 0/9px 9px;opacity:.55;animation:scan 6s linear infinite}
.spl::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.45) 100%);pointer-events:none}
.splT{position:relative;z-index:2;font-size:clamp(56px,14vw,210px);font-weight:800;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:#fff;text-shadow:0 0 40px rgba(180,230,255,.35);animation:splIn .34s cubic-bezier(.15,.9,.2,1) both,glitch 1s .34s steps(1) 1}
.spl.loss .splT{text-shadow:0 0 40px rgba(255,110,80,.4)}
.splT::before,.splT::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden;opacity:0}
.splT::before{color:#7fe4ff;animation:gl1 1s .34s steps(1) 1}
.splT::after{color:#ff6b6b;animation:gl2 1s .34s steps(1) 1}
.splD{position:absolute;z-index:2;left:0;bottom:-.34em;height:.12em;width:100%;display:flex;gap:.06em;font-size:inherit;opacity:.85}
.splD i{display:block;height:100%;background:repeating-linear-gradient(90deg,#fff 0 .025em,transparent .025em .05em),repeating-linear-gradient(0deg,#000 0 .03em,transparent .03em .06em);background-blend-mode:multiply;animation:ditherIn .28s .2s both}
.splD i:nth-child(1){width:.12em}.splD i:nth-child(2){width:.12em}.splD i:nth-child(3){width:.28em;margin-left:.06em}
/* ===== round result scoreboard ===== */
.rs{position:absolute;inset:0;display:flex;flex-direction:column;padding:clamp(14px,3vh,34px) clamp(18px,3.5vw,56px) 0;overflow:hidden}
#mpModal.loss .scrTitle{color:#ffd0c4;text-shadow:0 0 30px rgba(255,100,70,.3)}
#mpModal.loss .scrChip{background:#ffd0c4;color:#3a0d06}
#mpModal.draw .scrTitle{color:#ffe9a8}#mpModal.draw .scrChip{background:#ffe9a8;color:#3a2c05}
.rsScore{display:flex;align-items:center;justify-content:center;gap:clamp(18px,6vw,90px);margin:clamp(0px,1vh,10px) 0 clamp(6px,1.5vh,18px)}
.rsN{font-size:clamp(70px,13vh,150px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;animation:numIn .32s .08s cubic-bezier(.2,1.4,.3,1) both}
.rsN.f{color:#31d2ff;text-shadow:0 0 36px rgba(49,210,255,.45)}.rsN.e{color:#ff5a3c;text-shadow:0 0 36px rgba(255,90,60,.45)}
.rsEm{position:relative;display:grid;place-items:center;width:clamp(120px,22vh,210px);height:clamp(120px,22vh,210px)}
.rsEm::before{content:"";position:absolute;inset:0;border:2px dashed rgba(190,230,240,.35);border-radius:50%;animation:spin 18s linear infinite}
.rsEm::after{content:"";position:absolute;inset:12%;border:1px solid rgba(190,230,240,.3);border-radius:50%}
.rsEm .resEmblem{width:54%;position:relative;z-index:1;animation:emPop .32s .04s cubic-bezier(.2,1.4,.3,1) both}
.rsTag{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.24em;text-transform:uppercase;padding:0 2px 6px}
.rsTag .f{color:#31d2ff}.rsTag .e{color:#ff5a3c}
.rsTabs{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,3vw,44px);flex:1;min-height:0;overflow:auto;align-content:start}
@media(max-width:820px){.rsTabs{grid-template-columns:1fr}}
.rsTbl{background:rgba(0,0,0,.28)}
.rsRow{display:grid;grid-template-columns:30px 1fr 64px 54px 54px 66px;align-items:center;padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.07);font-size:clamp(14px,1.9vh,17px);font-variant-numeric:tabular-nums;animation:rowIn .24s both;animation-delay:calc(.12s + var(--i)*35ms)}
.rsRow.cols{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8fb2c0;background:rgba(0,0,0,.35);animation:none}
.rsRow>span:nth-child(n+3){text-align:center}
.rsRow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;letter-spacing:.04em}

.rsRow .mvp{margin-left:8px;padding:0 6px;background:#ffd24d;color:#201800;font-size:10px;letter-spacing:.2em}

.rsBar{display:flex;align-items:center;gap:clamp(14px,3vw,44px);flex-wrap:wrap;margin:10px calc(-1*clamp(18px,3.5vw,56px)) 0;padding:12px clamp(18px,3.5vw,56px);background:linear-gradient(180deg,rgba(40,32,10,.55),rgba(8,10,12,.9));border-top:1px solid rgba(255,210,77,.55);animation:barIn .28s .08s both}
.rsBar .who{font-size:18px;font-weight:800;letter-spacing:.06em;color:#ffd24d}.rsBar .who small{display:block;font-size:11px;letter-spacing:.24em;color:#9fb0c4;font-weight:600}
.rsBar .st{text-align:center}.rsBar .st small{display:block;font-size:11px;letter-spacing:.24em;color:#c3d0dd}.rsBar .st b{font-size:22px;color:#fff}
.rsBar .sp{flex:1}
.rdyInfo{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#cfe0e8}.rdyInfo b{color:#fff;font-size:20px}
.noanim .rsRow,.noanim .rsN,.noanim .rsEm .resEmblem,.noanim .rsBar,.noanim .scrTitle,.noanim .scrChip,.noanim .scrSub{animation:none!important}
.resEmblem{width:clamp(92px,15vw,150px);filter:drop-shadow(0 6px 22px rgba(0,0,0,.55))}
/* kill counter (center-top, after every kill) */
#mpCount{position:fixed;left:50%;top:21%;transform:translateX(-50%);z-index:13;display:flex;align-items:center;gap:14px;pointer-events:none;font-family:Bahnschrift,"Arial Narrow",Arial,sans-serif;text-shadow:0 2px 6px #000;opacity:0}
#mpCount.show{animation:cntShow 2.6s ease-out forwards}
#mpCount .n{position:relative;font-size:clamp(40px,6vh,64px);font-weight:900;min-width:1.2ch;text-align:center;line-height:1}
#mpCount .n.f{color:#31d2ff}#mpCount .n.e{color:#ff7a3c}
#mpCount .n.drop::after{content:"";position:absolute;left:50%;top:100%;margin-left:-9px;border:9px solid transparent;border-top:12px solid currentColor;animation:bob .5s ease-in-out infinite alternate}
#mpCount .vs{font-size:20px;letter-spacing:.2em;color:#e6eef5;font-weight:700}
@keyframes cntShow{0%{opacity:0;transform:translateX(-50%) scale(.6)}12%{opacity:1;transform:translateX(-50%) scale(1.15)}22%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes bob{to{transform:translateY(4px)}}
@keyframes scrIn{from{opacity:0}to{opacity:1}}
@keyframes slideL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes barIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes numIn{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:none}}
@keyframes emPop{from{opacity:0;transform:scale(.3) rotate(-30deg)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes splIn{from{opacity:0;transform:scale(1.35);letter-spacing:.14em;filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes splOut{to{opacity:0}}
@keyframes scan{to{background-position:0 120px,0 0}}
@keyframes ditherIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes glitch{0%,100%{transform:none}8%{transform:translate(-6px,2px)}9%{transform:translate(5px,-2px)}10%{transform:none}52%{transform:translate(8px,0) skewX(8deg)}54%{transform:none}}
@keyframes gl1{0%,100%{opacity:0}8%{opacity:.85;clip-path:inset(10% 0 60% 0);transform:translate(-9px,0)}9%{opacity:.85;clip-path:inset(55% 0 12% 0);transform:translate(7px,0)}10%{opacity:0}52%{opacity:.8;clip-path:inset(30% 0 35% 0);transform:translate(10px,0)}54%{opacity:0}}
@keyframes gl2{0%,100%{opacity:0}8%{opacity:.8;clip-path:inset(60% 0 8% 0);transform:translate(9px,0)}9%{opacity:.8;clip-path:inset(5% 0 70% 0);transform:translate(-8px,0)}10%{opacity:0}53%{opacity:.75;clip-path:inset(45% 0 25% 0);transform:translate(-10px,0)}55%{opacity:0}}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.spl,.splT,.scr,.rsRow,.wCard{animation-duration:.01s!important}}

#lobbyRoster{display:flex;flex-direction:column;gap:6px;width:min(420px,100%);margin:6px 0}
#lobbyRoster .pl{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-left:3px solid #4dff88;font-weight:700}
#lobbyRoster .pl small{color:#9fb0c4;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
#lobbyRoster .pl em{font-style:normal;color:#ffd24d;font-size:11px;letter-spacing:.2em;margin-left:8px}
.mpProfileCard{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:10px 0 16px;padding:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:12px}
.mpProfileCard label{align-self:end;color:#d6e0ed}.mpProfileCard input,.mpProfileCard select{box-sizing:border-box;min-width:0;padding:10px;border-radius:8px;border:1px solid #53627a;background:#0e131b;color:white}
@media(max-width:560px){.mpProfileCard{grid-template-columns:1fr}.mpProfileCard label{margin-bottom:-6px}}
</style>
<div id="mpHud" hidden></div><div id="mpCount"></div><div id="mpFeed"></div><div id="mpBanner" hidden></div>
<div id="mpModal" hidden><div id="mpCard"><div id="mpContent"></div></div></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const modal = $("mpModal"), content = $("mpContent");
  let mpState = null, mpResult = null, mpTeams = {}, mpReadySent = false;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  try {
    const savedName = localStorage.getItem("fpsLobbyUsername");
    const savedSkin = localStorage.getItem("fpsLobbySkin");
    if (savedName && $("mpUsername")) $("mpUsername").value = savedName.slice(0, 16);
    if (savedSkin && $("mpSkin") && ["rifler", "shotgun", "sniper", "heavy"].includes(savedSkin)) $("mpSkin").value = savedSkin;
  } catch {}
  function ownerKey() {
    try {
      let key = localStorage.getItem("fpsLobbyOwnerKey");
      if (!key) {
        key = window.crypto?.randomUUID?.() || `owner-${Math.random().toString(36).slice(2)}-${Date.now().toString(36)}`;
        localStorage.setItem("fpsLobbyOwnerKey", key);
      }
      return key;
    } catch {
      return `owner-${Math.random().toString(36).slice(2)}-${Date.now().toString(36)}`;
    }
  }
  const profile = () => {
    const username = ($("mpUsername")?.value || "").replace(/[<>]/g, "").trim().replace(/\s+/g, " ").slice(0, 16);
    const skin = $("mpSkin")?.value || "";
    try {
      if (username) localStorage.setItem("fpsLobbyUsername", username);
      localStorage.setItem("fpsLobbySkin", skin);
    } catch {}
    return { username, skin, ownerKey: ownerKey() };
  };
  window.__fpsProfile = profile;
  window.__fpsVersusActive = false; window.__fpsLocalTeam = null;
  function hide(){modal.hidden=true;modal.className="";}
  function request(event,data={}) { return new Promise(resolve=>multiplayerSocket.emit(event,data,r=>resolve(r||{ok:false,error:"No server response"}))); }
  function host(){return !!mpState && mpState.hostId===multiplayerSocket.id;}
  function statusLine(t){return `<div class="mpStatus">${esc(t)}</div>`;}
  // ---------- deterministic helpers (every client must build the same map / spawn slots) ----------
  function mulberry(seed){let a=(seed>>>0)||1;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
  function withSeededRandom(seed,fn){const orig=Math.random;Math.random=mulberry(seed);try{return fn();}finally{Math.random=orig;}}

  // true when a standing player of radius R at (x,z) with feet at `feet` touches nothing solid
  function spotFree(x,z,feet,R){
    const b=currentBounds;
    if(Math.abs(x)>b.x-R-0.5||z<b.zMin+R+0.5||z>b.zMax-R-0.5)return false;
    for(const bx of obstacleBoxes){if(bx.max.y<=feet+0.3||bx.min.y>=feet+2.0)continue;if(circleIntersectsBox(x,z,R,bx))return false;}
    return true;
  }

  // Versus: random valid standing spots on the real map (never in walls, never in the ocean on the sea map).
  // Spots are picked uniformly at random with a minimum spacing, so every round looks different.
  function computeSpawnSlots(count,seed,mapName){
    const rng=mulberry(seed^0x9e3779b9),b=currentBounds,R=0.9,sea=mapName==="sea";
    const zMid=(b.zMin+b.zMax)/2,width=b.x*2,length=b.zMax-b.zMin;
    const deckLevels=(x,z)=>{const out=[];for(const bx of obstacleBoxes){if(bx.max.y<0.3||bx.max.y>25)continue;if(bx.max.x-bx.min.x<3||bx.max.z-bx.min.z<3)continue;if(x>bx.min.x+0.6&&x<bx.max.x-0.6&&z>bx.min.z+0.6&&z<bx.max.z-0.6)out.push(bx.max.y);}return out;};
    const pts=[],margin=3;
    const sample=()=>[(rng()*2-1)*(b.x-margin),b.zMin+margin+rng()*(length-2*margin)];
    if(sea){
      const raw=[],hist=new Map();
      for(let i=0;i<6000&&raw.length<3000;i++){const [x,z]=sample();for(const T of deckLevels(x,z)){if(!spotFree(x,z,T,R))continue;raw.push([x,z,T]);const k=Math.round(T*10);hist.set(k,(hist.get(k)||0)+1);}}
      let best=null,bn=0;for(const [k,n] of hist)if(n>bn){bn=n;best=k;}
      for(const r of raw)if(Math.round(r[2]*10)===best)pts.push(r);
    }else{
      for(let i=0;i<12000&&pts.length<2500;i++){const [x,z]=sample();if(spotFree(x,z,0,R))pts.push([x,z,0]);}
    }
    if(!pts.length)return Array.from({length:count},(_,i)=>[(i-count/2)*2,zMid,0]);
    for(let i=pts.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[pts[i],pts[j]]=[pts[j],pts[i]];}
    const chosen=[];let sep=Math.max(8,Math.min(width,length)*0.4);
    while(chosen.length<count){
      let placed=false;
      for(const p of pts){if(chosen.includes(p))continue;if(chosen.every(c=>Math.hypot(c[0]-p[0],c[1]-p[1])>=sep)){chosen.push(p);placed=true;break;}}
      if(!placed){sep*=0.8;if(sep<0.6){while(chosen.length<count)chosen.push(pts[Math.floor(rng()*pts.length)]);}}
    }
    return chosen;
  }

  // Co-op: players start next to each other (a tidy row/grid around the normal start point).
  function coopGather(){
    if(!activeLobbyCode||!mpState?.players||mpState.players.length<2)return;
    const idx=mpState.players.findIndex(p=>p.id===multiplayerSocket.id);if(idx<0)return;
    const feet=camera.position.y-PLAYER.height,bx=camera.position.x,bz=camera.position.z;
    const dx=((idx%4)-1.5)*1.7,dz=Math.floor(idx/4)*1.7;
    let x=bx+dx,z=bz+dz;
    if(!spotFree(x,z,feet,0.5)){
      let found=false;
      for(let r=1;r<=7&&!found;r++)for(let a=0;a<14;a++){const xx=bx+dx+Math.cos(a/14*6.2832)*r*0.9,zz=bz+dz+Math.sin(a/14*6.2832)*r*0.9;if(spotFree(xx,zz,feet,0.5)){x=xx;z=zz;found=true;break;}}
      if(!found){x=bx;z=bz;}
    }
    camera.position.x=x;camera.position.z=z;
  }
  const _baseStartRun=window.startRun;
  window.startRun=function(){_baseStartRun.apply(this,arguments);try{if(!window.__fpsVersusActive)coopGather();}catch(e){console.warn(e);}};

  // ---------- state ----------
  let savedHotbar=null,savedSolo=null,countdownTimer=null,stageTimer=null,matchStage=0,mpPaused=false,mpSettingsOpen=false,fellSent=false,mpDraft=null;
  const TEAM_NAME={red:"Red team",blue:"Blue team"},TEAM_HEX={red:"#ff5a5a",blue:"#4db8ff"};
  const SKIN_LABEL={rifler:"Rifler",shotgun:"Shotgunner",sniper:"Sniper",heavy:"Heavy"};
  const cntEl=$("mpCount"),hudEl=$("mpHud"),feedEl=$("mpFeed"),banEl=$("mpBanner");
  function show(html,cls){content.innerHTML=html;modal.className=cls||"";modal.hidden=false;}
  function hideBanner(){banEl.hidden=true;banEl.innerHTML="";}
  function leaveToMenu(){
    dismissPauseSettings();
    clearInterval(countdownTimer);clearTimeout(stageTimer);mpPaused=false;matchStage=0;
    window.__fpsVersusActive=false;window.__fpsLocalTeam=null;PLAYER_MAX_HP=100;
    roundActive=false;document.exitPointerLock?.();
    window.__fpsHoldOverlay=false;
    if(savedHotbar){hotbar=savedHotbar;savedHotbar=null;updateHotbarHud();}window.__fpsSoloHotbar=null;
    ldBuilt=false;clearInterval(ldTick);cntEl.classList.remove("show");
    if(savedSolo){settings.map=savedSolo.map;settings.mode=savedSolo.mode;settings.sandbox=savedSolo.sandbox;if(savedSolo.sideUtility)settings.sideUtility=savedSolo.sideUtility;savedSolo=null;}window.__fpsSoloMenuSettings=null;
    mpState=null;mpResult=null;mpDraft=null;
    hide();hideBanner();hudEl.hidden=true;feedEl.innerHTML="";
    const r=$("lobbyRoster");if(r)r.innerHTML="";
    clearLobbyState();
    deathBackToMenu();            // rebuilds the preview map and shows the first menu
    overlayEl.style.display="flex";
    setMenuStage("multiplayer");
    setLobbyStatus("You left the lobby.");
  }
  function wireLeave(id){$(id||"mpLeave")?.addEventListener("click",async()=>{await request("lobby:leave");leaveToMenu();});}
  function wireCancel(){$("mpCancel")?.addEventListener("click",()=>multiplayerSocket.emit("lobby:cancel"));}

  // ---------- lobby roster (shown on the lobby page) ----------
  function renderRoster(state){
    const el=$("lobbyRoster");if(!el)return;
    el.innerHTML=(state.players||[]).map(p=>`<div class="pl"><span>${esc(p.profile?.username||"Player")}${p.id===state.hostId?"<em>HOST</em>":""}${p.id===multiplayerSocket.id?"<em>YOU</em>":""}</span><small>${esc(SKIN_LABEL[p.profile?.skin]||"")}</small></div>`).join("");
  }

  // ---------- in-game HUD + kill feed ----------
  function renderHud(state){
    if(!state||state.mode!=="versus"||state.phase!=="playing"||!state.config){hudEl.hidden=true;return;}
    const me=state.players.find(p=>p.id===multiplayerSocket.id),my=me?.team||"blue",other=my==="red"?"blue":"red";
    const alive=t=>state.players.filter(p=>p.team===t&&p.alive).length,total=t=>state.players.filter(p=>p.team===t).length;
    const need=Math.floor(state.config.rounds/2)+1;
    hudEl.innerHTML=`<div class="tm ${my}"><b>${state.wins[my]}</b><span>${alive(my)}/${total(my)} ALIVE</span></div>
      <div class="mid"><b>ROUND ${state.round}</b><span>FIRST TO ${need}</span></div>
      <div class="tm ${other}"><b>${state.wins[other]}</b><span>${alive(other)}/${total(other)} ALIVE</span></div>`;
    hudEl.hidden=false;
  }
  let lastCounts=null;
  function showCounts(k){
    const st=mpState;if(!k.counts||!st)return;
    const me=st.players?.find(p=>p.id===multiplayerSocket.id),my=me?.team||"blue",ot=my==="red"?"blue":"red";
    const c=k.counts;
    if(c[my].total+c[ot].total<2)return;
    const prev=lastCounts||{[my]:{alive:c[my].total},[ot]:{alive:c[ot].total}};
    const dropF=c[my].alive<prev[my].alive,dropE=c[ot].alive<prev[ot].alive;
    cntEl.innerHTML=`<div class="n f ${dropF?"drop":""}">${c[my].alive}</div><div class="vs">VS</div><div class="n e ${dropE?"drop":""}">${c[ot].alive}</div>`;
    cntEl.classList.remove("show");void cntEl.offsetWidth;cntEl.classList.add("show");
    lastCounts={[my]:{alive:c[my].alive},[ot]:{alive:c[ot].alive}};
  }
  function addKill(k){
    if(k.victimId)(window.__fpsKillerOf||(window.__fpsKillerOf=new Map())).set(k.victimId,k.killerId||null);
    if(!window.__fpsVersusActive)return;
    showCounts(k);
    const d=document.createElement("div");
    d.innerHTML=k.fell?`<span class="${k.victimTeam||""}">${esc(k.victim)}</span><i>fell overboard</i>`
      :`<span class="${k.killerTeam||""}">${esc(k.killer)}</span><i>&#10005;</i><span class="${k.victimTeam||""}">${esc(k.victim)}</span>`;
    feedEl.appendChild(d);
    while(feedEl.children.length>5)feedEl.firstChild.remove();
    setTimeout(()=>{d.style.opacity="0";setTimeout(()=>d.remove(),700);},5000);
  }

  // ---------- menu shell: left roster rail + step bar + stretched panels ----------
  const STEPS=["Lobby","Mode","Setup","Loadout","Match"];
  function sideRoster(){
    const ph=mpState?.phase;
    return (mpState?.players||[]).map(p=>{
      const rdy=ph==="loadout"&&p.loadoutReady;
      return `<div class="sdP ${rdy?"rdy":""}"><i class="${p.team||""}"></i><span>${esc(p.profile?.username||"Player")}</span>${p.id===mpState.hostId?"<em>HOST</em>":""}${p.id===multiplayerSocket.id?'<em class="you">YOU</em>':""}${rdy?"<b>✓</b>":""}</div>`;
    }).join("");
  }
  function shell(step,title,sub,main,foot,top){
    const n=(mpState?.players||[]).length;
    return `<div class="sh${step===3?" loadout":""}"><aside class="shSide"><div class="shBrand"><b>LOBBY CODE</b><span>${esc(mpState?.code||"")}</span></div>
      <div class="shLbl">Players · ${n}</div><div class="shRoster" id="shRoster">${sideRoster()}</div>
      <button class="mpBtn danger" id="mpLeave">Leave lobby</button></aside>
      <section class="shMain"><div class="shTop"><div class="steps">${STEPS.map((x,i)=>`<span class="${i<step?"done":i===step?"on":""}">${x}</span>`).join("")}</div>${top||""}</div>
      <div class="shHead"><h1>${title}</h1><p>${sub}</p></div><div class="shBody">${main}</div><div class="shFoot">${foot||""}</div></section></div>`;
  }
  const ICON_COOP='<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="34" cy="32" r="12"/><circle cx="68" cy="32" r="12"/><path d="M10 82c0-16 10-26 24-26s24 10 24 26M52 82c0-16 8-26 16-26 14 0 22 10 22 26"/></svg>';
  const ICON_VS='<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16l34 34M12 50l18 18M20 84l-8-8"/><path d="M88 16L54 50M88 50L70 68M80 84l8-8"/></svg>';
  function showMode(){
    const h=host(),dis=h?"":"disabled";
    show(shell(1,"Game <u>mode</u>",h?"Choose what everyone in the lobby plays next":"The lobby host is choosing a game mode",
      `<button class="mTile" id="mpCoop" ${dis}>${ICON_COOP}<b>Co-op</b><p>Team up and play together. Everyone spawns side by side and fights as one squad.</p><div class="chips"><span>Squad play</span><span>Shared spawn</span><span>Up to 8</span></div></button>
       <button class="mTile v" id="mpVersus" ${dis}>${ICON_VS}<b>Versus</b><p>Red against Blue in a round-based match. Pick your weapons, then fight to win the most rounds.</p><div class="chips"><span>Red vs Blue</span><span>Loadouts</span><span>Ready each round</span></div></button>`,
      `${h?'<button class="mpBtn" id="mpCancel">Back</button>':statusLine("Waiting for the lobby host…")}`),"screen");
    wireLeave();wireCancel();
    $("mpCoop")?.addEventListener("click",async()=>{const r=await request("match:mode","coop");if(!r.ok)alert(r.error);});
    $("mpVersus")?.addEventListener("click",async()=>{const r=await request("match:mode","versus");if(!r.ok)alert(r.error);});
  }
  function coopReturn(){   // Co-op: back to the first menu, still connected to the lobby
    hide();hudEl.hidden=true;
    if(!roundActive){overlayEl.style.display="flex";showMenu("start");}
    setLobbyStatus("Co-op selected. You're still in the lobby — pick a mode and deploy. You'll spawn next to each other.");
  }
  function currentDraft(){
    const players=mpState?.players||[],d=mpDraft||mpState?.draft||{},teams={};
    players.forEach((p,i)=>{teams[p.id]=d.teams?.[p.id]||(i%2?"blue":"red");});
    return {map:d.map||mpState?.config?.map||"yard",rounds:d.rounds||mpState?.config?.rounds||5,health:d.health||mpState?.config?.health||100,teams};
  }
  function readDraftFromDom(){
    if(!$("mpMap"))return;
    const teams={};document.querySelectorAll("[data-team]").forEach(el=>teams[el.dataset.team]=el.value);
    mpDraft={map:$("mpMap").value,rounds:Number($("mpRounds").value),health:Number($("mpHealth").value),teams};
  }
  function teamCols(players,d,editable){
    const col=t=>{
      const list=players.filter(p=>d.teams[p.id]===t);
      return `<div class="card ${t}"><h3>${TEAM_NAME[t]} <b>${list.length}</b></h3><div class="tmList">${list.map(p=>`<div class="mpRows"><span class="nm">${esc(p.profile?.username||"Player")}</span><select data-team="${esc(p.id)}" ${editable?"":"disabled"} style="color:${TEAM_HEX[t]}"><option value="red" ${t==="red"?"selected":""}>Red</option><option value="blue" ${t==="blue"?"selected":""}>Blue</option></select></div>`).join("")||'<div class="empty">No players</div>'}</div></div>`;
    };
    return col("red")+col("blue");
  }
  function showSetup(){
    const players=mpState?.players||[],h=host(),d=currentDraft(),dis=h?"":"disabled",mi=MAP_INFO[d.map]||{};
    const mapOpts=Object.entries(MAP_INFO).map(([id,m])=>`<option value="${id}" ${id===d.map?"selected":""}>${esc(m.name)}${m.mission?" (mission map)":""}</option>`).join("");
    const need=Math.floor(d.rounds/2)+1;
    show(shell(2,"Versus <u>setup</u>",h?"Choose map, rounds, health and teams":"The host is setting up the match — their choices appear live",
      `<div class="card" style="flex:1"><h3>Map</h3><div class="fld"><label for="mpMap">Select map</label><select id="mpMap" ${dis}>${mapOpts}</select></div>
         <div class="mapBig"><b id="mapName">${esc(mi.name||"")}</b><small id="mapSize">${esc(mi.size||"")}</small><p id="mapDesc">${esc(mi.desc||"")}</p></div></div>
       <div class="card" style="flex:.9"><h3>Rules</h3>
         <div class="fld"><label for="mpRounds">Rounds</label><select id="mpRounds" ${dis}>${[1,3,5,7,9,15].map(n=>`<option value="${n}" ${n===d.rounds?"selected":""}>${n} round${n===1?"":"s"}</option>`).join("")}</select></div>
         <div class="fld"><label for="mpHealth">Player health</label><select id="mpHealth" ${dis}>${[50,100,150,200,300,500].map(n=>`<option value="${n}" ${n===d.health?"selected":""}>${n} HP</option>`).join("")}</select></div>
         <div class="mapBig"><div class="big3"><div><b>${need}</b><span>Wins needed</span></div></div><p>First team to ${need} round win${need===1?"":"s"} takes the match. Everyone picks 2 weapons before it starts.</p></div></div>
       <div style="flex:2.3;display:flex;gap:clamp(12px,1.6vw,24px);min-width:0">${teamCols(players,d,h)}</div>`,
      h?'<button class="mpBtn primary" id="mpStart">Start match</button><button class="mpBtn" id="mpCancel">Back</button>':statusLine("Waiting for the host to start the match…")),"screen");
    wireLeave();wireCancel();
    if(h){
      content.querySelectorAll("select").forEach(el=>el.addEventListener("change",()=>{
        readDraftFromDom();multiplayerSocket.emit("match:draft",mpDraft);
        if(el.dataset.team||el.id==="mpMap"||el.id==="mpRounds"||el.id==="mpHealth")showSetup();   // refresh team columns, map info, wins needed
      }));
      readDraftFromDom();multiplayerSocket.emit("match:draft",mpDraft);
      $("mpStart").addEventListener("click",async()=>{
        readDraftFromDom();$("mpStart").disabled=true;
        let r=await request("match:configure",mpDraft);
        if(r.ok)r=await request("match:start");
        if(!r.ok){alert(r.error);const b=$("mpStart");if(b)b.disabled=false;}
      });
    }
  }
  function showReady(){
    const c=mpState?.config||{},mi=MAP_INFO[c.map]||{},players=mpState?.players||[];
    const tm=t=>`<div class="card ${t}"><h3>${TEAM_NAME[t]} <b>${players.filter(p=>p.team===t).length}</b></h3><div class="tmList">${players.filter(p=>p.team===t).map(p=>`<div class="mpRows" style="grid-template-columns:1fr"><span class="nm">${esc(p.profile?.username||"Player")}</span></div>`).join("")}</div></div>`;
    show(shell(2,"Match <u>ready</u>",host()?"Start the match — everyone picks a loadout next":"Waiting for the host to start",
      `<div class="card" style="flex:1.3"><h3>Match</h3><div class="big3"><div><b>${c.rounds||5}</b><span>Rounds</span></div><div><b>${c.health||100}</b><span>HP</span></div><div><b>${players.length}</b><span>Players</span></div></div>
        <div class="mapBig"><b>${esc(mi.name||"Map")}</b><small>${esc(mi.size||"")}</small><p>${esc(mi.desc||"")}</p></div></div>${tm("red")}${tm("blue")}`,
      host()?'<button class="mpBtn primary" id="mpStart">Start match</button>':statusLine("Waiting for the host to start the match…")),"screen");
    wireLeave();$("mpStart")?.addEventListener("click",async()=>{const r=await request("match:start");if(!r.ok)alert(r.error);});
  }

  // ---------- loadout screen ----------
  let ldSel=[],ldReady=false,ldBuilt=false,ldDeadline=0,ldTick=null,ldUtility="frag";
  const TYPE_LABEL={sniper:"Primary · AWP",rifle:"Primary · M4",shotgun:"Primary · Shotgun",pistol:"Secondary · Glock",smg:"Primary · MP5",melee:"Secondary · Knife"};
  const MP_PRIMARY_IDS=new Set([1,2,3,5]),MP_SECONDARY_IDS=new Set([4,6]),UT_TAG={frag:"Lethal",flash:"Tactical",smoke:"Tactical"};
  function normalizeMpLoadout(raw){
    let primary=null,secondary=null;
    for(const id of Array.isArray(raw)?raw:[]){
      const n=Number(id);
      if(!weapons[n])continue;
      if(MP_PRIMARY_IDS.has(n)&&primary===null)primary=n;
      else if(MP_SECONDARY_IDS.has(n)&&secondary===null)secondary=n;
    }
    return [primary,secondary].filter(id=>id!==null);
  }
  function wStats(w){
    const dmg=Math.min(1,w.bodyDmg*(w.pellets>1?w.pellets*.7:1)/120),rate=Math.min(1,Math.max(.08,80/w.fireRate)),mag=w.magSize?Math.min(1,w.magSize/30):1;

        mg.beginPath();mg.arc(c+sx*S,c+sy*S,5*DPR,0,6.2832);mg.fillStyle=col;mg.fill();mg.lineWidth=1.5*DPR;mg.strokeStyle="#fff";mg.stroke();
      }
      mg.beginPath();mg.moveTo(c,c-8*DPR);mg.lineTo(c+6*DPR,c+6*DPR);mg.lineTo(c,c+3*DPR);mg.lineTo(c-6*DPR,c+6*DPR);mg.closePath();mg.fillStyle="#fff";mg.fill();   // you
      mini.style.borderColor=col;
    }
    function drawCompass(){
      const h=((-yaw*180/Math.PI)%360+360)%360,ppd=CW/110;
      cg.setTransform(DPR,0,0,DPR,0,0);cg.clearRect(0,0,CW,CH);cg.textAlign="center";cg.font='600 13px Bahnschrift,"Arial Narrow",Arial,sans-serif';
      for(let a=Math.floor((h-60)/5)*5;a<=h+60;a+=5){
        const x=CW/2+(a-h)*ppd,n=((a%360)+360)%360,major=n%15===0;
        cg.strokeStyle="rgba(255,255,255,.85)";cg.lineWidth=major?2:1;cg.beginPath();cg.moveTo(x,4);cg.lineTo(x,major?15:10);cg.stroke();
        if(major){cg.fillStyle=n%45===0?"#fff":"rgba(255,255,255,.75)";cg.shadowColor="#000";cg.shadowBlur=3;cg.fillText(n%45===0?NAMES[n/45]:String(n),x,29);cg.shadowBlur=0;}
      }
      const deg=String(Math.round(h)%360),card=NAMES[Math.round(h/45)%8],zone=(MAP_INFO[runMap]||{}).name||"",txt=card+" "+deg;
      cg.font='700 14px Bahnschrift,"Arial Narrow",Arial,sans-serif';const tw=cg.measureText(txt).width;cg.font='600 12px Bahnschrift,"Arial Narrow",Arial,sans-serif';const zw=cg.measureText(zone).width,bw=tw+zw+36;
      cg.globalCompositeOperation="destination-in";const gr=cg.createLinearGradient(0,0,CW,0);gr.addColorStop(0,"rgba(0,0,0,0)");gr.addColorStop(.18,"rgba(0,0,0,1)");gr.addColorStop(.82,"rgba(0,0,0,1)");gr.addColorStop(1,"rgba(0,0,0,0)");cg.fillStyle=gr;cg.fillRect(0,0,CW,CH);cg.globalCompositeOperation="source-over";
      cg.fillStyle="rgba(5,9,14,.72)";cg.strokeStyle="rgba(255,255,255,.55)";cg.lineWidth=1;cg.beginPath();cg.rect(CW/2-bw/2,36,bw,21);cg.fill();cg.stroke();
      cg.textAlign="left";cg.fillStyle="#fff";cg.font='700 14px Bahnschrift,"Arial Narrow",Arial,sans-serif';cg.fillText(txt,CW/2-bw/2+10,52);cg.fillStyle="rgba(255,255,255,.75)";cg.font='600 12px Bahnschrift,"Arial Narrow",Arial,sans-serif';cg.fillText(zone,CW/2-bw/2+tw+26,52);
      cg.fillStyle="#fff";cg.beginPath();cg.moveTo(CW/2-4,0);cg.lineTo(CW/2+4,0);cg.lineTo(CW/2,5);cg.fill();
    }
    function loop(t){
      requestAnimationFrame(loop);
      const on=!!(window.__fpsVersusActive&&roundActive&&typeof camera!=="undefined"&&camera);
      if(mini.hidden===on){mini.hidden=comp.hidden=!on;document.body.classList.toggle("mpNav",on);}
      if(!on||t-last<33)return;last=t;try{drawMini();drawCompass();}catch(e){}
    }
    requestAnimationFrame(loop);
  })();

  window.addEventListener("fps-match-start",e=>startRound(e.detail));
  document.addEventListener("click",e=>{if(mpPaused||mpSettingsOpen||!modal.hidden||e.target.closest?.("#mpModal,#mpBanner"))return;if(window.__fpsVersusActive&&roundActive&&document.pointerLockElement!==renderer.domElement)requestLock();});
  document.getElementById("createLobbyBtn")?.addEventListener("click",()=>multiplayerSocket.emit("lobby:profile",profile()));
  document.getElementById("joinLobbyBtn")?.addEventListener("click",()=>multiplayerSocket.emit("lobby:profile",profile()));
  document.getElementById("continueLobbyBtn")?.addEventListener("click",async()=>{if(!host()){return;}const r=await request("lobby:continue");if(!r.ok)alert(r.error);});

  multiplayerSocket.on("lobby:state",state=>{
    mpState=state;
    if(state.phase==="playing"){
      const self=state.players?.find(p=>p.id===multiplayerSocket.id);
      if(self){
        const lostHp=Math.max(0,playerHP-self.hp);
        window.__fpsLocalTeam=self.team||window.__fpsLocalTeam;
        playerHP=self.hp;updatePlayerHealthBar();
        if(lostHp>0){flashHealthBar();showBloodEdges(lostHp);}
        if(self.alive===false&&roundActive){
          startLocalVersusDeathFall();
          dismissPauseSettings();
          if(mpPaused){mpPaused=false;hide();}
          roundActive=false;document.exitPointerLock?.();
        }
      }
    }
    showLobbyPhase();
  });
  multiplayerSocket.on("lobby:draft",d=>{if(!host()&&mpState){mpState.draft=d;if(mpState.phase==="versus-setup")showSetup();}});
  multiplayerSocket.on("lobby:coop",state=>{mpState=state;coopReturn();});
  multiplayerSocket.on("match:started",state=>{mpState=state;startRound(state);});
  multiplayerSocket.on("match:kill",addKill);
  multiplayerSocket.on("match:result",data=>{
    mpResult=data;mpState=data.state;roundActive=false;window.__fpsVersusActive=false;mpPaused=false;matchStage=0;
    dismissPauseSettings();
    window.__fpsHoldOverlay=true;overlayEl.style.display="none";   // keep the live game view (your own camera) behind the result screens
    document.exitPointerLock?.();
    cntEl.classList.remove("show");
    showResult(data);   // title card first, then the scoreboard
  });
  multiplayerSocket.on("connect",()=>{if(activeLobbyCode)multiplayerSocket.emit("lobby:profile",profile());});
})();
</script>
</body>
