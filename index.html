function shoot() {
  if (!roundActive || reloading || swapping || grenadeEquipped) return;
  if (sprintActive()) return;   // can't shoot while sprinting
  if (throwState) return;       // hands are busy throwing a grenade

  const w = weapons[curWeaponNum];
  const st = ammoState[curWeaponNum];
  const now = gNow();
  if (w.type === "melee") {
    startKnifeAttack(false);
    return;
  }
  if (st.mag <= 0) { GunSFX.dryClick(); return; }


  if (now - current.lastShot < w.fireRate) return;
  current.lastShot = now;
  lastShotTime = now;
  lastShotPos.copy(camera.position);

  st.mag--; shots++;
  hipBloom = Math.min(1.2, hipBloom + 0.18);
  GunSFX.fire(w.type === "pistol" ? "rifle" : w.type);   // the Glock cracks like the M4A1

  // recoil impulses
  const recoilImpulse = (w.type === "sniper") ? 0.45 : (w.type === "shotgun") ? 0.7 : (w.type === "pistol") ? 0.55 : 0.26;
  recoil = Math.max(recoil, recoilImpulse);
  gunFlip = 1;
  shakeAmp = ((w.type === "sniper") ? 0.006 : (w.type === "shotgun") ? 0.005 : 0.0035) * (scoped || gunAimBlend > 0.5 ? 1.25 : 0.6);   // one small jolt per shot
  shakeT = SHAKE_DURATION;

  let anyHit = false;
  let anyCrit = false;
  let totalDamage = 0;   // damage this shot actually dealt (drives knockback)
  const triggeredGrenades = new Set();

  for (let p = 0; p < w.pellets; p++) {
    const dir = getShotDirection(w.spread, true);
    const res = castBullet(camera.position.clone(), dir);

    spawnBullet(res.point);
    if (res.normal) addBulletHole(res.point, res.normal, w.pellets > 1 ? 0.6 : 1);

    if (res.type === "grenade") {
      if (!triggeredGrenades.has(res.grenade)) {
        triggeredGrenades.add(res.grenade);
        if (requestGrenadeShot(res.grenade,w,dir)) anyHit=true;
      }
      continue;
    }
    if (res.type === "enemy" && res.enemy?.userData.remotePlayerId) {
      anyHit = true;
      if (window.__fpsVersusActive && res.enemy.userData.team !== window.__fpsLocalTeam) {
        const headHit = res.part === "head";
        multiplayerSocket.emit("match:hit", { targetId: res.enemy.userData.remotePlayerId, damage: Math.min(120, headHit ? w.headDmg : w.bodyDmg) });
        spawnHitParticles(res.point, 0x8b0a10);
        spawnVersusBloodHit(res.point, headHit ? 1.35 : 1);
        flashHitMarker(headHit);
        if (headHit) anyCrit = true;
      }
    } else if (res.type === "enemy" && res.enemy && res.enemy.userData.hp > 0) {
      anyHit = true;

      const head = (res.part === "head");
      const dmg = head ? w.headDmg : w.bodyDmg;

      res.enemy.userData.hp -= dmg; res.enemy.userData.lastHitAt = gNow();
      totalDamage += dmg;
      res.enemy.userData.lastSeenPlayer = camera.position.clone();
      res.enemy.userData.lastSeenTime = gNow();
      res.enemy.userData.state = "engage";
      res.enemy.userData.reactionAt = gNow() + rand(AI.reactionMin, AI.reactionMax) * 1000;

      drawHealthBar(res.enemy);
      spawnHitParticles(res.point, settings.blood ? 0x4a0606 : head ? 0x88d7ff : 0xffe066);

      // points per hit
      score += head ? 65 : 30;
      if (head) anyCrit = true;

      if (res.enemy.userData.hp <= 0) {
        startEnemyDeath(res.enemy, camera.position);
        const idx = enemies.indexOf(res.enemy);
        if (idx >= 0) enemies.splice(idx, 1);
        onEnemyKilled(res.enemy, head);
      }
    }
  }

  // Mossberg fired at the ground launches you upward (instead of the usual backwards shove)
  const groundBlast = w.type === "shotgun" && tryShotgunGroundBlast();
  if (!groundBlast) applyPlayerKnockback(w.type);

  if (anyHit) {
    hits++;
    flashHitMarker(anyCrit);
  }

  if (w.type === "sniper") boltOpen = true;
  else if (w.type === "shotgun") pumpOpen = true;

  triggerMuzzleFlash();
  ejectCasing();
  updateHUD();
}

// -----------------------
// Ammo / reload
// -----------------------
function startReload() {
  if (reloading || !roundActive || swapping) return;
  if (sprintActive()) return;   // can't reload while sprinting
  if (throwState) return;
  const w = weapons[curWeaponNum];
  const st = ammoState[curWeaponNum];
  if (w.type === "melee" || st.mag >= w.magSize) return;
  if (missionRun && (st.reserve || 0) <= 0) { updateHUD("No spare ammo"); return; }
  reloading = true;
  reloadEnd = gNow() + w.reloadMs;
  if (scoped) setScoped(false);            // lower the scope so the reload is visible
  beginReloadAnimation(w, st.mag);
  recoil = Math.max(recoil, 0.2);
  GunSFX.foley("handle");
  updateHUD("Reloading...");
}

// -----------------------
// Weapon switching with animation (requested)
// -----------------------
function beginSwap(toWeapon) {
  if (!weapons[toWeapon]) return;
  if (swapping || throwState) return;
  if (grenadeEquipped) {
    grenadeEquipped = false;
    updateWeaponModelVisibility();
  }
  if (toWeapon === curWeaponNum) return;

  // cancel reload/scope if swapping
  reloading = false;
  if (scoped) setScoped(false);

  resetKnifeAttackPose();
  swapping = true;
  swapT = 0;
  swapFromWeapon = curWeaponNum;
  swapToWeapon = toWeapon;
  updateHotbarHud();

  GunSFX.foley("draw");
}

function finishSwap() {
  curWeaponNum = swapToWeapon;
  swapping = false;
  swapT = 0;
  updateWeaponModelVisibility();
  updateHUD("Ready");
}

// -----------------------
// Enemy shooting back (TACTICAL: less frequent, less accurate)
// -----------------------
let _pvX = 0, _pvZ = 0, _pvT = -1, _pvS = 0;
function getPlayerSpeed() {                       // smoothed horizontal speed of the player (m/s), sampled once per frame
  const t = gNow();
  if (t !== _pvT) {
    if (_pvT >= 0 && t > _pvT) _pvS += (Math.min(15, Math.hypot(camera.position.x - _pvX, camera.position.z - _pvZ) / ((t - _pvT) / 1000)) - _pvS) * 0.35;
    _pvX = camera.position.x; _pvZ = camera.position.z; _pvT = t;
  }
  return _pvS;
}
function enemyTryShoot(enemy, playerEye, dt) {
  if (settings.sandbox) return;   // sandbox: enemies never attack
  const now = gNow();
  { const u0 = enemy.userData; if (u0.reloading && now >= u0.reloadUntil) { u0.reloading = false; u0.ammo = u0.magSize; } }
  if (now < enemy.userData.reactionAt || now < (enemy.userData.blindedUntil || 0)) return;
  if (enemy.userData.reloadUntil && now - enemy.userData.reloadUntil > 5000) enemy.userData.reloadUntil = 0;
  if (now < enemy.userData.reloadUntil) return;
  if (now < enemy.userData.nextShot) return;

  const cls = ENEMY_CLASSES[enemy.userData.classKey];

  const enemyEye = enemy.position.clone(); enemyEye.y += 1.6;
  const dist = enemyEye.distanceTo(playerEye);
  if (dist > AI.viewDistance) return;
  if (!hasLineOfSight(enemyEye, playerEye) || lineBlockedBySmoke(enemyEye, playerEye)) return;
  // they can only shoot what they are looking at: no firing while turned away (backing off, turning round)
  { const fy = enemy.rotation.y, tx = playerEye.x - enemy.position.x, tz = playerEye.z - enemy.position.z, tl = Math.hypot(tx, tz) || 1;
    if ((-Math.sin(fy) * tx - Math.cos(fy) * tz) / tl < 0.8) return; }

  // accuracy depends on the weapon's range, and on how fast the player is moving (standing still = easiest to hit)
  const ck = enemy.userData.classKey;
  let acc;
  if (ck === "rifler") acc = 0.80 * clamp(1 - dist / 75, 0.12, 1);
  else if (ck === "shotgun") acc = 0.90 * clamp(1.15 - dist / 22, 0.04, 1);
  else acc = 0.40 + 0.50 * clamp(dist / 45, 0, 1);              // sniper: poor up close, best at long range
  const pSpeed = getPlayerSpeed();
  acc *= clamp(1 - pSpeed / 14, 0.12, 1);                        // walking ~0.46x, sprinting ~0.26x
  acc *= AI.baseAccuracy / 0.34;                                  // difficulty scaling
  acc = clamp(acc, 0.02, 0.95);

  // decide burst
  if (cls.burst) {
    if (enemy.userData.burstShotsLeft <= 0) {
      enemy.userData.burstShotsLeft = Math.floor(rand(AI.burstMin, AI.burstMax));
    }
  } else {
    enemy.userData.burstShotsLeft = 1;
  }

  // fire one shot
  const hitRoll = Math.random() < acc;

  // miss spread increases with distance
  const missScale = clamp(dist / 38, 0.3, 1.2);
  const missOffset = new THREE.Vector3(
    (Math.random()*2-1)*0.85*missScale,
    (Math.random()*2-1)*0.45*missScale,
    (Math.random()*2-1)*0.85*missScale

  const aimPoint = hitRoll ? playerEye.clone() : playerEye.clone().add(missOffset);

  { const dd = aimPoint.clone().sub(enemyEye), L = dd.length(); dd.normalize();
    const s0 = enemyEye.clone().addScaledVector(dd, Math.min(0.6, L * 0.1));
    addTracerColor(s0, s0.clone().addScaledVector(dd, Math.min(60, L * 0.97)), 0xfff5c0, 0.5, 0.85, 3.2, 420); }
  enemy.userData.lastShotAt = gNow();
  try { GunSFX.fireEnemy(enemy.userData.classKey, enemyEye, dist); } catch (e) {}

  if (hitRoll) {
    let rangeMul = 1;
    if (ck === "rifler") rangeMul = clamp(1 - (dist - 30) / 120, 0.7, 1);          // consistent, mild falloff
    else if (ck === "shotgun") rangeMul = clamp(1 - (dist - 5) / 20, 0.08, 1);     // full damage point blank, almost nothing past ~25m
    const dmg = cls.dmg * rangeMul * clamp(0.95 + wave*0.05, 0.95, 1.55);
    takeDamage(dmg);
  }

  enemy.userData.burstShotsLeft--;
  enemy.userData.ammo = (enemy.userData.ammo ?? 30) - 1;
  if (enemy.userData.ammo <= 0) {                                    // dry: reload (ideally behind cover)

    u1.reloading = true; u1.reloadStart = now; u1.reloadUntil = now + (u1.classKey === "shotgun" ? 2500 : u1.classKey === "sniper" ? 2300 : 2000);
    u1.burstShotsLeft = 0; u1.wantCoverReload = true;
    enemyCallout(enemy, "Reloading!");
  }

  if (!cls.burst) {
    enemy.userData.burstShotsLeft = 1;
    enemy.userData.nextShot = now + cls.fireInterval * rand(0.95, 1.08);   // steady cadence: no random pauses
  } else if (enemy.userData.burstShotsLeft <= 0) {
    enemy.userData.nextShot = now + rand(AI.burstPauseMin, AI.burstPauseMax) * 1000 + rand(120, 260);
    // more "breaks" so it's not constant damage
    if (!enemy.userData.reloading && Math.random() < 0.08) enemy.userData.reloadUntil = now + rand(700, 1200);
  } else {
    enemy.userData.nextShot = now + cls.fireInterval + rand(-35, 55);
  }
}

// -----------------------
// Enemy movement + state machine (+ separation so they spread out)
// -----------------------
function steerToward(enemy, goal, speed, dt) {
  const to = goal.clone().sub(enemy.position);
  to.y = 0;
  const dist = to.length();
  if (dist < 0.05) return true;
  to.normalize();
  const ud0 = enemy.userData;
  if ((ud0.avoidUntil || 0) > gNow()) {              // just ran into something head-on: swing round it for a moment
    const side = ud0.avoidSide || 1, px = -to.z, pz = to.x;
    to.x += px * side * 1.3; to.z += pz * side * 1.3;
    to.normalize();
  }

  // the heading eases toward the target instead of snapping: bots take wide corners, ramp up from a standstill and brake into strafe reversals
  if (!ud0.moveDir) ud0.moveDir = new THREE.Vector3();
  const kk = Math.min(1, (dt || 0.016) * 9);
  ud0.moveDir.x += (to.x - ud0.moveDir.x) * kk; ud0.moveDir.z += (to.z - ud0.moveDir.z) * kk; ud0.steered = true;
  enemy.userData.vel.x = ud0.moveDir.x * speed;
  enemy.userData.vel.z = ud0.moveDir.z * speed;

  // facing is applied once per frame at the end of enemyUpdate (see turnToward)
  if (Math.hypot(ud0.moveDir.x, ud0.moveDir.z) > 0.2) enemy.userData.moveYaw = Math.atan2(-ud0.moveDir.x, -ud0.moveDir.z);

  return dist < 0.8;
}

// Rotate by the shortest way round (the old lerp spun the long way at the +-PI seam)
function turnToward(enemy, targetYaw, dt) {
  let d = targetYaw - enemy.rotation.y;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  enemy.rotation.y += d * Math.min(1, dt * 6);
}

function enemyCollidesAt(x, z, r, feetY = 0) {
  for (const box of obstacleBoxes) {
    if (box.max.y <= feetY + MAX_STEP_HEIGHT) continue; // bots can step up stair treads
    if (box.min.y >= feetY + 1.8) continue;             // and pass below elevated decks
    if (circleIntersectsBox(x, z, r, box)) return true;
  }
  return false;
}

// True only for shots fired recently and within hearing range (the old check used the lifetime shot count)
function heardRecentShot(enemy) {
  if (gNow() - lastShotTime > 1500) return false;
  return Math.hypot(enemy.position.x - lastShotPos.x, enemy.position.z - lastShotPos.z) < AI.hearDistance;
}

function applySeparation(enemy) {
  const sep = new THREE.Vector3();
  for (const other of enemies) {
    if (other === enemy) continue;
    const dx = enemy.position.x - other.position.x;
    const dz = enemy.position.z - other.position.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.001) continue;
    if (d < AI.separationRadius) {
      const push = (AI.separationRadius - d) / AI.separationRadius;
      sep.x += (dx / d) * push;
      sep.z += (dz / d) * push;
    }
  }
  enemy.userData.vel.x += sep.x * AI.separationStrength;
  enemy.userData.vel.z += sep.z * AI.separationStrength;
}

// ---- bot navigation graph ----
function navAdd(x, y, z) {
  navNodes.push({ x, y, z, p: new THREE.Vector3(x, y, z), links: [] });
  return navNodes.length - 1;
}
function navLink(a, b) {
  if (a === b || navNodes[a].links.includes(b)) return;
  navNodes[a].links.push(b); navNodes[b].links.push(a);
}
// place a node on a free spot near (x, z) on the floor at height y (props can be in the way)
function navPlace(x, y, z) {
  const free = (px, pz) => px > -currentBounds.x + 1 && px < currentBounds.x - 1 && pz > currentBounds.zMin + 1 && pz < currentBounds.zMax - 1 &&
    !enemyCollidesAt(px, pz, 0.75, y) && Math.abs(getSupportHeight(px, pz, y) - y) < 0.3;
  let px = x, pz = z;
  if (!free(px, pz)) {

      for (let a = 0; a < 16; a++) {
        const tx = x + Math.cos(a * Math.PI / 8) * r, tz = z + Math.sin(a * Math.PI / 8) * r;
        if (free(tx, tz)) { px = tx; pz = tz; break search; }
      }
  }
  return navAdd(px, y, pz);
}
function navChain(ids) { for (let i = 1; i < ids.length; i++) navLink(ids[i - 1], ids[i]); }

// Can a bot (radius ~0.45) walk the straight segment A->B at height y without hitting anything, and with floor under it the whole way?
// `boxes` = obstacles at that height, `flat` = the surfaces (decks, landings, treads) whose tops are at that height.
function navWalkable(ax, az, bx, bz, boxes, flat, y) {
  const d = Math.hypot(bx - ax, bz - az), n = Math.max(1, Math.ceil(d / 0.8));
  for (let i = 1; i <= n; i++) {
    const t = i / n, x = ax + (bx - ax) * t, z = az + (bz - az) * t;
    for (const box of boxes) if (circleIntersectsBox(x, z, 0.45, box)) return false;
    if (y > 0.5) {                                   // up on a gallery / deck: don't cut across the open void or off a stair side
      let ok = false;
      for (const f of flat) if (x > f.min.x - 0.1 && x < f.max.x + 0.1 && z > f.min.z - 0.1 && z < f.max.z + 0.1) { ok = true; break; }
      if (!ok) return false;
    }
  }
  return true;
}

// cheapest node route from where the bot stands to the node nearest the target (multi-source Dijkstra on a tiny graph).
// A bot only "joins" the graph at nodes it can actually walk to in a straight line, and leaves it at a node with a clear walk to the target:
// that is what stops it trying to cut across the open atrium / over a rail and then standing there pushing on the barrier.
function navPlan(ex, ey, ez, target, ty) {
  const N = navNodes.length, INF = 1e9;
  const dist = new Array(N).fill(INF), prev = new Array(N).fill(-1), done = new Array(N).fill(false);
  const boxesAt = (y) => obstacleBoxes.filter(b => b.max.y > y + MAX_STEP_HEIGHT && b.min.y < y + 1.8);
  const flatAt = (y) => obstacleBoxes.filter(b => b.max.y >= y - 0.3 && b.max.y <= y + 0.35);
  const eBoxes = boxesAt(ey), eFlat = flatAt(ey);

  // standing on a stair flight: the only ways off are its two ends
  let onRoute = null;
  for (const r of stairRoutes) {
    if (Math.abs(ex - r.x) < r.halfW + 0.4 && ez > r.zMin - 0.6 && ez < r.zMax + 0.6 && ey > r.lowY + 0.2 && ey < r.highY - 0.2) { onRoute = r; break; }
  }

    for (const i of [onRoute.nodeLow, onRoute.nodeHigh]) { const n = navNodes[i]; dist[i] = Math.hypot(ex - n.x, ez - n.z) + Math.abs(ey - n.y); }
  } else {

    for (let i = 0; i < N; i++) {
      const n = navNodes[i];
      if (Math.abs(n.y - ey) <= 1.7) cand.push([Math.hypot(ex - n.x, ez - n.z), i]);
    }
    cand.sort((a, b) => a[0] - b[0]);

      if (joined >= 4 || d > 45) break;
      const n = navNodes[i];
      if (d < 1.5 || navWalkable(ex, ez, n.x, n.z, eBoxes, eFlat, ey)) { dist[i] = d; joined++; }
    }
    if (!joined && cand.length) dist[cand[0][1]] = cand[0][0];     // nothing clear: head for the nearest one anyway
  }

    let u = -1, best = INF;
    for (let i = 0; i < N; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
    if (u < 0) break;

    const a = navNodes[u];
    for (const v of a.links) {

// A bot on the ground whose straight walk to the target runs into the foot or flank of a stair flight would just climb it (treads are
// low enough to step onto). Give it a waypoint beside the flight so it goes round instead.
function groundDetour(enemy, target) {

  const dx = target.x - ex, dz = target.z - ez, dist = Math.hypot(dx, dz);
  if (dist < 1) return null;
  for (const r of stairRoutes) {
    if (r.lowY > 1.0) continue;
    const hw = r.halfW + 0.8;
    let hit = false;
    for (let d = 0.7; d < Math.min(dist, 45); d += 0.7) {
      const x = ex + dx / dist * d, z = ez + dz / dist * d;
      if (Math.abs(x - r.x) < hw && z > r.zMin - 0.3 && z < r.zMax + 0.3) { hit = true; break; }
    }
    if (!hit) continue;
    const off = r.halfW + 1.6;
    let wx = Math.abs((r.x + off) - target.x) < Math.abs((r.x - off) - target.x) ? r.x + off : r.x - off;
    wx = clamp(wx, -currentBounds.x + 1, currentBounds.x - 1);

  }

// Next waypoint a bot should head for to reach `target` on another floor (or across an upper gallery), or null to just walk straight.
function enemyNavWaypoint(enemy, target, engageOnly) {
  const ud = enemy.userData;
  if (!navNodes.length || !target) { ud.navPath = null; return null; }
  const ey = enemy.position.y;
  const ty = getSupportHeight(target.x, target.z, target.y);       // works for floor-level and eye-level targets
  let onStair = false;                                              // halfway along a flight: always finish it
  for (const r of stairRoutes) {
    if (Math.abs(enemy.position.x - r.x) < r.halfW + 0.4 && enemy.position.z > r.zMin - 0.6 && enemy.position.z < r.zMax + 0.6 && ey > r.lowY + 0.2 && ey < r.highY - 0.2) { onStair = true; break; }
  }
  const differ = onStair || Math.abs(ty - ey) > 1.0;
  const flat = Math.hypot(target.x - enemy.position.x, target.z - enemy.position.z);
  // ground to ground on a mapped level: if a wall or building is in the way, follow the grid path (through doorways, round corners)
  if (navGrids.length && !differ && !engageOnly) {
    const G = gridAt(ey, 0.35);       // only when actually standing on that level (not part-way up a flight)
    if (G && Math.abs(ty - G.y) < 0.8 && !gridSegmentFree(G, enemy.position.x, enemy.position.z, target.x, target.z)) {
      const gw = gridWaypoint(enemy, target, G);
      if (gw) return gw;
    }
  }
  if (!differ && (engageOnly || ey < 1.0 || flat < 7)) {
    ud.navPath = null;
    if (ey < 1.2 && ty < 0.5 && stairRoutes.length) return groundDetour(enemy, target);
    return null;
  }
  const now = gNow();
  const key = ((target.x / 3) | 0) + "," + ((target.z / 3) | 0) + "," + Math.round(ty);

  }

    const G = gridAt(ey, 0.35);       // only when actually standing on that level (not part-way up a flight)
    if (G && Math.abs(wp.y - G.y) < 0.8 && !gridSegmentFree(G, enemy.position.x, enemy.position.z, wp.x, wp.z)) {
      const gw = gridWaypoint(enemy, wp, G);
      if (gw) return gw;
    }
  }

}

function enemyStairWaypoint(enemy, playerPos) {
  const targetFloor = Math.max(0, playerPos.y - curEye);
  const deltaY = targetFloor - enemy.position.y;
  if (Math.abs(deltaY) < 1.0) {
    enemy.userData.stairRoute = null;
    enemy.userData.stairPhase = null;
    return null;
  }
  const ascending = deltaY > 0;
  let route = enemy.userData.stairRoute;
  const stillUseful = route && (ascending ? route.highY > enemy.position.y + 0.35 : route.lowY < enemy.position.y - 0.35);
  if (!stillUseful) {
    const options = stairRoutes.filter(r => ascending ? r.highY > enemy.position.y + 0.35 : r.lowY < enemy.position.y - 0.35);
    if (!options.length) return null;
    const horizontalDistance = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
    options.sort((a, b) => {

      ud.losVal = hasLineOfSight(enemyEye, playerEye) && !lineBlockedBySmoke(enemyEye, playerEye);
      ud.losNext = tl + 80 + Math.random() * 40;
    }
    canSee = tl >= (ud.blindedUntil || 0) && !!ud.losVal;
  }

  enemy.userData.canSee = canSee; enemy.userData.dist = dist;

  // sensing
  if (canSee) {
    enemy.userData.lastSeenPlayer = playerPos.clone();
    enemy.userData.lastSeenTime = gNow();
    const ud0 = enemy.userData, s0 = ud0.state;
    if (s0 === "patrol" || s0 === "investigate") {
      // first spotted you: react after a short delay
      ud0.state = "engage";
      ud0.stateT = 0;
      ud0.reactionAt = gNow() + rand(AI.reactionMin, AI.reactionMax) * 1000;
      enemyCallout(enemy, ["Contact!", "Enemy spotted!", "There he is!", "I see him!"][(Math.random() * 4) | 0]);
      alertSquad(enemy, playerPos);
    } else if ((s0 === "reposition" || s0 === "retreat") && ud0.chaseUntilSeen) {
      // was only hunting for you and can see you again: back to fighting, no new reaction delay
      ud0.state = "engage";
      ud0.stateT = 0;
      ud0.chaseUntilSeen = false;
    }
    // otherwise (moving to cover / retreating) keep doing that while shooting; the old code flipped the state back to
    // "engage" and reset the reaction timer every frame, so a bot that was too close to you never got to fire
  } else {
    // investigate shots (less immediate)
    if (heardRecentShot(enemy) && (gNow() - enemy.userData.lastSeenTime > 1200)) {
      enemy.userData.lastSeenPlayer = playerPos.clone();
      enemy.userData.lastSeenTime = gNow();
      if (enemy.userData.state === "patrol") {
        enemy.userData.state = "investigate";
        enemy.userData.stateT = 0;
      }
    }
    // reinforcements know roughly where you are and keep coming
    if (enemy.userData.hunter && gNow() - enemy.userData.lastSeenTime > 2500) {
      enemy.userData.lastSeenPlayer = playerPos.clone();
      enemy.userData.lastSeenTime = gNow();
      if (enemy.userData.state === "patrol") { enemy.userData.state = "investigate"; enemy.userData.stateT = 0; }
    }
  }

  // grenade awareness: bail out of the blast radius and shout about it
  if (liveGrenades.length && gNow() > (enemy.userData.nadeCool || 0) && enemy.userData.state !== "retreat") {
    const u = enemy.userData;
    for (const gr of liveGrenades) {
      if (gr.type !== "frag" || !gr.mesh) continue;
      const gp = gr.mesh.position, dx = enemy.position.x - gp.x, dz = enemy.position.z - gp.z;
      if (Math.hypot(dx, dz) > 7.5 || Math.abs(gp.y - enemy.position.y) > 3.5) continue;
      const away = Math.atan2(dz, dx); let goal = null;
      for (const da of [0, 0.7, -0.7, 1.4, -1.4]) {
        const gx = enemy.position.x + Math.cos(away + da) * 9, gz = enemy.position.z + Math.sin(away + da) * 9;
        if (gx > -currentBounds.x + 1 && gx < currentBounds.x - 1 && gz > currentBounds.zMin + 1 && gz < currentBounds.zMax - 1 && !enemyCollidesAt(gx, gz, 0.7, enemy.position.y)) { goal = new THREE.Vector3(gx, enemy.position.y, gz); break; }
      }
      if (goal) { u.goal = goal; u.goalIsCover = false; u.flanking = false; u.state = "retreat"; u.stateT = 0; u.chaseUntilSeen = false; u.calloutCool = 0; enemyCallout(enemy, "GRENADE!", 1800); }
      u.nadeCool = gNow() + 2500;
      break;
    }
  }
  if (gNow() < (enemy.userData.blindedUntil || 0) && !enemy.userData.blindCall) { enemy.userData.blindCall = true; enemy.userData.calloutCool = 0; enemyCallout(enemy, "I can't see!", 2200); }
  else if (gNow() >= (enemy.userData.blindedUntil || 0)) enemy.userData.blindCall = false;

  // damping
  enemy.userData.vel.multiplyScalar(0.82);

  // state logic
  if (enemy.userData.state === "patrol") {
    const a = enemy.userData.patrolAnchor;
    const ph = enemy.userData.patrolPhase + tNow * 0.40 * cls.speed;
    const ps = enemy.userData.patrolScale ?? 1;
    const goal = new THREE.Vector3(
      a.x + Math.sin(ph) * 6.0 * ps,
      0,
      a.z + Math.cos(ph * 0.85) * 4.0 * ps
    );
    const pu = enemy.userData, tn = gNow();
    if (!pu.nextPause) pu.nextPause = tn + rand(2500, 7000);
    if (tn < (pu.patrolPause || 0)) pu.vel.multiplyScalar(0.6);          // stop and scan
    else {
      if (tn > pu.nextPause) { pu.patrolPause = tn + rand(1500, 3200); pu.nextPause = pu.patrolPause + rand(4000, 9000); }
      steerToward(enemy, goal, 2.6 * cls.speed, dt);
    }

  } else if (enemy.userData.state === "investigate") {
    const ls = enemy.userData.lastSeenPlayer;
    if (ls) {
      const done = steerToward(enemy, ls, 3.6 * cls.speed, dt);
      if (done || enemy.userData.stateT > 4.2) {
        enemy.userData.state = "patrol";
        enemy.userData.stateT = 0;
      }
    } else {
      enemy.userData.state = "patrol";
      enemy.userData.stateT = 0;
    }

  } else if (enemy.userData.state === "engage") {
    // tactical reposition timer (skipped while the player is on another floor: climb/descend first)
    const pFloor = getSupportHeight(playerPos.x, playerPos.z, playerPos.y - curEye);
    const floorsDiffer = Math.abs(pFloor - enemy.position.y) > 1.0;
    const ud = enemy.userData, nowE = gNow();
    const hitFresh = !!ud.lastHitAt && ud.lastHitAt !== ud.lastCoverHit && nowE - ud.lastHitAt < 400;
    if (hitFresh) ud.lastCoverHit = ud.lastHitAt;
    // out of ammo / under fire / on the timer: go find cover
    let tryCover = false;
    if (!floorsDiffer) {
      if (ud.wantCoverReload) tryCover = true;
      else if (hitFresh && ud.role !== "flanker" && Math.random() < 0.2) tryCover = true;
      else if (nowE > ud.repositionAt) { tryCover = Math.random() < (ud.classKey === "shotgun" ? 0.12 : 0.4); ud.repositionAt = nowE + rand(AI.repositionEveryMin, AI.repositionEveryMax) * 1000; }
    }
    if (tryCover) {
      const cover = findCoverPosition(enemy.position, playerPos);
      if (cover) {
        ud.goal = cover; ud.goalIsCover = true; ud.flanking = false; ud.state = "reposition"; ud.stateT = 0; ud.chaseUntilSeen = false;
        if (hitFresh) enemyCallout(enemy, "Taking cover!");
      }
      ud.wantCoverReload = false;
      ud.repositionAt = nowE + rand(AI.repositionEveryMin, AI.repositionEveryMax) * 1000;
    }
    // flankers swing round to the side while the others pin you down
    if (ud.state === "engage" && !floorsDiffer && ud.role === "flanker" && nowE > (ud.flankAt || 0) && dist > 9 && !ud.reloading) {
      ud.flankAt = nowE + rand(9000, 16000);
      const base = Math.atan2(enemy.position.z - playerPos.z, enemy.position.x - playerPos.x), side = Math.random() < 0.5 ? 1 : -1, rad = ud.classKey === "shotgun" ? clamp(dist * 0.6, 5, 12) : clamp(dist * 0.85, 9, 24);
      for (const da of [1.35 * side, -1.35 * side, 0.9 * side]) {
        const gx = playerPos.x + Math.cos(base + da) * rad, gz = playerPos.z + Math.sin(base + da) * rad;
        if (gx > -currentBounds.x + 2 && gx < currentBounds.x - 2 && gz > currentBounds.zMin + 2 && gz < currentBounds.zMax - 2 && !enemyCollidesAt(gx, gz, 0.8, enemy.position.y)) {
          ud.goal = new THREE.Vector3(gx, enemy.position.y, gz); ud.goalIsCover = false; ud.flanking = true; ud.state = "reposition"; ud.stateT = 0; ud.chaseUntilSeen = false;
          enemyCallout(enemy, "Flanking!"); break;
        }
      }
    }

    // if no LOS, reposition toward last seen
    if (!canSee && enemy.userData.lastSeenPlayer) {
      enemy.userData.goal = enemy.userData.lastSeenPlayer.clone();
      enemy.userData.goalIsCover = false; enemy.userData.flanking = false;
      enemy.userData.chaseUntilSeen = true;
      enemy.userData.state = "reposition";
      enemy.userData.stateT = 0;
    } else {
      // keep range (more "tactical spacing")
      const preferred = cls.preferredRange;
      const diff = dist - preferred;
      const tol = cls.tol || 4, shotgunC = ud.classKey === "shotgun", rifleC = ud.classKey === "rifler";

      // persistent strafe pattern (peek-strafe left/right with the odd plant-and-shoot) instead of twitchy random steps
      const sniper = ud.classKey === "sniper";
      if (nowE > (ud.strafeUntil || 0)) {
        ud.strafeUntil = nowE + rand(700, 1900);
        const rr = Math.random();
        ud.strafeDir = rr < 0.12 ? 0 : rr < 0.62 ? -(ud.strafeDir || 1) : (ud.strafeDir || (Math.random() < 0.5 ? -1 : 1));
      }
      const toP = playerPos.clone().sub(enemy.position).setY(0).normalize();
      const perp = new THREE.Vector3(-toP.z, 0, toP.x);
      if (ud.strafeDir && enemyCollidesAt(enemy.position.x + perp.x * ud.strafeDir * 1.4, enemy.position.z + perp.z * ud.strafeDir * 1.4, 0.55, enemy.position.y)) { ud.strafeDir = -ud.strafeDir; ud.strafeUntil = nowE + rand(500, 1200); }
      const sd = ud.strafeDir || 0;
      if (diff > tol) {                       // too far: shotguns charge in, riflers close on a diagonal, snipers only creep up
        const goal = enemy.position.clone().addScaledVector(toP, 6.0).addScaledVector(perp, (shotgunC ? 0.8 : 2.2) * (sd || 1));
        steerToward(enemy, goal, (sniper ? 3.2 : shotgunC ? 6.4 : 5.1) * cls.speed, dt);
      } else if (diff < -tol && !shotgunC) {  // too close: riflers and snipers back off to their range
        const back = enemy.position.clone().addScaledVector(toP, -5.0).addScaledVector(perp, 1.2 * (sd || 1));
        if (!enemyCollidesAt(back.x, back.z, 0.6, enemy.position.y)) steerToward(enemy, back, (sniper ? 5.2 : 4.4) * cls.speed, dt);
        else steerToward(enemy, enemy.position.clone().addScaledVector(perp, 3.0 * (sd || 1)), 3.8 * cls.speed, dt);
      } else if (diff < -tol) {               // shotguns that are already on top of you just strafe
        steerToward(enemy, enemy.position.clone().addScaledVector(perp, 3.0 * (sd || 1)), 3.8 * cls.speed, dt);
      } else if (sd && !sniper) {             // in range: strafe
        steerToward(enemy, enemy.position.clone().addScaledVector(perp, 3.0 * sd).addScaledVector(toP, diff < 0 ? -0.4 : 0.4), 3.6 * cls.speed, dt);
      } else enemy.userData.vel.multiplyScalar(0.65);   // plant and shoot
    }

    // shoot
    enemyTryShoot(enemy, playerEye, dt);

    // low hp retreat sometimes
    if (enemy.userData.hp < enemy.userData.maxHp * 0.3 && gNow() > (enemy.userData.nextRetreat || 0) && Math.random() < 0.8 * dt) {
      enemy.userData.nextRetreat = gNow() + 7000;
      const cover = findCoverPosition(enemy.position, playerPos);
      if (cover) {
        enemy.userData.goal = cover; enemy.userData.goalIsCover = true; enemy.userData.flanking = false;
        enemy.userData.state = "retreat";
        enemy.userData.stateT = 0;
      }
    }

  } else if (enemy.userData.state === "cover") {
    // crouched behind cover: return fire if exposed, finish a reload, then pop out sideways for a peek
    const u = enemy.userData;
    u.vel.multiplyScalar(0.7);
    if (canSee) enemyTryShoot(enemy, playerEye, dt);
    if (gNow() > u.coverUntil && !(u.reloading && gNow() < u.reloadUntil)) {
      const toP = playerPos.clone().sub(enemy.position).setY(0).normalize(), side = Math.random() < 0.5 ? 1 : -1;
      let peek = null;
      for (const sdd of [side, -side]) {
        const px = enemy.position.x - toP.z * sdd * 2.2, pz = enemy.position.z + toP.x * sdd * 2.2;
        if (!enemyCollidesAt(px, pz, 0.6, enemy.position.y) && px > -currentBounds.x + 1 && px < currentBounds.x - 1 && pz > currentBounds.zMin + 1 && pz < currentBounds.zMax - 1) { peek = new THREE.Vector3(px, enemy.position.y, pz); break; }
      }
      u.stateT = 0;
      if (peek) { u.goal = peek; u.goalIsCover = false; u.chaseUntilSeen = true; u.state = "reposition"; } else u.state = "engage";
    }

  } else if (enemy.userData.state === "reposition" || enemy.userData.state === "retreat") {
    if (!enemy.userData.goal) {
      const cover = findCoverPosition(enemy.position, playerPos);
      enemy.userData.goalIsCover = !!cover; enemy.userData.flanking = false;
      enemy.userData.goal = cover || (enemy.userData.lastSeenPlayer ? enemy.userData.lastSeenPlayer.clone() : null);
      if (!enemy.userData.goal) {
        enemy.userData.state = "patrol";
        enemy.userData.stateT = 0;
      }
    }

    if (enemy.userData.goal) {
      const u = enemy.userData;
      const speed = (u.state === "retreat") ? 6.2 : 5.6;
      const done = steerToward(enemy, u.goal, speed * cls.speed, dt);
      if (done || u.stateT > (u.flanking ? 6.5 : 3.8)) {
        const atCover = done && u.goalIsCover, spd = Math.hypot(u.vel.x, u.vel.z);
        u.chaseUntilSeen = false; u.goal = null; u.flanking = false; u.goalIsCover = false; u.stateT = 0;
        if (atCover) {                                   // arrive at cover: slide in if running, then hunker down
          u.state = "cover"; u.coverUntil = gNow() + rand(1400, 2900) + (u.hp < u.maxHp * 0.4 ? 1200 : 0);
          if (spd > 3.2) u.slideUntil = gNow() + 520;
        } else u.state = "engage";
      }
    }

    // Keep fighting while moving to cover/retreating.
    // This fixes the bug where bots stop shooting if the player stays close.
    if (canSee) enemyTryShoot(enemy, playerEye, dt);
  }

  // between floors / along upper galleries: follow the navigation graph instead of walking straight (and straight back down the stairs)
  {
    const st0 = enemy.userData.state;
    let navTarget = null, engageOnly = false;
    if (st0 === "investigate") navTarget = enemy.userData.lastSeenPlayer;
    else if (st0 === "reposition" || st0 === "retreat") navTarget = enemy.userData.goal;
    else if (st0 === "engage") { navTarget = playerPos; engageOnly = true; }
    const navGoal = navTarget ? enemyNavWaypoint(enemy, navTarget, engageOnly) : null;
    if (navGoal) steerToward(enemy, navGoal, 4.8 * cls.speed, dt);
  }
  // flash-blinded bots stumble about at half pace
  if (gNow() < (enemy.userData.blindedUntil || 0)) enemy.userData.vel.multiplyScalar(0.30);
  if (gNow() - (enemy.userData.lastHitAt || -9999) < 220) enemy.userData.vel.multiplyScalar(0.45);   // stagger when hit
  { const u2 = enemy.userData, st2 = u2.state;   // slower while firing, quicker while not
    if (st2 === "engage" || st2 === "reposition" || st2 === "retreat") u2.vel.multiplyScalar(gNow() - (u2.lastShotAt || -9999) < 800 ? 0.55 : 1.25); }

  if (!enemy.userData.steered && enemy.userData.moveDir) enemy.userData.moveDir.multiplyScalar(Math.exp(-dt * 5));
  enemy.userData.steered = false;

  // separation to avoid stacking
  applySeparation(enemy);

  // facing: look at the player while fighting, otherwise face the way we're walking
  let targetYaw = enemy.userData.moveYaw;
  const st = enemy.userData.state;
  if ((canSee || st === "cover") && st !== "patrol" && st !== "investigate") {
    targetYaw = Math.atan2(-(playerPos.x - enemy.position.x), -(playerPos.z - enemy.position.z));
    // backing away from the player: turn round and face the way we are actually travelling instead of moonwalking
    const ud1 = enemy.userData, sp1 = Math.hypot(ud1.vel.x, ud1.vel.z);
    if (sp1 > 1.0) {
      const tx = playerPos.x - enemy.position.x, tz = playerPos.z - enemy.position.z, tl = Math.hypot(tx, tz) || 1, dt1 = (ud1.vel.x * tx + ud1.vel.z * tz) / (sp1 * tl);
      if (dt1 < -0.55) ud1.backFace = true; else if (dt1 > -0.2) ud1.backFace = false;
    } else if (sp1 < 0.4) ud1.backFace = false;
    if (ud1.backFace) targetYaw = Math.atan2(-ud1.vel.x, -ud1.vel.z);
  } else enemy.userData.backFace = false;
  turnToward(enemy, targetYaw, dt);
  { const fighting = canSee && (st === "engage" || st === "reposition" || st === "retreat" || st === "cover");
    enemy.userData.aimT = fighting ? 1 : (gNow() - (enemy.userData.lastShotAt || -9999) < 900 ? 1 : 0); }

  // apply movement + collision (slide along walls instead of stopping dead)
  const ER = 0.5;
  const ex = enemy.position.x, ez = enemy.position.z;
  const nx = clamp(ex + enemy.userData.vel.x * dt, -currentBounds.x, currentBounds.x);
  const nz = clamp(ez + enemy.userData.vel.z * dt, currentBounds.zMin, currentBounds.zMax);

  const feetY = enemy.position.y;
  if (enemyCollidesAt(ex, ez, ER, feetY)) {
    // already overlapping a box (e.g. a cover spot hugging a wall): let it walk out
    enemy.position.x = nx;
    enemy.position.z = nz;
  } else if (!enemyCollidesAt(nx, nz, ER, feetY)) {
    enemy.position.x = nx;
    enemy.position.z = nz;
  } else {
    if (!enemyCollidesAt(nx, ez, ER, feetY)) enemy.position.x = nx;
    if (!enemyCollidesAt(enemy.position.x, nz, ER, feetY)) enemy.position.z = nz;
    // barely any progress along the way we wanted to go (a crate or pillar dead ahead): swing round it instead of pushing into it
    const vx = enemy.userData.vel.x, vz = enemy.userData.vel.z, sp = Math.hypot(vx, vz), want = sp * dt;
    if (want > 0.02) {
      const dx = enemy.position.x - ex, dz = enemy.position.z - ez;
      const progress = (dx * vx + dz * vz) / sp;
      if (progress < want * 0.3) {
        const perpX = -vz / sp, perpZ = vx / sp;
        let side = enemy.userData.avoidSide || (Math.random() < 0.5 ? 1 : -1);
        for (let k = 0; k < 2; k++) {
          // pick the side that is open a little way ahead
          if (!enemyCollidesAt(ex + perpX * side * 1.4 + (vx / sp) * 0.4, ez + perpZ * side * 1.4 + (vz / sp) * 0.4, ER, feetY)) break;
          side = -side;
        }
        enemy.userData.avoidSide = side;
        enemy.userData.avoidUntil = gNow() + 900;
      }
    }
  }

  const supportY = getSupportHeight(enemy.position.x, enemy.position.z, enemy.position.y);
  if (supportY > enemy.position.y) enemy.position.y = supportY;
  else enemy.position.y = Math.max(supportY, enemy.position.y - 5.0 * dt);
  animateEnemy(enemy, dt);

  // stuck detection: pushing hard but barely moving -> pick a short detour
  const wantSpeed = enemy.userData.vel.length();
  const moved = Math.hypot(enemy.position.x - ex, enemy.position.z - ez);
  if (wantSpeed > 1.0 && moved < wantSpeed * dt * 0.25) enemy.userData.stuckT += dt;
  else enemy.userData.stuckT = Math.max(0, enemy.userData.stuckT - dt);

  if (enemy.userData.stuckT > 0.7) {
    enemy.userData.stuckT = 0;
    const ang = Math.random() * Math.PI * 2; enemy.userData.goalIsCover = false; enemy.userData.flanking = false;
    enemy.userData.goal = new THREE.Vector3(
      clamp(enemy.position.x + Math.cos(ang) * 7, -currentBounds.x, currentBounds.x),
      enemy.position.y,
      clamp(enemy.position.z + Math.sin(ang) * 7, currentBounds.zMin, currentBounds.zMax)
    );
    enemy.userData.state = "reposition";
    enemy.userData.stateT = 0;
  }
}

function updateHUD(statusText=null) {
  if (settings.sandbox) score = 0;   // sandbox keeps no score
  const w = weapons[curWeaponNum];
  const st = ammoState[curWeaponNum];

  document.getElementById("wave").textContent = wave;
  document.getElementById("score").textContent = score;
  document.getElementById("best").textContent = bestScore;
  document.getElementById("hitCount").textContent = hits;
  document.getElementById("shotCount").textContent = shots;
  document.getElementById("hsCount").textContent = headshots;
  const ammoText = grenadeEquipped ? (UTILITY_TYPES[utilityType].shortName + " ×" + grenades)
    : w.type === "melee" ? "Melee · unlimited" : missionRun ? (st.mag + " / " + (st.reserve || 0)) : (st.mag + "/" + w.magSize);
  document.getElementById("ammo").textContent = ammoText;
  const magNum = document.getElementById("ammoMagNum");
  const magFill = document.getElementById("ammoMagFill");
  const magEl = document.getElementById("ammoMag");
  if (magEl) magEl.style.display = !grenadeEquipped && w.type !== "melee" ? "" : "none";
  if (magNum) magNum.textContent = st.mag;
  if (magFill) magFill.style.height = (w.magSize > 0 ? (100 * st.mag / w.magSize) : 0) + "%";
  document.getElementById("botsLeft").textContent = missionRun ? enemies.length : waveBotsRemaining;

  updateGrenadeHud();
}

const MISSION_VIS = 115;             // bots further away than this are hidden and put to sleep (keeps big maps fast)
const CHUTE_FALL = 5.2, CHUTE_SPEED = 3.4;
let missionBannerTimer = null, missionToastTimer = null, missionHudCache = {};
let missionExtraObjs = [];           // helicopters, vehicles, tanks, canopies, shells... removed whenever a run or map is torn down

function keyLabel(code) { return String(code || "").replace(/^Key|^Digit/, "").replace("Mouse", "Mouse "); }
function missionExtra(obj) { scene.add(obj); missionExtraObjs.push(obj); return obj; }
function clearMissionExtras() { for (const o of missionExtraObjs) scene.remove(o); missionExtraObjs = []; }

// ---------- pickups ----------
function spawnPickup(type, x, y, z) {
  const g = new THREE.Group();
  const col = type === "medkit" ? 0xffffff : 0x5a6b3a;
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.36, 0.42), new THREE.MeshStandardMaterial({ color: col, roughness: 0.6, metalness: 0.1 }));
  g.add(box);
  if (type === "medkit") {
    const red = new THREE.MeshBasicMaterial({ color: 0xe02a2a });
    const a = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.1, 0.02), red); a.position.z = 0.22; g.add(a);
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.02), red); b.position.z = 0.22; g.add(b);
    const a2 = a.clone(); a2.position.z = -0.22; g.add(a2); const b2 = b.clone(); b2.position.z = -0.22; g.add(b2);
  } else {
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.06, 0.44), new THREE.MeshBasicMaterial({ color: type === "drop" ? 0xffe08a : 0xf2c230 })); stripe.position.y = 0.05; g.add(stripe);
    const lid = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.3), new THREE.MeshStandardMaterial({ color: 0x3b4a28, roughness: 0.8 })); lid.position.y = 0.2; g.add(lid);
  }

function addMissionAmmo(mags) {

function collectPickup(p) {

  }

}
function updatePickups(dt) {
  const px = camera.position.x, pz = camera.position.z, feet = camera.position.y - curEye;
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];

    p.mesh.rotation.y += dt * 1.4;

  }
}

function makeBeacon(color) {

function clearBeacons() { if (!missionRun) return; for (const b of missionRun.beacons) scene.remove(b.group); missionRun.beacons = []; }

function missionRemaining(tag) {
  const m = missionRun; if (!m) return 0;
  let n = 0;
  for (const e of enemies) if (e.userData.hp > 0 && (!tag || tag === "all" || e.userData.tag === tag)) n++;
  for (const g of m.groups) if (!g.spawned && (!tag || tag === "all" || g.tag === tag)) n += g.spawns.length;
  return n;
}
function missionTargets() {                      // positions the current step is pointing at
  const m = missionRun; if (!m || m.over) return [];
  const st = m.L.steps[m.step]; if (!st) return [];
  const px = camera.position.x, pz = camera.position.z;
  if (st.type === "plant") return st.sites.map((s, i) => ({ ...s, i })).filter(s => !m.planted.has(m.step + ":" + s.i));
  if (st.type === "kill") {
    if (m.hvt && m.hvt.userData.hp > 0) return [{ x: m.hvt.position.x, y: m.hvt.position.y, z: m.hvt.position.z, follow: m.hvt }];
    const gr = m.groups.find(g => !g.spawned && g.spawns.some(s => s.hvt) && g.trigger);
    return gr ? [{ x: gr.trigger.x, y: gr.trigger.y || 0, z: gr.trigger.z, soft: true }] : [];
  }
  if (st.type === "clear") {
    let best = null, bd = 1e9;
    for (const e of enemies) if (e.userData.hp > 0 && (st.tag === "all" || e.userData.tag === st.tag)) { const d = Math.hypot(e.position.x - px, e.position.z - pz); if (d < bd) { bd = d; best = { x: e.position.x, y: e.position.y, z: e.position.z, soft: true }; } }
    if (best) return [best];
    for (const g of m.groups) if (!g.spawned && (st.tag === "all" || g.tag === st.tag) && g.trigger) { const d = Math.hypot(g.trigger.x - px, g.trigger.z - pz); if (d < bd) { bd = d; best = { x: g.trigger.x, y: g.trigger.y || 0, z: g.trigger.z, soft: true }; } }
    return best ? [best] : [];
  }
  return st.pos ? [{ ...st.pos }] : [];
}
function rebuildBeacons() {
  const m = missionRun; if (!m) return;
  clearBeacons();
  const st = m.L.steps[m.step]; if (!st || st.type === "clear") return;      // clear steps just use the arrow
  const color = st.type === "extract" || st.type === "holdout" ? 0x44ff88 : st.type === "kill" ? 0xff4a3a : 0xffd27f;
  for (const t of missionTargets()) { if (t.soft) continue; const g = makeBeacon(color); g.position.set(t.x, t.y, t.z); scene.add(g); m.beacons.push({ group: g, follow: t.follow }); }
}
function updateBeacons(dt) {
  const m = missionRun; if (!m) return;
  const t = gameTime / 1000;
  for (const b of m.beacons) {
    if (b.follow) b.group.position.set(b.follow.position.x, b.follow.position.y, b.follow.position.z);
    b.group.userData.dia.rotation.y = t * 2; b.group.userData.dia.position.y = 2.6 + Math.sin(t * 2.4) * 0.2;
    b.group.userData.beam.material.opacity = 0.2 + Math.sin(t * 3) * 0.06;
    b.group.userData.ring.scale.setScalar(1 + (t % 1.2) * 0.5); b.group.userData.ring.material.opacity = 0.7 * (1 - (t % 1.2) / 1.2);
  }
}

// ---------- banner + HUD ----------
function showMissionBanner(title, sub, warn) {
  const el = document.getElementById("missionBanner"); if (!el) return;
  el.innerHTML = title + (sub ? "<small>" + sub + "</small>" : "");
  el.classList.toggle("warn", !!warn); el.classList.add("show");
  clearTimeout(missionBannerTimer); missionBannerTimer = setTimeout(() => el.classList.remove("show"), 3600);
}
function fmtClock(t) { t = Math.max(0, Math.ceil(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
function updateMissionHud() {
  const hud = document.getElementById("missionHud"), arrow = document.getElementById("objArrow"), dist = document.getElementById("objDist"), prompt = document.getElementById("interactPrompt");
  if (!hud) return;
  const m = missionRun;
  const on = !!(m && !m.over && roundActive);
  hud.style.display = on ? "block" : "none"; arrow.style.display = on ? "block" : "none"; dist.style.display = on ? "block" : "none";
  document.body.classList.toggle("missionMode", !!m);
  if (!on) { prompt.style.display = "none"; return; }
  const st = m.L.steps[m.step];
  const timeStr = fmtClock(m.time);
  let obj = st ? st.text : "", sub = st ? st.sub : "";
  if (st && st.type === "plant") obj += "  (" + st.sites.filter((s, i) => m.planted.has(m.step + ":" + i)).length + "/" + st.sites.length + ")";
  const left = missionRemaining(st && st.type === "clear" ? st.tag : "all");
  if (st && st.type === "clear") sub = (st.sub ? st.sub + " · " : "") + "Hostiles left: " + left;
  if (st && st.type === "holdout") sub = m.holdT > 0 || m.inHold ? "Hold position: " + Math.max(0, Math.ceil(st.dur - m.holdT)) + " s" + (m.inHold ? "" : "  (return to the zone!)") : st.sub;
  const fuse = m.fuse >= 0 ? `<div class="mSub" style="color:#ff8a7a;font-weight:800">CHARGES DETONATE IN ${Math.ceil(m.fuse)} s</div>` : "";
  const total = `<div class="mSub" style="opacity:.55">Total hostiles remaining: ${missionRemaining("all")}</div>`;
  const sig = [timeStr, obj, sub, m.step, m.fuse >= 0 ? Math.ceil(m.fuse) : -1, m.time < 60, missionRemaining("all")].join("|");
  if (missionHudCache.sig !== sig) {
    missionHudCache.sig = sig;
    hud.innerHTML = `<div class="mName">${m.def.name}</div><div class="mTimer${m.time < 60 ? " low" : ""}">${timeStr}</div>` +
      `<div class="mObj">${obj}</div><div class="mSub">${sub || ""}</div>${fuse}${total}` +
      `<div class="mSteps">${m.L.steps.map((s, i) => `<div class="mDot ${i < m.step ? "done" : i === m.step ? "cur" : ""}"></div>`).join("")}</div>`;
  }
  const targets = missionTargets();
  if (!targets.length || m.intro) { arrow.style.display = "none"; dist.style.display = "none"; }
  else {
    let best = null, bd = 1e9;
    for (const t of targets) { const d = Math.hypot(t.x - camera.position.x, t.z - camera.position.z); if (d < bd) { bd = d; best = t; } }
    const psi = Math.atan2(-(best.x - camera.position.x), -(best.z - camera.position.z));
    arrow.firstElementChild.style.transform = `rotate(${(yaw - psi) * 180 / Math.PI}deg)`;
    const feet = camera.position.y - curEye, dy = best.y - feet;
    dist.textContent = Math.round(bd) + " m" + (dy > 2.5 ? "  ▲ up" : dy < -2.5 ? "  ▼ down" : "");
  }
}

// ---------- enemies ----------
function spawnMissionEnemy(spec) {
  const CLS = { r: "rifler", s: "shotgun", n: "sniper" };
  const e = makeEnemy(CLS[spec.cls] || spec.cls || "rifler", { hvt: !!spec.hvt });
  e.position.set(spec.x, spec.y || 0, spec.z);
  e.userData.patrolAnchor.copy(e.position);
  e.userData.patrolScale = spec.patrol ?? 1;
  e.userData.patrolPhase = Math.random() * 6.28;
  e.userData.tag = spec.tag || "misc";
  e.rotation.y = Math.random() * 6.28;
  if (spec.hvt) { e.userData.isHVT = true; e.userData.maxHp = e.userData.hp = Math.round(420 * DIFF().hp); drawHealthBar(e); }
  if (spec.hunter) {
    e.userData.hunter = true; e.userData.state = "investigate"; e.userData.stateT = 0;
    e.userData.lastSeenPlayer = camera.position.clone(); e.userData.lastSeenTime = gNow();
  }
  e.traverse(o => { if (o.isMesh && !o.userData.noShadow) o.castShadow = true; });
  // small gear meshes are hidden at a distance (a soldier is ~75 meshes; most of them are pouches, rails and straps)
  const detail = [];
  e.traverse(o => { if (o.isMesh && o.geometry && o.visible) { if (!o.geometry.boundingSphere) o.geometry.computeBoundingSphere(); if (o.geometry.boundingSphere.radius < 0.085) detail.push(o); } });
  e.userData.detail = detail; e.userData.detailOn = true;
  scene.add(e); enemies.push(e);
  return e;
}
function triggerAlarm(count, text) {                       // reinforcements that know where you are
  const m = missionRun; if (!m) return;
  m.alarmed = true;
  count = Math.max(1, Math.round(count * DIFF().reinf));
  for (let i = 0; i < 5; i++) setTimeout(() => beep(i % 2 ? 620 : 880, 0.16, "square", 0.05), i * 260);
  for (const e of enemies) if (e.userData.hp > 0 && e.position.distanceTo(camera.position) < 55 && e.userData.state === "patrol") {
    e.userData.state = "investigate"; e.userData.stateT = 0; e.userData.lastSeenPlayer = camera.position.clone(); e.userData.lastSeenTime = gNow();
  }
  const feet = camera.position.y - curEye, all = (m.L.reinforce || []);
  const level = all.filter(pt => Math.abs(pt[1] - feet) < 4 && Math.hypot(pt[0] - camera.position.x, pt[2] - camera.position.z) > 22);
  const pts = (level.length >= 2 ? level : all).slice().sort((a, b) => Math.hypot(b[0] - camera.position.x, b[2] - camera.position.z) - Math.hypot(a[0] - camera.position.x, a[2] - camera.position.z));
  for (let i = 0; i < count; i++) {
    const pt = pts[i % Math.max(1, Math.min(pts.length, 4))]; if (!pt) break;
    const sp = snapFree(pt[0] + rand(-3, 3), pt[1], pt[2] + rand(-3, 3));
    spawnMissionEnemy({ ...sp, cls: i % 4 === 3 ? "shotgun" : "rifler", patrol: 1, hunter: true, tag: "reinf" });

}

// -----------------------
// Run control
// -----------------------
function startRun() {
  applyDifficulty();
  score = 0; shots = 0; hits = 0; headshots = 0; kills = 0;
  hideDeathScreen();
  playerHP = PLAYER_MAX_HP;
  lastDamageTime = gNow();
  reloading = false;

  for (const [id, w] of Object.entries(weapons)) ammoState[id] = { mag: w.magSize, reserve: Infinity };

  // fresh spawn (the old restart left you wherever you died)
  camera.position.set(0, PLAYER.height, 2);
  yaw = 0; pitch = 0; yVel = 0;
  curEye = PLAYER.height;
  PLAYER.grounded = true;
  jumpQueued = false;
  mouseDown = false;
  lastShotTime = -1e9;
  playerKnock.x = 0; playerKnock.z = 0;
  shakeT = 0;
  spawnRemaining = 0; nextWaveIn = -1;
  clearGrenades();
  utilityCounts = Object.fromEntries(Object.entries(UTILITY_TYPES).map(([id, utility]) => [id, utility.startWith]));
  utilityType = settings.sideUtility;
  grenades = utilityCounts[utilityType];

  roundActive = true;
  clearPickups();
  if (missionRun) { clearBeacons(); clearMissionExtras(); }
  missionRun = null;

  updatePlayerHealthBar();
  if (settings.mode === "missions" && missionLayout) {
    startMission();
    updatePlayerHealthBar();
    updateHUD("Objective: " + missionRun.L.steps[0].text);
  } else {
    startWave(1);
    updateHUD("Move smart.");
  }
  updateMissionHud();
}

function endRun(reason) {
  if (missionRun && !missionRun.over) { missionEnd(false, "MISSION FAILED", true); return; }
  roundActive = false;
  if (scoped) setScoped(false);
  if (!settings.sandbox) bestScore = Math.max(bestScore, score);
  spawnRemaining = 0; nextWaveIn = -1;
  throwState = null;
  if (grenadeView) grenadeView.group.visible = false;
  updateHUD("Down!");
  mouseDown = false;
  showDeathScreen();
  document.exitPointerLock();   // release the mouse so the buttons are clickable
}

// -----------------------
// Death screen
// -----------------------
const dsSleep = (ms) => new Promise(r => setTimeout(r, ms));

async function typeDeathText(el, text, speed, token) {
  let finished = false;
  let releaseSkip;
  const skipped = new Promise(resolve => { releaseSkip = resolve; });
  const finish = () => {
    if (finished) return;
    finished = true;
    el.textContent = text;
    el.classList.remove("typing");
    if (deathSkipCurrent === finish) deathSkipCurrent = null;
    releaseSkip();
  };
  deathSkipCurrent = finish;
  el.classList.add("typing");
  for (let i = 1; i <= text.length; i++) {
    if (token !== deathToken) {
      el.classList.remove("typing");
      if (deathSkipCurrent === finish) deathSkipCurrent = null;
      return false;
    }
    if (finished) break;
    el.textContent = text.slice(0, i);
    if (text[i - 1] !== " ") beep(700 + Math.random() * 120, 0.012, "square", 0.02);
    await Promise.race([dsSleep(speed), skipped]);
  }
  if (token !== deathToken) {
    el.classList.remove("typing");
    if (deathSkipCurrent === finish) deathSkipCurrent = null;
    return false;
  }
  finish();
  return true;
}

function fadeDeathPart(el, duration, token) {
  return new Promise(resolve => {
    let finished = false;
    const finish = instant => {
      if (finished) return;
      finished = true;
      if (deathSkipCurrent === skip) deathSkipCurrent = null;
      if (token !== deathToken) { resolve(false); return; }
      if (instant) el.classList.add("instant");
      el.classList.add("ready");
      if (instant) requestAnimationFrame(() => el.classList.remove("instant"));
      resolve(true);
    };
    const skip = () => finish(true);
    deathSkipCurrent = skip;
    void el.offsetWidth;
    requestAnimationFrame(() => { if (!finished && token === deathToken) el.classList.add("ready"); });
    setTimeout(() => finish(false), duration);
  });
}

function showDeathScreen(opts) {
  const o = opts || {}, fall = o.fall !== false;       // fall = the camera drops to the floor (death); missions can end without it
  const token = ++deathToken;
  deathSkipCurrent = null;
  dying = fall;
  deathT = 0;
  deathRollDir = Math.random() < 0.5 ? -1 : 1;
  if (weaponGroup && fall) weaponGroup.visible = false;
  if (fall) document.body.classList.add("dead");

  const ds = document.getElementById("deathScreen");
  const statsBox = document.getElementById("dsStats");
  const btns = document.getElementById("dsButtons");
  statsBox.classList.remove("ready", "instant");
  btns.classList.remove("ready", "instant");
  ds.querySelectorAll("#dsTitle, #dsScoreLabel, #dsScore, .dsStat .lbl, .dsStat .val").forEach(el => { el.textContent = ""; el.classList.remove("typing"); });
  ds.onclick = event => {
    if (event.target.closest("#dsButtons button")) return;
    if (deathSkipCurrent) deathSkipCurrent();
  };
  ds.classList.add("show");
  void ds.offsetWidth;            // reflow so the fade-in transition runs
  ds.classList.add("fade");

  const stats = [...statsBox.querySelectorAll(".dsStat")];
  const rows = [
    [document.getElementById("dsTitle"), o.title || "YOU DIED", 90],
    [document.getElementById("dsScoreLabel"), o.label || "FINAL SCORE", 45],
    [document.getElementById("dsScore"), o.value !== undefined ? String(o.value) : String(score), 110]
  ];
  const statRows = o.stats || [["WAVE", wave], ["KILLS", kills], ["SHOTS", shots], ["HITS", hits]];

  (async () => {
    await dsSleep(fall ? 900 : 350);   // let the fall start before the text begins
    if (token !== deathToken) return;
    for (const [el, text, speed] of rows) {
      if (!await typeDeathText(el, text, speed, token)) return;
    }
    if (token !== deathToken) return;
    statRows.forEach(([label, value], i) => {
      stats[i].querySelector(".lbl").textContent = label;
      stats[i].querySelector(".val").textContent = String(value);
    });
    if (!await fadeDeathPart(statsBox, 650, token)) return;
    if (!await fadeDeathPart(btns, 600, token)) return;
    document.getElementById("dsRestart").focus();
  })();
}

function hideDeathScreen() {
  deathToken++;                     // stops any typing in progress
  clearBloodEdges();
  deathSkipCurrent = null;
  dying = false;
  deathT = 0;
  document.body.classList.remove("dead");
  if (weaponGroup) weaponGroup.visible = true;
  const ds = document.getElementById("deathScreen");
  if (ds) { ds.classList.remove("fade"); ds.classList.remove("show"); }
  const btns = document.getElementById("dsButtons");
  if (btns) btns.classList.remove("ready");
}

function deathBackToMenu() {
  hideDeathScreen();
  clearEnemies();
  clearTracers();
  particles.forEach(p => scene.remove(p));
  particles.length = 0;
  buildMap(activeMapName());        // fresh map preview behind the menu
  camera.position.set(0, PLAYER.height, 2);
  yaw = 0; pitch = 0; yVel = 0;
  curEye = PLAYER.height;
  showMenu("start");
}

function initDeathScreen() {
  document.getElementById("dsRestart").onclick = () => { fullRestart(); requestLock(); };
  document.getElementById("dsMenu").onclick = deathBackToMenu;
}

function fullRestart() {
  if (scoped) setScoped(false);
  clearEnemies();
  clearTracers();
  particles.forEach(p => scene.remove(p));
  particles.length = 0;

  buildMap(activeMapName());
  runMap = activeMapName();
  runKey = selectionKey();
  setWeaponInstant(hotbar.find(id => id !== null) ?? 1);
  startRun();
}

// -----------------------
// Weapon switching helpers
// -----------------------
function setWeaponInstant(n) {
  if (!weapons[n]) return;
  resetKnifeAttackPose();
  grenadeEquipped = false;
  curWeaponNum = n;
  swapping = false;
  swapT = 0;
  updateWeaponModelVisibility();
  updateHUD("Ready");
}

function setWeapon(n) {
  beginSwap(n);
}

function setGrenadeEquipped(on) {
  if (throwState || swapping) return;
  grenadeEquipped = on;
  if (on) {
    if (scoped) setScoped(false);
    reloading = false;
  }
  updateWeaponModelVisibility();
  updateHUD(on ? (grenades > 0 ? UTILITY_TYPES[utilityType].name + " ready — left click: overhand · right click: underhand" : "No " + UTILITY_TYPES[utilityType].shortName.toLowerCase() + " charges") : "Ready");
}

function toggleGrenadeReady() {   // grenade key: ready / lower the bomb; then LMB = overhand, RMB = underhand
  if (!roundActive || dying || throwState || swapping) return;
  if (grenadeEquipped) { setGrenadeEquipped(false); return; }
  const nm = UTILITY_TYPES[utilityType].shortName.toLowerCase();
  if (grenades <= 0) { beep(140, 0.05, "square", 0.04); updateHUD("No " + nm + " charges"); return; }
  if (gNow() < grenadeCooldownUntil) { beep(140, 0.05, "square", 0.04); updateHUD(UTILITY_TYPES[utilityType].shortName + " on cooldown"); return; }
  setGrenadeEquipped(true);
}

// -----------------------
// Reload completion
// -----------------------
function updateReload() {
  if (reloading && gNow() >= reloadEnd) {
    const w = weapons[curWeaponNum];
    const st = ammoState[curWeaponNum];
    if (w.type === "melee") { reloading = false; return; }
    const need = w.magSize - st.mag;
    const take = missionRun ? Math.min(need, st.reserve || 0) : need;       // missions: only what you carry
    st.mag += take;
    if (missionRun) st.reserve -= take;
    reloading = false;
    beep(260, 0.02, "triangle", 0.03);
    updateHUD("Loaded");
  }
}

  const hipX = pist ? -0.02 + 0.22 * spE : (curWeaponNum === 1 ? 0.17 : 0.08) - ((curWeaponNum === 1 ? 0.17 : 0.08) - 0.03) * spE + 0.05 * spE + GUN_POSE.sprintSide * spE + 0.03 * (1 - spE);   // nearer the middle when walking, held a little further out to the right
  const HOLD_UP = -0.03 * (1 - spE) + 0.07 * spE;   // hip: carried low, like a low-ready stance   // carried high on screen
  const hipY = HOLD_UP + (pist ? -0.11 - 0.09 * spE : 0.0 - (curWeaponNum === 1 ? GUN_POSE.sprintLower : 0.035) * spE);
  const targetX = hipX + (ax - hipX) * scopePose;
  const targetY = hipY + (ay - hipY) * scopePose;
  const hipZ = (pist ? -0.40 - 0.10 * spE : (curWeaponNum === 1 ? -0.08 : -0.12) - 0.20 * spE) - 0.06 * (1 - spE);   // pushed well forward so the near end of the gun (scope eyepiece, stock) is not right in front of the camera   // sprinting pushes the gun a long way out in front

  const kickY = 0;
  const kickZ = (pist ? 0.62 / 0.55 : w.type === "sniper" ? 0.4 : w.type === "shotgun" ? 0.8 : 0.55) * 0.55;   // gentler kick when unaimed
  const kickRot = pist ? 0.30 : 0;   // the Glock muzzle flips up on each shot
  const flipAmt = 0;   // the muzzle snaps up on each shot
  gunFlipVis += (gunFlip - gunFlipVis) * Math.min(1, dt * 55);

  // sprint pose blends in/out smoothly; not while scoped or reloading (the reload pose needs the gun up)
  sprintPose += ((isSprinting && !scoped && !reloading ? 1 : 0) - sprintPose) * Math.min(1, dt * 9);

  const freePose = 1 - scopePose;

  weaponGroup.position.x = targetX - 0.10 * slidePose * freePose + 0.34 * tg * freePose;

    if (curWeaponNum === 6 && knifeAttackTimer > 0) {
      const heavy = knifeAttackType === "alt";

}

// -----------------------
// Input + pointer lock
// -----------------------
function addEventListeners() {
  document.addEventListener("pointerlockchange", () => {
    locked = (document.pointerLockElement === renderer.domElement);
    if (locked) {
      overlayEl.style.display = "none";
    } else {
      // release everything so keys/buttons can't get stuck while the menu is open
      if (scoped) setScoped(false);
      for (const k in keys) keys[k] = false;
      mouseDown = false;
      jumpQueued = false;
      if (roundActive && window.__fpsVersusActive) window.dispatchEvent(new Event("fps-versus-pause"));
      else if (roundActive) showMenu("pause");
      else if (!dying && !window.__fpsHoldOverlay) overlayEl.style.display = "flex";   // death screen replaces the menu while dying
    }
  });

  document.addEventListener("pointerlockerror", () => {
    if (roundActive && window.__fpsVersusActive) window.dispatchEvent(new Event("fps-versus-pause"));
    else if (roundActive) showMenu("pause");
    const hint = document.getElementById("menuHint");
    if (hint) hint.textContent = "Couldn't capture the mouse. Wait a second, then click again.";
  });

  document.addEventListener("wheel", (e) => {
    if (!locked || !roundActive || swapping) return;
    const loadout = hotbar.filter(id => id !== null && weapons[id]);
    if (!loadout.length) return;
    const cur = loadout.indexOf(curWeaponNum);
    const dir = e.deltaY > 0 ? 1 : -1;
    setWeapon(loadout[(Math.max(0, cur) + dir + loadout.length) % loadout.length]);
  }, { passive: true });

  document.addEventListener("mousemove", (e) => {
    if (!locked) return;
    // Match the original scope sensitivity to its magnified field of view.
    let sens = BASE_SENS * settings.sens;
    const zb = scopeBlend;
    if (zb > 0) {
      const halfRad = Math.PI / 360, f0 = Math.tan(settings.fov * halfRad);
      if (curWeaponNum === 1) sens *= (f0 + (Math.tan(scopeViewFov() * halfRad) - f0) * zb) / f0 * (1 + (settings.adsSens - 1) * zb);   // the lens shows a magnified view, so turn slower
      else sens *= Math.tan(camera.fov * halfRad) / f0 * (1 + (settings.adsSensGun - 1) * zb);
    }
    yaw   -= e.movementX * sens;
    swayIn.x += e.movementX; swayIn.y += e.movementY;
    pitch -= e.movementY * sens;

    const lim = Math.PI / 2 - 0.02;
    pitch = Math.max(-lim, Math.min(lim, pitch));
  });

  document.addEventListener("mousedown", (e) => {
    if (!locked) return;
    if (e.button === 0) {
      if (grenadeEquipped) { mouseDown = false; tryThrowGrenade("over"); }
      else { mouseDown = true; shoot(); }
    }
    if (e.button === 2) {
      if (grenadeEquipped) { tryThrowGrenade("under"); return; }
      if (weapons[curWeaponNum].type === "melee") startKnifeAttack(true);
      else if (!sprintActive() && !reloading) setScoped(true);
    }
  });

  document.addEventListener("mouseup", (e) => {
    if (e.button === 0) mouseDown = false;
    if (e.button === 2) { if (scoped) setScoped(false); }
  });

  document.addEventListener("contextmenu", (e) => e.preventDefault());

  document.addEventListener("keydown", (e) => {
    if (listeningAction) { captureBind(e); return; }
    if (!locked) return;
    const code = normCode(e.code);
    keys[code] = true;

    for (let i = 0; i < hotbar.length; i++) {
      if (hotbar[i] !== null && code === binds["slot" + (i + 1)]) setWeapon(hotbar[i]);
    }

    if (code === binds.jump && !crouchHeld()) {   // can't jump while crouched
      if (PLAYER.grounded) {
        yVel = PLAYER.jumpVel;
        PLAYER.grounded = false;
      } else {
        jumpQueued = true;
      }
    }
    if (code === binds.slide && !e.repeat) slideState.want = true;
    if (code === binds.jump) { if (slideState.t > 0) slideState.cd = 1.5; slideState.t = 0; }
    if (code === binds.reload) startReload();
    if (code === binds.grenade && !e.repeat) toggleGrenadeReady();
    if (code === binds.help && !e.repeat) {
      const helpEl = document.getElementById("miniHelp");
      if (helpEl) helpEl.classList.toggle("show");
    }
  });

  document.addEventListener("keyup", (e) => {
    const code = normCode(e.code);
    keys[code] = false;
    if (code === binds.jump) jumpQueued = false;
  });

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    applyPerformanceSettings();
    if (scoped || scopeViewBlend > 0) drawScope();
  });
}

// -----------------------
// Main loop + FPS cap/counter
// -----------------------
let nextFpsFrameAt = 0;
let fpsWindowStart = 0, fpsWindowFrames = 0;
function updateFpsCounter(now) {
  if (!fpsWindowStart) fpsWindowStart = now;
  fpsWindowFrames++;
  const elapsed = now - fpsWindowStart;
  if (elapsed >= 500) {
    const fps = Math.round(fpsWindowFrames * 1000 / elapsed);
    const el = document.getElementById("fpsValue");
    if (el) el.textContent = String(fps);
    fpsWindowStart = now;
    fpsWindowFrames = 0;
  }
}

function animate(timestamp) {
  requestAnimationFrame(animate);
  const now = Number.isFinite(timestamp) ? timestamp : performance.now();
  const limit = settings.fpsLimit;
  if (limit > 0) {
    const interval = 1000 / limit;
    if (!nextFpsFrameAt) nextFpsFrameAt = now;
    if (now < nextFpsFrameAt) return;
    do { nextFpsFrameAt += interval; } while (nextFpsFrameAt <= now);
  } else {
    nextFpsFrameAt = now;
  }
  updateFpsCounter(now);
  renderLoadout3D(now);
  const rawDt = Math.min(clock.getDelta(), 0.05);
  updateScopeTransition(rawDt);

  // Player input and weapon handling stop on the pause screen, but the world does not:
  // enemies keep moving and can still hit a stationary player.
  const running = locked && roundActive;
  const worldRunning = roundActive && (locked || menuMode === "pause");
  const dt = running ? rawDt : 0;
  const worldDt = worldRunning ? rawDt : 0;
  if (worldRunning) gameTime += rawDt * 1000;
  const tNow = gameTime / 1000;
  updateGrenadeCooldownHud();

  // screen shake: random per-frame jitter that fades over SHAKE_DURATION (view only, aim is untouched)
  let shX = 0, shY = 0, shZ = 0;
  if (shakeT > 0 && dt > 0) {
    shakeT = Math.max(0, shakeT - dt);
    let amp = shakeAmp * (shakeT / SHAKE_DURATION);
    if (scoped || scopeViewBlend > 0) {
      const half = Math.PI / 360;
      const viewScale = Math.tan(camera.fov * half) / Math.tan(settings.fov * half);
      amp *= viewScale * (1 - 0.7 * Math.max(scopeBlend, scopeViewBlend));
    }
    shX = (Math.random() * 2 - 1) * amp;
    shY = (Math.random() * 2 - 1) * amp;
    shZ = (Math.random() * 2 - 1) * amp * 1.5;
  }

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw + shY;
  if (curWeaponNum === 1 && !grenadeEquipped && scopeBlend > 0) { const q = 1 - scopeBlend; shX *= q; shY *= q; shZ *= q; }   // no tilt or jitter through the AWP scope
  camera.rotation.y = yaw + shY;
  camera.rotation.x = pitch + shX;
  camera.rotation.z = shZ;

  // death: fall over sideways (roll + look up) while the camera drops toward the floor
  let deathDrop = 0;
  if (dying) {
    deathT += rawDt;
    const k = Math.min(1, deathT / DEATH_FALL_TIME);
    const easeOut = 1 - Math.pow(1 - k, 3);   // quick tilt that settles
    const easeIn  = k * k;                    // gravity: speeds up as you fall
    camera.rotation.z += deathRollDir * 1.25 * easeOut;
    camera.rotation.x += 0.35 * easeOut;
    deathDrop = (curEye - 0.35) * easeIn;
  }

  // muzzle flash decay
  if (muzzleFlash) {
    muzzleT = Math.max(0, muzzleT - dt);
    const k = muzzleT / 0.055;
    muzzleFlash.material.opacity = k * k * 0.9 * (1 - 0.8 * scopeBlend);
    muzzleLight.intensity = k * (curWeaponNum === 4 ? 4.2 : 2.2) * (1 - 0.7 * scopeBlend);
    if (muzzleCones) for (const cn of muzzleCones) cn.material.opacity = cn.userData.op * k * (1 - 0.85 * scopeBlend);
  }

  // movement
  const prevX = camera.position.x;
  const prevZ = camera.position.z;

  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  const rx =  Math.cos(yaw), rz = -Math.sin(yaw);

  let mx = 0, mz = 0;
  if (keys[binds.forward]) { mx += fx; mz += fz; }
  if (keys[binds.back]) { mx -= fx; mz -= fz; }
  if (keys[binds.right]) { mx += rx; mz += rz; }
  if (keys[binds.left]) { mx -= rx; mz -= rz; }

  if (missionRun && missionRun.intro) { mx = 0; mz = 0; }       // riding the truck / boat in: no walking yet
  const len = Math.hypot(mx, mz);
  if (len > 0) { mx /= len; mz /= len; }

  if (activeLadder && (keys[binds.left] || keys[binds.right])) activeLadder = null;
  if (!activeLadder) {
    const feet = camera.position.y - curEye;
    activeLadder = climbableLadders.find(l => {
      const aligned = Math.abs(camera.position.x - l.x) < 0.75 && Math.abs(camera.position.z - l.z) < 1.15;
      const climbingUp = feet < l.topY - 0.12 && !!keys[binds.forward];
      const climbingDown = feet > l.baseY + 0.12 && !!keys[binds.back];
      return aligned && (climbingUp || climbingDown);
    }) || null;
  }
  if (activeLadder) { const kk = Math.min(1, dt * 14); camera.position.x += (activeLadder.x - camera.position.x) * kk; camera.position.z += (activeLadder.standZ - camera.position.z) * kk; if (scoped) setScoped(false); }   // eases onto the ladder, close to the rungs

  const isMoving = (mx !== 0 || mz !== 0);
  const isSprinting = !activeLadder && sprintActive();
