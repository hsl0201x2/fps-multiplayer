<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FPS Game</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#1a1d24; font-family:system-ui, Arial, sans-serif; }
  canvas { display:block; }

  #vignette { position: fixed; inset: 0; z-index: 9; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.18) 100%); }
  #hud {
    position: fixed; top: 16px; left: 16px; color: #e9eef5; z-index: 10;
    font-size: 14px; line-height: 1.45; text-shadow: 0 1px 3px #000;
    background: rgba(20,24,32,0.45); padding: 10px 14px; border-radius: 10px;
    pointer-events: none; user-select: none;
    min-width: 260px;
  }
  #hud b { color:#7fd4ff; }

  #playerHealthBar {
    position: fixed; bottom: 16px; left: 16px;
    width: 360px; z-index: 10; pointer-events: none; user-select: none;
  }
  #playerHealthBar .bar-bg {
    position: relative; height: 38px; overflow: hidden;
    background: rgba(0,0,0,0.55); border: 2px solid rgba(255,255,255,0.35); border-radius: 3px;
  }
  #playerHealthBar .bar-fill { height:100%; background:#4dff88; transition: width 0.12s, background 0.25s; }
  #playerHealthBar .bar-bg::before {
    content:""; position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;
  }
  #playerHealthBar .bar-bg.hit::before { animation: hpFlash 0.3s ease-out; }
  @keyframes hpFlash { 0% { opacity:0.9; } 100% { opacity:0; } }
  #playerHealthBar .bar-text {
    position: absolute; inset: 0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:17px; font-weight:900; letter-spacing:0.5px;
    font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000, 0 0 4px #000;
  }

  #damageFlash {
    position: fixed; inset:0; pointer-events:none; z-index:15;
    background: rgba(255,50,50,0); transition: background 0.05s;
  }
  #bloodEdges {
    position: fixed; inset: 0; pointer-events: none; z-index: 15; opacity: 0;
    background-repeat: no-repeat; background-size: 100% 100%; will-change: opacity;
  }
  #flashEffect {
    position: fixed; inset: 0; z-index: 16; pointer-events: none;
    background: #fff; opacity: 0;
  }

  #scopeOverlay {
    position: fixed; inset:0; z-index:14; pointer-events:none;
    display: none; background: transparent;
  }
  #scopeOverlay canvas {
    position: absolute; inset:0; width:100%; height:100%; background: transparent;
  }

  #weaponText {
    position: fixed; bottom: 18px; right: 18px; color: #ffd27f; z-index: 10;
    font-size: 18px; font-weight: 800; text-shadow: 0 1px 3px #000;
    background: rgba(20,24,32,0.45); padding: 8px 14px; border-radius: 10px;
    pointer-events: none; user-select: none;
  }

  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 44px; height: 44px; z-index: 30; pointer-events: none;
  }
  #crosshair .line { position:absolute; background: var(--ch-color, #4dff88); box-shadow: 0 0 4px #000; }
  #crosshair .dot {
    position:absolute;
    width: var(--ch-dot, 0px); height: var(--ch-dot, 0px);
    border-radius: 50%;
    background: var(--ch-color, #4dff88);
    left:50%; top:50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 4px #000;
  }

  /* Hitmarker X */
  #hitmarker {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 34px; height: 34px;
    z-index: 31;
    pointer-events: none;
    opacity: 0;
  }
  #hitmarker i {
    position:absolute; left: 50%; top: 50%;
    width: 11px; height: 1.5px;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 0 3px rgba(0,0,0,0.8);
    border-radius: 1px;
    transform-origin: center;
  }
  #hitmarker i:nth-child(1) { transform: translate(-50%,-50%) rotate(45deg)  translateX(22px); }
  #hitmarker i:nth-child(2) { transform: translate(-50%,-50%) rotate(135deg) translateX(22px); }
  #hitmarker i:nth-child(3) { transform: translate(-50%,-50%) rotate(225deg) translateX(22px); }
  #hitmarker i:nth-child(4) { transform: translate(-50%,-50%) rotate(315deg) translateX(22px); }
  #hitmarker.crit i { background: rgba(127,212,255,0.98); }

  #overlay {
    position: fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    background: rgba(10,12,18,0.74); backdrop-filter: blur(3px);
    color:#e9eef5; padding: 20px; overflow:auto;
  }
  #menuPanel {
    width: min(900px, 94vw); max-height: 92vh; display:flex; flex-direction:column;
    background: rgba(18,22,30,0.96); border:1px solid rgba(127,212,255,0.18);
    border-radius:14px; box-shadow: 0 24px 70px rgba(0,0,0,0.65); overflow:hidden;
  }
  #menuHead { padding: 22px 28px 12px; }
  #menuHead h1 { margin:0; font-size:32px; font-weight:800; letter-spacing:0.5px; }
  #menuHead p { margin:6px 0 0; font-size:14px; opacity:.7; }
  #menuTabs { display:flex; gap:4px; padding: 0 20px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .menuTab {
    background:none; border:none; color:#9aa7b8; font:700 15px system-ui, Arial, sans-serif;
    padding:12px 16px; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-1px;
  }
  .menuTab:hover { color:#e9eef5; }
  .menuTab.active { color:#4dff88; border-bottom-color:#4dff88; }
  .menuTab:focus-visible, .btn:focus-visible, .keyBtn:focus-visible, .mapCard:focus-visible,
  .loadoutSlot:focus-visible, .catalogCard:focus-visible { outline:2px solid #7fd4ff; outline-offset:2px; }
  #menuBody { padding: 20px 28px 24px; overflow:auto; min-height: 320px; }
  .menuPage { display:none; }
  .menuPage.active { display:block; }
  #menuFoot {
    display:flex; gap:12px; justify-content:flex-end; align-items:center;
    padding: 16px 28px; border-top:1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.28);
  }
  #menuFoot .hint { margin-right:auto; font-size:13px; opacity:.6; }

  .btn {
    font:800 15px system-ui, Arial, sans-serif; padding:11px 22px; border-radius:10px;
    border:1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); color:#e9eef5; cursor:pointer;
  }
  .btn:hover { background: rgba(255,255,255,0.13); }
  .btn.primary { background:#4dff88; color:#08140c; border-color:#4dff88; }
  .btn.primary:hover { background:#7dffa8; }
  .btn.small { padding:7px 12px; font-size:13px; font-weight:700; }

  .pageNote { margin:0 0 14px; font-size:14px; opacity:.72; line-height:1.5; max-width:62ch; }

  .mapGrid { display:grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr)); gap:14px; }
  .mapCard {
    text-align:left; cursor:pointer; padding:16px; border-radius:12px;
    border:2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
    color:inherit; font:inherit;
  }
  .mapCard:hover { border-color: rgba(127,212,255,0.5); }
  .mapCard.selected { border-color:#4dff88; background: rgba(77,255,136,0.08); }
  .mapCard h3 { margin:0 0 4px; font-size:18px; }
  .mapCard .size { font-size:13px; color:#7fd4ff; font-weight:700; }
  .timeToggle { display:flex; gap:10px; }
  .timeToggle .btn.sel { border-color:#4dff88; color:#4dff88; background: rgba(77,255,136,0.1); }
  .timeToggle .btn:disabled { opacity:.4; cursor:not-allowed; }
  .mapCard p { margin:10px 0 0; font-size:14px; opacity:.78; line-height:1.45; }

  .row { display:grid; grid-template-columns: 190px 1fr 64px; gap:14px; align-items:center; margin: 12px 0; }
  .row label { font-weight:700; font-size:14px; }
  .row input[type=range] { width:100%; accent-color:#4dff88; }
  .row .val { text-align:right; font-variant-numeric: tabular-nums; color:#7fd4ff; font-weight:800; }
  .viewBobControls { margin: 2px 0 16px 28px; }
  .viewBobControls .row { margin: 8px 0; }
  .fpsLimitRow { display:flex; align-items:center; gap:12px; margin:10px 0 18px; font-size:14px; }
  .fpsLimitRow label { min-width:90px; font-weight:700; }
  .fpsLimitRow select { padding:7px 10px; border-radius:8px; background:#10141b; color:#e9eef5; border:1px solid rgba(255,255,255,0.2); font:700 14px system-ui, Arial, sans-serif; }
  .fpsLimitRow span { font-size:12px; opacity:.6; }
  .secTitle { margin: 24px 0 8px; font-size:16px; font-weight:800; }
  .secTitle:first-child { margin-top:0; }
  .secTitle span { font-size:13px; font-weight:500; opacity:.6; margin-left:8px; }
  .toggleRow { display:flex; align-items:center; gap:10px; margin:12px 0; font-weight:700; font-size:14px; cursor:pointer; }
  .toggleRow input { width:18px; height:18px; accent-color:#4dff88; cursor:pointer; }
  .toggleRow small { font-weight:500; opacity:.6; }

  .bindGrid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap:2px 28px; }
  .bindRow {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:14px;
  }
  .keyBtn {
    min-width:104px; padding:7px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.2);
    background:rgba(0,0,0,0.35); color:#ffd27f; font:800 13px system-ui, Arial, sans-serif; cursor:pointer;
  }
  .keyBtn:hover { border-color:#7fd4ff; }
  .keyBtn.listening { border-color:#4dff88; color:#4dff88; animation: keyPulse 0.9s infinite; }
  @keyframes keyPulse { 50% { background: rgba(77,255,136,0.18); } }
  @media (prefers-reduced-motion: reduce) { .keyBtn.listening { animation:none; } }

  #loadoutSlots {
    position:relative; display:grid; grid-template-columns:minmax(0, 3fr) minmax(150px, 0.95fr); gap:22px;
    align-items:stretch; margin: 4px 0 14px;
  }
  #mainWeaponSlots { position:relative; z-index:2; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
  #utilitySlotGroup { position:relative; z-index:2; padding-left:18px; border-left:1px solid rgba(255,255,255,0.12); }
  #loadout3DCanvas {
    position:absolute; inset:0; z-index:1; width:100%; height:100%; pointer-events:none;
    filter:brightness(0.82) drop-shadow(0 0 18px rgba(130,155,185,0.26)) drop-shadow(0 0 42px rgba(95,120,150,0.21));
  }
  .loadoutSlot {
    box-sizing:border-box; width:100%; min-width:0; aspect-ratio:1; padding:10px; display:flex; flex-direction:column;
    align-items:center; justify-content:space-between; gap:6px; cursor:pointer; color:#e9eef5;
    border:2px solid rgba(255,255,255,0.13); border-radius:12px;
    background:linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.08));
    font:700 13px system-ui, Arial, sans-serif; text-align:center;
    transition:border-color .15s, background .15s, transform .15s;
  }
  .loadoutSlot:hover { border-color:rgba(127,212,255,0.6); transform:translateY(-2px); }
  .loadoutSlot.selected { border-color:#4dff88; background:rgba(77,255,136,0.21); box-shadow:0 0 18px rgba(77,255,136,0.12); }
  .loadoutSlot.pendingTarget { border-color:#ffd27f; }
  .loadoutSlot .slotKey { align-self:stretch; color:#ffd27f; font-size:12px; font-weight:900; }
  .loadoutSlot .slotPreview { width:100%; height:40%; flex:0 0 40%; min-height:0; }
  .loadoutSlot .slotName { display:block; min-height:0; overflow-wrap:anywhere; font-size:13px; line-height:1.15; }
  .loadoutSlot .slotInfo { display:block; font-size:10.5px; line-height:1.18; opacity:.78; }
  .loadoutSlot.empty .slotPreview { display:none; }
  .loadoutSlot.empty .slotPlus { font-size:28px; color:#7fd4ff; line-height:1; }
  #utilitySlotGroup .loadoutSlot { border-color:rgba(255,210,127,0.24); }
  #utilitySlotGroup .loadoutSlot.selected { border-color:#4dff88; }
  .loadoutInstructions { max-width:none; width:100%; }
  #loadoutActionRow { display:flex; align-items:center; gap:12px; width:100%; box-sizing:border-box; margin:4px 0 12px; }
  #loadoutActionHint { flex:1; color:rgba(233,238,245,0.78); font-size:13px; line-height:1.4; }
  #clearMainSlotBtn:disabled { opacity:.35; cursor:not-allowed; }
  .catalogGrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:12px; }
  .catalogCard {
    box-sizing:border-box; min-width:0; padding:10px; display:flex; flex-direction:column; align-items:stretch; gap:5px;
    text-align:left; color:#e9eef5; cursor:pointer; border:1px solid rgba(255,255,255,0.12);
    border-radius:11px; background:rgba(255,255,255,0.12); font:inherit;
    transition:border-color .15s, background .15s, transform .15s;
  }
  .catalogCard:hover { border-color:rgba(127,212,255,0.6); background:rgba(255,255,255,0.18); transform:translateY(-2px); }
  .catalogCard.equipped { border-color:rgba(77,255,136,0.45); }
  .catalogCard.pending { border-color:#ffd27f; background:rgba(255,210,127,0.17); }
  .catalogCard img {
    width:100%; height:84px; object-fit:contain;
    filter:brightness(1.02) contrast(1.08) saturate(1.05) drop-shadow(0 0 18px rgba(130,155,185,0.26)) drop-shadow(0 0 42px rgba(95,120,150,0.21));
  }
  .catalogCard .catalogName { font-size:14px; font-weight:900; }
  .catalogCard .catalogInfo { font-size:12px; line-height:1.45; opacity:.72; }
  .catalogCard.utilityCard img { height:72px; }
  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr 56px; }
    .row input[type=range] { grid-column: 1 / -1; grid-row: 2; }
    #loadoutSlots { min-width:610px; }
  }

  #hotbar {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    display:flex; gap:8px; z-index: 11; pointer-events:none; user-select:none; align-items:flex-end;
  }
  #hotbar .slot {
    min-width: 84px; padding: 5px 10px; text-align:center; border-radius:8px;
    background: rgba(20,24,32,0.5); border:2px solid rgba(255,255,255,0.15);
    color: rgba(233,238,245,0.7); font-size:12px; font-weight:700; text-shadow:0 1px 3px #000;
    transition: min-width .18s ease, font-size .18s ease, background .18s, border-color .18s, color .18s;
  }
  #hotbar .slot .k { display:block; font-size:11px; color:#ffd27f; font-weight:900; }
  #hotbar .slot .gunIcon {
    display:block; margin:2px auto 3px; width:72px; height:36px; object-fit:contain;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6)) brightness(0.92);
    transition: width .18s ease, height .18s ease, filter .18s;
  }
  #hotbar .slot.active { min-width: 150px; font-size:16px; border-color:#4dff88; color:#fff; background: rgba(77,255,136,0.14); }
  #hotbar .slot.active .gunIcon { width:132px; height:66px; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.7)) brightness(1.02); }
  @media (prefers-reduced-motion: reduce) { #hotbar .slot, #hotbar .slot .gunIcon { transition:none; } }
  #miniHelp { max-width: min(340px, 26vw); }
  #miniHelp.show { display: block; }

  #miniHelp {
    position: fixed; left: 16px; bottom: 74px;
    display: none;
    z-index: 12; color: rgba(233,238,245,0.8);
    background: rgba(20,24,32,0.35);
    padding: 8px 10px; border-radius: 10px;
    font-size: 12px; line-height: 1.35;
    pointer-events:none;
  }

  #ammoMag {
    position: fixed;
    right: 22px;
    bottom: 72px;
    width: 92px;
    height: 138px;
    z-index: 11;
    pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.45));
  }
  #ammoMagShape {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(150,155,162,0.46), rgba(75,80,88,0.30));
    border: 2px solid rgba(235,240,245,0.38);
    border-left-color: rgba(255,255,255,0.55);
    border-top-color: rgba(255,255,255,0.48);
    border-radius: 18px 18px 30px 42px;
    clip-path: polygon(20% 0%, 85% 7%, 75% 100%, 0% 88%);
    overflow: hidden;
    backdrop-filter: blur(4px);
  }
  #ammoMagShape::before {
    content: "";
    position: absolute;
    inset: 10px 16px 12px 10px;
    border-left: 2px solid rgba(255,255,255,0.22);
    border-radius: 18px 12px 26px 34px;
    transform: rotate(-4deg);
  }
  #ammoMagShape::after {
    content: "";
    position: absolute;
    top: 8px;
    bottom: 10px;
    left: 41%;
    width: 2px;
    background: rgba(255,255,255,0.18);
    transform: rotate(5deg);
  }
  #ammoMagFill {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 100%;
    background: linear-gradient(0deg, rgba(127,212,255,0.36), rgba(127,212,255,0.10));
    transition: height 0.12s ease-out;
  }
  #ammoMagNum {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 900;
    color: rgba(255,255,255,0.94);
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    letter-spacing: -1px;
  }
  #ammoMagLabel {
    position: absolute;
    width: 100%;
    bottom: -20px;
    text-align: center;
    color: rgba(233,238,245,0.75);
    font-size: 11px;
    font-weight: 800;
    text-shadow: 0 1px 4px #000;
  }


  /* ---------- Utility counter (beside the ammo) ---------- */
  #utilChip { position:fixed; right:126px; bottom:72px; z-index:11; pointer-events:none; user-select:none; }
  #utilChip .slot { position:relative; overflow:hidden; width:92px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 6px 8px;
    border-radius:10px; background:rgba(20,24,32,0.55); border:2px solid rgba(235,240,245,0.35); color:#e9eef5; font-size:12px; font-weight:800; text-shadow:0 1px 4px #000; filter:drop-shadow(0 8px 14px rgba(0,0,0,0.45)); }
  #utilChip .slot .k { display:block; font-size:11px; color:#ffd27f; font-weight:900; }
  #utilChip .slot .gunIcon { width:70px; height:42px; object-fit:contain; }
  #utilChip .slot.gren.empty { opacity:0.45; }
  #utilChip .slot.gren .cooldown { position:absolute; left:0; right:0; bottom:0; height:0; display:block; z-index:3; background:rgba(255,255,255,0.48); pointer-events:none; transition:height .06s linear; }
  #utilChip .slot.gren.gain { animation: gGain .9s ease-out; }
  @keyframes gGain {
    0%   { transform: scale(1.25); border-color: #4dff88; box-shadow: 0 0 22px rgba(77,255,136,0.7); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { #utilChip .slot.gren.gain { animation: none; } }
  body.dead #utilChip { opacity:0 !important; transition: opacity .4s; }

  /* ---------- Death screen ---------- */
  body.dead #hud, body.dead #playerHealthBar, body.dead #weaponText, body.dead #hotbar,
  body.dead #ammoMag, body.dead #crosshair, body.dead #hitmarker, body.dead #miniHelp { opacity:0 !important; transition: opacity .4s; }

  #deathScreen {
    position: fixed; inset:0; z-index:45; display:none; flex-direction:column; align-items:center;
    color:#fff; font-family: "Courier New", ui-monospace, Menlo, Consolas, monospace;
    background:
      radial-gradient(ellipse at center, rgba(120,0,0,0.20) 0%, rgba(60,0,0,0.55) 100%),
      rgba(200,10,10,0.50);
    opacity:0; transition: opacity 1.1s ease-out;
    user-select:none; padding: 24px; box-sizing:border-box;
  }
  #deathScreen.show { display:flex; }
  #deathScreen.fade { opacity:1; }
  #dsMain { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; width:100%; }
  #dsTitle { font-size: clamp(16px, 2.2vw, 26px); letter-spacing: 0.5em; color: rgba(255,255,255,0.8); min-height:1.3em; margin-bottom: 4px; }
  #dsScoreLabel { font-size: clamp(14px, 1.8vw, 22px); letter-spacing: 0.3em; color: rgba(255,225,225,0.85); min-height:1.3em; }
  #dsScore {
    font-size: clamp(72px, 16vw, 190px); font-weight: 900; line-height: 1.05; min-height: 1.05em;
    text-shadow: 0 4px 0 rgba(90,0,0,0.8), 0 0 40px rgba(0,0,0,0.6); font-variant-numeric: tabular-nums;
  }
  #dsStats { display:grid; grid-template-columns: repeat(4, minmax(90px, 160px)); gap: 18px 36px; margin-top: 28px; opacity:0; transition: opacity .65s ease-out; }
  #dsStats.ready { opacity:1; }
  #dsStats.instant, #dsButtons.instant { transition:none !important; }
  .dsStat .lbl { font-size: clamp(11px, 1.3vw, 15px); letter-spacing: 0.25em; color: rgba(255,225,225,0.8); min-height:1.3em; }
  .dsStat .val { font-size: clamp(26px, 3.6vw, 46px); font-weight: 800; min-height: 1.2em; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
  #dsScreenText .typing::after, #deathScreen .typing::after {
    content: "\2588"; margin-left: 3px; font-weight: 400; animation: dsBlink .5s steps(1) infinite;
  }
  @keyframes dsBlink { 50% { opacity: 0; } }
  #dsButtons {
    display:flex; gap:16px; justify-content:center; padding-bottom: 4vh;
    opacity:0; pointer-events:none; transition: opacity .6s;
  }
  #dsButtons.ready { opacity:1; pointer-events:auto; }

      <div class="dsStat"><div class="lbl"></div><div class="val"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*
  Tactical FPS (single file)
  Requested changes:
  - Remove accuracy display (done)
  - Bigger maps + multiple maps (done, map selector UI)
  - "Animations 4,5": add weapon swap animation + ADS sway + weapon bob (done) + basic sound clicks (minimal; optional)
  - Hitmarker X on hit (done)
  - Tactical feel: AI spreads out, shoots less perfectly, uses cover, pauses, repositions; not constant laser-beam (done)
*/

// -----------------------
// Globals
// -----------------------
let scene, camera, renderer, raycaster;
let activeAntialias = false;
const clock = new THREE.Clock();

const keys = {};
let yaw = 0, pitch = 0;
let locked = false;
let mouseDown = false;
let scoped = false;
let gunAimBlend = 0; let scopeBlend = 0;      // rifle pose blend; reaches center before the screen zoom starts
let scopeSequenceBlend = 0; // shared timeline: rifle first, then scope screen
let scopeTransitionFrom = 0, scopeTransitionTarget = 0, scopeTransitionElapsed = 0;
let scopeViewBlend = 0;   // linked camera FOV and original scope overlay blend

let score = 0, shots = 0, hits = 0, headshots = 0, kills = 0;
let bestScore = 0;

// Death screen state
let dying = false;          // true from the moment you die until Restart / Back to menu
let deathT = 0;             // seconds since death (drives the fall animation)
let deathRollDir = 1;       // which way you fall (random left/right)
let deathToken = 0;         // cancels a running typing animation
let deathSkipCurrent = null; // completes the current typing or fade phase on click
const DEATH_FALL_TIME = 0.6;

// Player
let playerHP = 100;
let PLAYER_MAX_HP = 100;
let lastDamageTime = 0;
const HEAL_DELAY = 5200;
const HEAL_RATE = 13;

const PLAYER = { height: 1.95, jumpVel: 7.0, gravity: 20, grounded: true };
const PLAYER_RADIUS = 0.35;
const MAX_STEP_HEIGHT = 0.30;
let yVel = 0;
let activeLadder = null;
let stairLag = 0, ladderPhase = 0, ladderBlend = 0, ladderMoveK = 0, ladderExit = null;   // stairLag: view catches up with each stair riser smoothly

// Crouch + sprint rules
const CROUCH = { eye: 1.14, speedMul: 0.5, lerp: 14 };   // eye height while crouched, speed multiplier, how fast the view lowers
const RELOAD_SPEED_MUL = 0.6;                            // movement speed multiplier while reloading
const _bobBase = new THREE.Vector3();
const SLIDE = { dur: 0.9, boost: 7, eye: 1.35 };
let slidePose = 0, hipFireK = 0;
const slideState = { t: 0, cd: 0, want: false, dx: 0, dz: 0 };
const pVel = { x: 0, z: 0 };   // horizontal velocity (momentum)
let gStrafe = 0;               // smoothed sideways speed, -1 (left) .. 1 (right), used to roll the gun
let curEye = PLAYER.height;                              // current eye height (smoothly moves between standing and crouched)
function crouchHeld() { return !!keys[binds.crouch]; }
function moveInput() {
  return (!!keys[binds.forward] !== !!keys[binds.back]) || (!!keys[binds.left] !== !!keys[binds.right]);
}
// Sprinting = sprint key held while actually moving. Not possible while crouched or reloading.
// While sprinting you can't shoot, reload, scope or regenerate health.
function sprintActive() {
  return !!keys[binds.sprint] && moveInput() && !crouchHeld() && !reloading;
}
let jumpQueued = false;

const BOUNDS = { x: 44, zMin: -120, zMax: 20 }; // dynamic per map via setBounds()
let currentBounds = { ...BOUNDS };

// UI DOM
let hudEl, weaponTextEl, overlayEl, damageFlashEl, hitMarkerEl;

// Scope

let audioCtx = null;
function beep(freq=280, dur=0.03, type="square", vol=0.06) {
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

// -----------------------
// Synthesized gunfire + gun foley (no samples: everything is built in code from
// noise, sine thumps, sweeping filters, soft-clip distortion and generated reverb)
// -----------------------
// A gunshot is layered the way a real one sounds:
//   1. crack   - a few ms of bright, high-passed noise (the sharp supersonic snap / muzzle blast front)
//   2. body    - noise through a low-pass that sweeps from bright to dark, then soft-clipped for grit (the "bang")
//   3. thump   - a sine whose pitch drops fast (chest-punch of the pressure wave)
//   4. rumble  - dark brown noise that decays slowly (low-end tail)
//   5. space   - everything is sent into a generated reverb (outdoor = slap-back echoes, indoor = dense reflections)
// Every shot gets small random pitch/level changes so automatic fire never sounds like a looped sample.
// Enemy shots use the same engine, with distance filtering, attenuation, speed-of-sound delay and stereo pan.
const GunSFX = (() => {
  let ctx = null, dryBus = null, sendOut = null, sendIn = null;
  let white = null, brown = null, shaperCurve = null;
  let lastEnemyShot = 0;

  const PROFILES = {
    //            crack hp / level / length        body sweep (Hz) / length / level   thump (Hz) / length / level   rumble       drive  volume
    sniper:  { crackHP: 1500, crack: 1.00, crackDur: 0.030, bodyF0: 3200, bodyF1: 160, bodyDur: 0.34, body: 1.10, thumpF0: 120, thumpF1: 34, thumpDur: 0.30, thump: 1.15, rumbleDur: 1.30, rumble: 0.80, drive: 3.5, vol: 1.00 },
    rifle:   { crackHP: 2400, crack: 0.95, crackDur: 0.020, bodyF0: 3000, bodyF1: 260, bodyDur: 0.17, body: 0.90, thumpF0: 170, thumpF1: 55, thumpDur: 0.13, thump: 0.80, rumbleDur: 0.55, rumble: 0.45, drive: 3.0, vol: 0.85 },
    smg:     { crackHP: 3000, crack: 0.85, crackDur: 0.014, bodyF0: 3800, bodyF1: 420, bodyDur: 0.11, body: 0.75, thumpF0: 200, thumpF1: 80, thumpDur: 0.09, thump: 0.50, rumbleDur: 0.32, rumble: 0.30, drive: 2.6, vol: 0.72 },
    pistol:  { crackHP: 3200, crack: 0.90, crackDur: 0.016, bodyF0: 4200, bodyF1: 520, bodyDur: 0.10, body: 0.70, thumpF0: 220, thumpF1: 95, thumpDur: 0.08, thump: 0.42, rumbleDur: 0.30, rumble: 0.25, drive: 2.4, vol: 0.70 },
    shotgun: { crackHP: 900,  crack: 0.90, crackDur: 0.040, bodyF0: 2600, bodyF1: 130, bodyDur: 0.30, body: 1.15, thumpF0: 105, thumpF1: 30, thumpDur: 0.26, thump: 1.20, rumbleDur: 1.00, rumble: 0.85, drive: 3.8, vol: 1.00 }
  };
  const ENEMY_KIND = { rifler: "rifle", shotgun: "shotgun", sniper: "sniper" };

  // ---------- setup ----------
  function isIndoor() {
    try { const m = MAP_INFO[runMap || activeMapName()]; return !!(m && m.indoor); } catch (e) { return false; }
  }

  // Generated impulse response: decaying noise that darkens over time, plus discrete early reflections.
  function makeIR(seconds, decayPow, aStart, aEnd, preDelay, taps) {
    const rate = ctx.sampleRate, n = Math.floor(rate * seconds);
    const buf = ctx.createBuffer(2, n, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      const pre = Math.floor((preDelay + ch * 0.0006) * rate);
      let lp = 0;
      for (let i = pre; i < n; i++) {
        const t = i / n;
        const a = aStart + (aEnd - aStart) * t;               // one-pole low-pass, getting darker
        lp += a * ((Math.random() * 2 - 1) * Math.pow(1 - t, decayPow) - lp);
        d[i] = lp;
      }
      for (const [tt, amp] of taps) {                         // early reflections / echoes off buildings and walls
        const start = Math.floor((tt + ch * 0.004) * rate), len = Math.floor(0.012 * rate);
        let l2 = 0;
        for (let i = 0; i < len && start + i < n; i++) {
          l2 += 0.3 * ((Math.random() * 2 - 1) * amp * Math.pow(1 - i / len, 2) - l2);
          d[start + i] += l2 * 4;
        }
      }
    }
    return buf;
  }

  function init() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return true; }
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      ctx = audioCtx;
      if (ctx.state === "suspended") ctx.resume();
    } catch (e) { ctx = null; return false; }

    // noise sources (white for crack/body/clicks, brown for low rumble)
    const rate = ctx.sampleRate, len = Math.floor(rate * 4);
    white = ctx.createBuffer(1, len, rate); brown = ctx.createBuffer(1, len, rate);
    const w = white.getChannelData(0), b = brown.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const x = Math.random() * 2 - 1;
      w[i] = x;
      last = (last + 0.02 * x) / 1.02;
      b[i] = last * 3.5;
    }
    // soft-clip curve used for the gritty body layer
    const N = 1024; shaperCurve = new Float32Array(N);
    for (let i = 0; i < N; i++) { const x = i / (N - 1) * 2 - 1; shaperCurve[i] = Math.tanh(x * 3) / Math.tanh(3); }

    // master: glue compressor so loud overlapping shots never clip
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 5;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    const master = ctx.createGain(); master.gain.value = 0.6;
    comp.connect(master); master.connect(ctx.destination);
    dryBus = ctx.createGain(); dryBus.connect(comp);

    // two reverbs: open-air (long, dark, with echoes) and indoor (short, bright, dense)
    const rOut = ctx.createConvolver();
    rOut.buffer = makeIR(1.8, 2.2, 0.55, 0.04, 0.012, [[0.12, 0.6], [0.26, 0.35]]);
    const rIn = ctx.createConvolver();
    rIn.buffer = makeIR(1.1, 2.6, 0.75, 0.10, 0.004, [[0.011, 0.7], [0.019, 0.6], [0.031, 0.5], [0.047, 0.4]]);
    sendOut = ctx.createGain(); sendIn = ctx.createGain();
    sendOut.connect(rOut); sendIn.connect(rIn);
    rOut.connect(comp); rIn.connect(comp);
    return true;
  }

  // ---------- small helpers ----------
  const node = (type, f, q) => { const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q === undefined ? 0.7 : q; return n; };
  const gainNode = (v) => { const g = ctx.createGain(); g.gain.value = v === undefined ? 1 : v; return g; };
  function noise(buf, t, dur) {
    const s = ctx.createBufferSource(); s.buffer = buf;
    s.start(t, Math.random() * (buf.duration - dur - 0.1)); s.stop(t + dur);
    return s;
  }
  function env(g, t, peak, atk, dec) {                        // fast attack, exponential decay
    const p = g.gain;
    p.setValueAtTime(0.0001, t);
    p.linearRampToValueAtTime(Math.max(peak, 0.0002), t + atk);
    p.exponentialRampToValueAtTime(0.0001, t + atk + dec);
  }

  // Send a layered sound through distance filter -> pan -> dry bus + reverb send.
  function route(src, dist, pan, wetMul) {
    const indoor = isIndoor();
    const far = Math.min(dist / 40, 1);
    const atten = 1 / (1 + dist * 0.045);
    let n = src;
    const lp = node("lowpass", Math.max(1400, 18000 / (1 + dist * 0.12)), 0.5);   // air absorbs highs with distance
    n.connect(lp); n = lp;
    if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); n.connect(p); n = p; }
    const dry = gainNode(atten * (1 - 0.4 * Math.min(dist / 120, 1)));
    const wet = gainNode((indoor ? 0.55 : 0.40) * (wetMul === undefined ? 1 : wetMul) * (0.6 + 0.9 * far) * Math.sqrt(atten));  // far shots are mostly reverb
    n.connect(dry); dry.connect(dryBus);
    n.connect(wet); wet.connect(indoor ? sendIn : sendOut);
  }

  // Close, centred foley (clicks, slides, metal) that stays relative to the player.
  function foleyOut(g, wet) {
    g.connect(dryBus);
    const w = gainNode(wet === undefined ? 0.12 : wet);
    g.connect(w); w.connect(isIndoor() ? sendIn : sendOut);
  }
  function click(t, f, q, vol, dur) {                          // short band-passed noise tick
    dur = dur || 0.012;
    const s = noise(white, t, dur + 0.02), bp = node("bandpass", f, q), g = gainNode(0);
    env(g, t, vol, 0.0004, dur); s.connect(bp); bp.connect(g); foleyOut(g);
  }
  function tink(t, f, vol, dur) {                              // metallic ring: inharmonic sine partials
    dur = dur || 0.09;
    const g = gainNode(0); env(g, t, vol, 0.0005, dur);
    for (const [m, a] of [[1, 1], [2.76, 0.6], [5.4, 0.3]]) {
      const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f * m;
      const ag = gainNode(a); o.connect(ag); ag.connect(g); o.start(t); o.stop(t + dur + 0.05);
    }
    foleyOut(g, 0.15);
  }
  function thunk(t, f, vol, dur) {                             // dull impact: dropping sine + a click on top
    dur = dur || 0.07;
    const o = ctx.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(f * 1.5, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.03);
    const g = gainNode(0); env(g, t, vol, 0.001, dur);
    o.connect(g); foleyOut(g, 0.1); o.start(t); o.stop(t + dur + 0.05);
    click(t, f * 8, 1.2, vol * 0.6, 0.008);
  }
  function slide(t, dur, f0, f1, vol) {                        // metal-on-metal rasp, filter sweeps f0 -> f1
    const s = noise(white, t, dur + 0.03), bp = node("bandpass", f0, 2.5), g = gainNode(0);
    bp.frequency.setValueAtTime(f0, t); bp.frequency.linearRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * 0.25);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); foleyOut(g, 0.08);
  }

  // ---------- weapon actions ----------
  function boltCycle(t) {                                      // AWP: lift, pull back, eject, push forward, lock
    click(t, 2200, 4, 0.5); tink(t + 0.004, 2400, 0.12);
    slide(t + 0.03, 0.14, 900, 1800, 0.35);
    thunk(t + 0.20, 180, 0.6); tink(t + 0.205, 1600, 0.15, 0.1);
    tink(t + 0.34, 4300, 0.10, 0.1);                           // spent case hits the floor
    slide(t + 0.40, 0.14, 1800, 900, 0.30);
    thunk(t + 0.55, 150, 0.55); click(t + 0.57, 2600, 4, 0.5);
  }
  function pumpCycle(t) {                                      // Mossberg: pump back, hull falls out, pump forward
    slide(t, 0.12, 700, 1400, 0.40);
    thunk(t + 0.12, 170, 0.55); click(t + 0.12, 2000, 3, 0.4);
    thunk(t + 0.30, 400, 0.18, 0.05); tink(t + 0.31, 3200, 0.09, 0.08);
    slide(t + 0.20, 0.12, 1400, 700, 0.40);
    thunk(t + 0.34, 150, 0.60); click(t + 0.34, 1800, 3, 0.5);
  }
  function brassTink(t, kind) {                                // ejected casing bouncing on the ground
    const base = kind === "pistol" ? 3800 : kind === "smg" ? 4000 : 4200;
    const f = base + Math.random() * 1600;
    tink(t, f, 0.045, 0.06);
  }

  // ---------- public ----------
  // kind: sniper | rifle | smg | pistol | shotgun.  dist (m) and pan are for sounds that aren't the player's own gun.
  function fire(kind, dist, pan, level) {
    if (!init()) return;
    const P = PROFILES[kind]; if (!P) return;
    dist = dist || 0; pan = pan || 0;
    const t0 = ctx.currentTime + 0.005 + Math.min(dist / 343, 0.35);   // speed of sound
    const pv = 1 + (Math.random() - 0.5) * 0.14;                        // random pitch per shot
    const bus = gainNode(P.vol * (0.9 + Math.random() * 0.2) * (level === undefined ? 1 : level));

    // 1. crack
    { const s = noise(white, t0, P.crackDur + 0.03), hp = node("highpass", P.crackHP * pv, 0.7), g = gainNode(0);
      env(g, t0, P.crack, 0.0006, P.crackDur); s.connect(hp); hp.connect(g); g.connect(bus); }
    // 2. body: bright-to-dark sweep, then saturated
    { const dur = P.bodyDur * 1.4, s = noise(white, t0, dur + 0.05), lp = node("lowpass", P.bodyF0 * pv, 0.8);
      lp.frequency.setValueAtTime(P.bodyF0 * pv, t0); lp.frequency.exponentialRampToValueAtTime(P.bodyF1 * pv, t0 + P.bodyDur);
      const pre = gainNode(P.drive), ws = ctx.createWaveShaper(); ws.curve = shaperCurve;
      const g = gainNode(0); env(g, t0, P.body, 0.001, dur);
      s.connect(lp); lp.connect(pre); pre.connect(ws); ws.connect(g); g.connect(bus); }
    // 3. thump
    { const dur = P.thumpDur * 1.6, o = ctx.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(P.thumpF0 * pv, t0); o.frequency.exponentialRampToValueAtTime(P.thumpF1 * pv, t0 + P.thumpDur);
      const g = gainNode(0); env(g, t0, P.thump, 0.002, dur);
      o.connect(g); g.connect(bus); o.start(t0); o.stop(t0 + dur + 0.05); }
    // 4. rumble tail
    { const s = noise(brown, t0, P.rumbleDur + 0.05), lp = node("lowpass", 600, 0.5);
      lp.frequency.setValueAtTime(600, t0); lp.frequency.exponentialRampToValueAtTime(90, t0 + P.rumbleDur);
      const g = gainNode(0); env(g, t0, P.rumble, 0.004, P.rumbleDur);
      s.connect(lp); lp.connect(g); g.connect(bus); }

    route(bus, dist, pan);

    // the player's own gun also plays its mechanical action
    if (dist === 0) {
      if (kind === "sniper") boltCycle(t0 + 0.12);
      else if (kind === "shotgun") pumpCycle(t0 + 0.16);
      else brassTink(t0 + 0.20 + Math.random() * 0.15, kind);
    }
  }

  function fireEnemy(classKey, pos, dist) {
    if (dist > 95) return;
    const nowMs = performance.now();
    if (nowMs - lastEnemyShot < 18) return;                    // keep the node count sane when many bots fire at once
    lastEnemyShot = nowMs;
    let pan = 0;
    try {
      const toE = pos.clone().sub(camera.position); toE.y = 0;
      const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y = 0;
      if (toE.lengthSq() > 1e-4 && fwd.lengthSq() > 1e-4) {
        toE.normalize(); fwd.normalize();
        pan = (toE.x * -fwd.z + toE.z * fwd.x) * 0.9;           // dot with the player's right vector
      }
    } catch (e) {}
    fire(ENEMY_KIND[classKey] || "rifle", dist, pan, 0.8);
  }

  function dryClick() {
    if (!init()) return;
    const t = ctx.currentTime + 0.002;
    click(t, 4200, 5, 0.5, 0.004); click(t + 0.032, 2400, 4, 0.3, 0.006); click(t + 0.036, 5400, 6, 0.2, 0.003);   // hammer on an empty chamber: sharp metallic double click
  }

  const RELOAD_MAP = { 140: "magOut", 230: "magIn", 300: "release", 280: "bolt", 200: "boltLock", 250: "shell", 275: "shell", 180: "pumpBack", 240: "pumpFwd", 150: "magKnock", 155: "magDrop", 156: "magLand", 160: "magGrab", 235: "magClack", 245: "magTap" };
  function reloadEvent(freq) {
    if (!init()) return;
    const t = ctx.currentTime + 0.002;
    switch (RELOAD_MAP[freq]) {
      case "magOut":   click(t, 2000, 3, 0.5); slide(t + 0.01, 0.09, 900, 1700, 0.30); tink(t + 0.10, 1200, 0.10); break;
      case "magGrab":  slide(t, 0.12, 1100, 2300, 0.22); click(t + 0.10, 1700, 2, 0.35, 0.02); thunk(t + 0.13, 280, 0.18, 0.05); break;                   // pouch flap + mag pulled free
      case "magKnock": thunk(t, 210, 0.5, 0.06); click(t, 3000, 2, 0.5, 0.01); tink(t + 0.004, 1900, 0.10, 0.07); break;                                 // heel of the hand hits the mag base
      case "magDrop":  slide(t, 0.07, 800, 1600, 0.30); tink(t + 0.07, 1500, 0.08, 0.05); break;                                                       // old mag slides out of the well
      case "magLand":  thunk(t, 170, 0.5, 0.08); tink(t + 0.004, 1500, 0.12, 0.08); tink(t + 0.10, 1250, 0.06, 0.06); break;                            // old mag hits the ground
      case "magClack": click(t, 3600, 6, 0.95, 0.006); click(t + 0.001, 2200, 3, 0.75, 0.008); thunk(t + 0.003, 240, 0.6, 0.05); tink(t + 0.002, 2800, 0.24, 0.10); tink(t + 0.013, 4700, 0.11, 0.05); tink(t + 0.03, 1900, 0.06, 0.05); tink(t + 0.001, 3300, 0.22, 0.16); tink(t + 0.008, 6100, 0.09, 0.07); break;   // sharp metallic clack as the mag seats
      case "magTap":   thunk(t, 200, 0.35, 0.05); click(t, 2500, 2, 0.4, 0.01); break;
      case "magIn":    slide(t, 0.06, 1700, 900, 0.25); thunk(t + 0.06, 190, 0.55); click(t + 0.06, 2400, 3, 0.5); tink(t + 0.065, 1800, 0.08); break;

// ---------- menu screens: game mode -> difficulty -> main menu ----------
let menuStage = "mode";
const DIFF_META = {
  easy:       { accent: "#7ee08a", unit: "Rifler",     blurb: "New here? Weaker, slower enemies and plenty of supplies." },
  medium:     { accent: "#ffd24a", unit: "Shotgunner", blurb: "A fair fight. Enemies hit back, but there is room to learn." },
  difficult:  { accent: "#ff8a3a", unit: "Sniper",     blurb: "The full challenge. Sharp-eyed enemies and tight supplies." },
  impossible: { accent: "#ff3b3b", unit: "Commander",  blurb: "Elite troops. Brutal damage, scarce supplies. Good luck." }
};
let _portraits = null;
// Renders each difficulty's soldier with the game's own 3D model into a transparent picture (once).
function ensurePortraits() {
  if (_portraits) return _portraits;
  _portraits = {};
  try {
    if (typeof renderer === "undefined" || !renderer) { _portraits = null; return {}; }
    const W = 360, H = 480;
    const rt = new THREE.WebGLRenderTarget(W, H, { format: THREE.RGBAFormat });
    const sc = new THREE.Scene();
    sc.add(new THREE.HemisphereLight(0xdfeaff, 0x44464e, 0.95));
    const key = new THREE.DirectionalLight(0xfff1da, 1.3); key.position.set(-3, 4, -4); sc.add(key);
    const rim = new THREE.DirectionalLight(0x7fd4ff, 0.7); rim.position.set(4, 2, 3); sc.add(rim);
    const cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 60);
    const prevColor = new THREE.Color(); renderer.getClearColor(prevColor);
    const prevAlpha = renderer.getClearAlpha(), prevTarget = renderer.getRenderTarget();
    renderer.setClearColor(0x000000, 0);
    const buf = new Uint8Array(W * H * 4);
    for (const [id, cls, hvt] of [["easy", "rifler", false], ["medium", "shotgun", false], ["difficult", "sniper", false], ["impossible", "rifler", true]]) {
      const e = makeEnemy(cls, { hvt });
      e.traverse(o => { if (o.isSprite) o.visible = false; });
      if (e.userData.hvtMarker) e.userData.hvtMarker.visible = false;
      e.rotation.y = 0.7;
      sc.add(e);
      const top = 1.7 * ENEMY_LOOK[cls].scale, dist = top * 2.2;
      cam.position.set(0.5, top * 0.56, -dist);
      cam.lookAt(0, top * 0.5, 0);
      renderer.setRenderTarget(rt); renderer.clear(); renderer.render(sc, cam);
      renderer.readRenderTargetPixels(rt, 0, 0, W, H, buf);
      const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      const ctx = cv.getContext("2d"), img = ctx.createImageData(W, H);
      for (let y = 0; y < H; y++) { const src = (H - 1 - y) * W * 4; img.data.set(buf.subarray(src, src + W * 4), y * W * 4); }   // GL rows are bottom-up
      ctx.putImageData(img, 0, 0);
      _portraits[id] = cv.toDataURL("image/png");
      sc.remove(e);
    }
    renderer.setRenderTarget(prevTarget); renderer.setClearColor(prevColor, prevAlpha);
    rt.dispose();
  } catch (err) { _portraits = _portraits || {}; }
  return _portraits;
}

function updateCrumbs() {
  const cm = document.getElementById("crumbMode"), cd = document.getElementById("crumbDiff");
  if (!cm || !cd) return;
  const missions = settings.mode === "missions", meta = DIFF_META[settings.difficulty] || DIFF_META.medium;
  cm.textContent = missions ? "Missions" : settings.sandbox ? "Sandbox" : "Survival";
  cm.style.setProperty("--accent", missions ? "#3fc2ff" : settings.sandbox ? "#4dff88" : "#ff6a4a");
  cd.textContent = DIFF().name;
  cd.style.setProperty("--accent", meta.accent);
}

function renderDiffCards() {
  const wrap = document.getElementById("diffCards"); if (!wrap) return;
  const missions = settings.mode === "missions";
  const chip = document.getElementById("diffChip");
  if (chip) { chip.textContent = missions ? "Missions" : settings.sandbox ? "Sandbox" : "Survival"; chip.style.setProperty("--accent", missions ? "#3fc2ff" : settings.sandbox ? "#4dff88" : "#ff6a4a"); }
  const P = ensurePortraits();
  const mx = missions ? [1.4, 1.5, 1.3] : [1.9, 2.0, 1.5];
  const bar = (label, v, max) => `<div class="dBar"><span>${label}</span><i><b style="width:${Math.min(100, Math.round(v / max * 100))}%"></b></i><em>${Math.round(v * 100)}%</em></div>`;
  wrap.innerHTML = Object.entries(difficultyTable()).map(([id, D]) => {
    const m = DIFF_META[id];
    const extra = missions ? `${D.mags} spare mags · ${Math.round(D.time * 100)}% time` : `${Math.round(D.count * 100)}% wave size · regen ${Math.round(D.heal * 100)}%`;
    return `<button class="diffCard${settings.difficulty === id ? " selected" : ""}" data-diff="${id}" type="button" style="--accent:${m.accent}">
        <div class="dPortrait">${P[id] ? `<img src="${P[id]}" alt="">` : `<div class="dFallback"></div>`}</div>
        <div class="dBody">
          <h2>${D.name}</h2>

// Small rendered 3D icons of each gun for the hotbar (rendered once with three.js, then cached as images)
const gunIconCache = {};
const grenadeIconCache = {};
let gunIconRenderer = null;

function createLoadout3DState(kind, id) {
  const key = `${kind}:${id}`;
  if (loadout3DStates.has(key)) return loadout3DStates.get(key);

  const previewScene = new THREE.Scene();
  previewScene.add(new THREE.AmbientLight(0xffffff, 1.9)); previewScene.add(new THREE.HemisphereLight(0xffffff, 0x99a3b0, 0.9));
  const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
  keyLight.position.set(-2, 3, 5); previewScene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.9);
  fillLight.position.set(4, 0.5, -3); previewScene.add(fillLight);

  const rotator = new THREE.Group();
  const content = new THREE.Group();
  const angled = new THREE.Group();
  let model;
  if (kind === "weapon") {
    model = buildGunIconModel(weapons[Number(id)].type, loadout3DRenderer);
    model.rotation.set(0.18, Math.PI + 0.45, 0);
    angled.rotation.z = -0.18;
  } else {
    model = makeUtilityModel(id, 1);
  }
  angled.add(model);
  content.add(angled);
  rotator.add(content);
  previewScene.add(rotator);
  previewScene.updateMatrixWorld(true);
  const bounds = new THREE.Box3().setFromObject(content);
  const center = bounds.getCenter(new THREE.Vector3());
  const size = bounds.getSize(new THREE.Vector3());
  const halfHeight = 1.05;
  const fitScale = Math.min(
    (2 * halfHeight * 2.6 * 0.84) / Math.max(size.x, 0.001),
    (2 * halfHeight * 0.78) / Math.max(size.y, 0.001),
    (2 * halfHeight * 0.78) / Math.max(size.z, 0.001)
  );
  const previewScale = fitScale * (kind === "weapon" ? 1.2 : 1);
  content.scale.setScalar(previewScale);
  content.position.set(-center.x * previewScale, -center.y * previewScale, -center.z * previewScale);

  const previewCamera = new THREE.OrthographicCamera(-2.6 * halfHeight, 2.6 * halfHeight, halfHeight, -halfHeight, 0.1, 100);
  previewCamera.position.set(0, 0, 10);
  previewCamera.lookAt(0, 0, 0);
  const state = { scene: previewScene, camera: previewCamera, rotator };
  loadout3DStates.set(key, state);
  return state;
}

function renderLoadout3D(now) {
  const page = document.getElementById("page-hotbar");
  const host = document.getElementById("loadoutSlots");
  if (!overlayEl || overlayEl.style.display === "none" || !page || !page.classList.contains("active") || !host) return;
  if (now - loadout3DLastDraw < 33) return; // cap previews at ~30 FPS; gameplay rendering is unaffected
  const hostRect = host.getBoundingClientRect();
  const width = Math.round(hostRect.width), height = Math.round(hostRect.height);
  if (width < 1 || height < 1) return;

  if (!loadout3DRenderer) {
    try {
      loadout3DRenderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: "low-power" });
      loadout3DRenderer.setPixelRatio(1);
      loadout3DRenderer.setClearColor(0x000000, 0);
      loadout3DRenderer.domElement.id = "loadout3DCanvas";
    } catch (e) { return; }
  }
  if (loadout3DRenderer.domElement.parentElement !== host) {
    const placeholder = host.querySelector("#loadout3DCanvas");
    if (placeholder) placeholder.replaceWith(loadout3DRenderer.domElement);
    else host.appendChild(loadout3DRenderer.domElement);
  }
  if (width !== loadout3DWidth || height !== loadout3DHeight) {
    loadout3DRenderer.setSize(width, height, false);
    loadout3DWidth = width; loadout3DHeight = height;
  }

  const dt = loadout3DLastTime ? clamp((now - loadout3DLastTime) / 1000, 0, 0.05) : 1 / 30;
  loadout3DLastTime = now;
  loadout3DLastDraw = now;
  loadout3DRenderer.setScissorTest(false);
  loadout3DRenderer.setClearColor(0x000000, 0);
  loadout3DRenderer.clear(true, true, true);
  loadout3DRenderer.setScissorTest(true);

  for (const element of host.querySelectorAll(".slotPreview")) {
    const kind = element.dataset.previewKind, id = element.dataset.previewId;
    if (!kind || !id) continue;
    const rect = element.getBoundingClientRect();
    const x = Math.round(rect.left - hostRect.left);
    const y = Math.round(rect.top - hostRect.top);
    const w = Math.round(rect.width), h = Math.round(rect.height);
    if (w < 1 || h < 1 || x + w <= 0 || y + h <= 0 || x >= width || y >= height) continue;
    const state = createLoadout3DState(kind, id);
    if (!loadoutMotionReduced) state.rotator.rotation.y += dt * 0.285;
    const bottom = height - y - h;
    loadout3DRenderer.setViewport(x, bottom, w, h);
    loadout3DRenderer.setScissor(x, bottom, w, h);
    const halfHeight = 1.05, aspect = w / h;
    state.camera.left = -halfHeight * aspect;
    state.camera.right = halfHeight * aspect;
    state.camera.top = halfHeight;
    state.camera.bottom = -halfHeight;
    state.camera.updateProjectionMatrix();
    loadout3DRenderer.render(state.scene, state.camera);
  }
  loadout3DRenderer.setScissorTest(false);
}

function getGunIcon(id) {
  if (gunIconCache[id]) return gunIconCache[id];

    const W = 264, H = 132;
    if (!gunIconRenderer) {
      gunIconRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      gunIconRenderer.setSize(W, H, false);
      gunIconRenderer.setPixelRatio(1);
    }
    const sc = new THREE.Scene();
    sc.add(new THREE.AmbientLight(0xffffff, 1.9));
    sc.add(new THREE.HemisphereLight(0xffffff, 0x99a3b0, 0.9));
    const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(-2, 4, 5); sc.add(dl);
    const dl2 = new THREE.DirectionalLight(0x7fd4ff, 0.5); dl2.position.set(4, -1, -3); sc.add(dl2);
    const model = buildGunIconModel(weapons[id].type, gunIconRenderer);
    model.rotation.set(0.25, Math.PI + 0.55, 0);   // barrel points left, angled so it reads as 3D
    const pivot = new THREE.Group();
    pivot.rotation.z = -0.3;                       // tilt the muzzle slightly upward
    pivot.add(model);
    sc.add(pivot);
    const bb = new THREE.Box3().setFromObject(pivot);
    const c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
    const half = Math.max(s.x / 2, (s.y / 2) * (W / H)) * 1.1;
    const cam = new THREE.OrthographicCamera(-half, half, half * H / W, -half * H / W, 0.1, 50);
    cam.position.set(c.x, c.y + 1, c.z + 10); cam.lookAt(c);

  return gunIconCache[id];
}

function crosshairHTML(s) {
  const c = s.color, o = s.outline ? "box-shadow:0 0 0 1px #000;" : "", op = `opacity:${s.opacity};`;
  const el = (x, y, w, h, rot, round) => `<div style="position:absolute;left:50%;top:50%;width:${w}px;height:${h}px;transform:translate(-50%,-50%) translate(${x}px,${y}px) rotate(${rot || 0}deg);background:${c};${o}${op}${round ? "border-radius:50%;" : ""}"></div>`;
  const len = Math.max(1, s.size - s.gap), off = s.gap + len / 2, t = s.thickness; let h = "";
  if (s.style === "cross" || s.style === "tshape") {
    if (s.style === "cross") h += el(0, -off, t, len);
    h += el(0, off, t, len) + el(-off, 0, len, t) + el(off, 0, len, t);
  } else if (s.style === "x") {
    const d = off / Math.SQRT2;
    for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) h += el(sx * d, sy * d, t, len, -45 * sx * sy);
  } else if (s.style === "circle") {
    const D = Math.max(8, Math.round(s.size * 1.2));
    h += `<div style="position:absolute;left:50%;top:50%;width:${D}px;height:${D}px;transform:translate(-50%,-50%);border:${t}px solid ${c};border-radius:50%;box-sizing:border-box;${o}${op}"></div>`;
  }
  if (s.style === "dot" || s.dot) h += el(0, 0, s.dotSize, s.dotSize, 0, true);
  return h;
}

function updatePlayerHealthBar() {
  const fill = document.getElementById("phpFill");
  if (!fill) return;
  const pct = Math.max(0, playerHP / PLAYER_MAX_HP * 100);
  fill.style.width = pct + "%";
  fill.style.background = pct > 55 ? "#2fbf62" : pct > 25 ? "#d9a93a" : "#d93a3a";
  const txt = document.getElementById("phpText");
  if (txt) txt.textContent = "HP " + Math.ceil(playerHP) + " / " + PLAYER_MAX_HP;
}

// Flashes the health bar white (restarts the animation if it is already playing)
function flashHealthBar() {
  const bg = document.querySelector("#playerHealthBar .bar-bg");
  if (!bg) return;
  bg.classList.remove("hit");
  void bg.offsetWidth;   // force reflow so the animation restarts
  bg.classList.add("hit");
}

// Blood on the edges of the screen when you are hit: a pre-drawn splattered vignette (centre stays clear) that fades over ~5 s
let bloodEl = null;
function buildBloodOverlay() {
  bloodEl = document.getElementById("bloodEdges"); if (!bloodEl) return;
  const W = 512, H = 288, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.save(); x.translate(W / 2, H / 2); x.scale(1, H / W);          // elliptical falloff that follows the screen shape; the centre stays clear
  const g = x.createRadialGradient(0, 0, W * 0.26, 0, 0, W * 0.70);
  g.addColorStop(0, "rgba(80,3,3,0)"); g.addColorStop(0.5, "rgba(80,3,3,0.5)"); g.addColorStop(1, "rgba(48,0,0,0.97)");
  x.fillStyle = g; x.fillRect(-W, -W, W * 2, W * 2); x.restore();
  bloodEl.style.backgroundImage = `url(${c.toDataURL("image/png")})`;
}
function showBloodEdges(amount) {
  if (!bloodEl) return;
  const cur = parseFloat(getComputedStyle(bloodEl).opacity) || 0;
  const missing = 1 - Math.max(0, playerHP) / PLAYER_MAX_HP;                       // 0 = full health, 1 = nearly dead
  const versus = !!window.__fpsVersusActive;
  const base = versus ? 0.82 : 0.55;
  const lvl = Math.min(1, Math.max(cur, base + Math.min(versus ? 0.18 : 0.25, (amount || 10) / (versus ? 65 : 90)) + missing * 0.4));
  bloodEl.style.transition = "none"; bloodEl.style.opacity = lvl.toFixed(2);
  void bloodEl.offsetWidth;
  bloodEl.style.transition = `opacity ${versus ? 3.8 : 5}s ease-out`; bloodEl.style.opacity = "0";
}
function clearBloodEdges() { if (bloodEl) { bloodEl.style.transition = "none"; bloodEl.style.opacity = "0"; } }

function takeDamage(amount) {
  if (!roundActive || settings.sandbox) return;   // sandbox: nothing hurts you
  playerHP = Math.max(0, playerHP - amount);
  lastDamageTime = gNow();
  updatePlayerHealthBar();
  flashHealthBar();

  showBloodEdges(amount);

  // getting hit shakes the view (it used to push your aim upward, which felt random)
  if (shakeT <= 0 || shakeAmp < 0.012) shakeAmp = 0.012;
  shakeT = SHAKE_DURATION;

  if (playerHP <= 0) endRun("died");
}

function updateSelfHeal(dt) {
  if (!roundActive || playerHP <= 0 || missionRun) return;       // missions: no regeneration, use medkits
  if (playerHP >= PLAYER_MAX_HP) return;
  if (gNow() - lastDamageTime < HEAL_DELAY * DIFF().healDelay) return;
  if (sprintActive()) return;   // no health regen while sprinting
  playerHP = Math.min(PLAYER_MAX_HP, playerHP + HEAL_RATE * DIFF().heal * dt);
  updatePlayerHealthBar();
}

    part(0.036, 0.024, 0.04, HAND_PLATE, -(r + 0.016), 0, -0.035, 0.4);
    part(0.026, 0.028, 0.05, HAND_GLOVE, -(r + 0.012), r * 0.3, -0.06, 0.55);
    part(0.018, 0.01, 0.022, HAND_PAD, -(r + 0.014), r * 0.3 + 0.016, -0.08, 0.55);
    // four fingers: lower segment up the far side, padded knuckle joint, short curled tip with a rubber pad
    for (let i = 0; i < 4; i++) {
      const z = -0.037 + i * 0.025;
      part(0.028, girth * 0.5, 0.021, HAND_GLOVE, r + 0.015, -r * 0.5, z);
      part(0.032, 0.02, 0.023, HAND_PLATE, r + 0.016, r * 0.05, z);
      part(0.024, 0.022, 0.021, HAND_GLOVE, r - 0.001, r + 0.012, z, 0, 0, 0.5);
      part(0.012, 0.012, 0.018, HAND_PAD, r - 0.012, r + 0.017, z, 0, 0, 0.5);
    }
    wrist = [0, -(r + 0.022), 0.05];
  } else {
    // fist around a grip: back of the hand toward the player, fingers wrapped across the front, thumb on the left
    part(0.085, 0.13, 0.035, HAND_GLOVE, 0, 0, r + 0.02);                                  // back of hand
    part(0.074, 0.075, 0.01, HAND_PLATE, -0.004, 0.02, r + 0.043);                          // hard back-of-hand shell
    part(0.058, 0.026, 0.012, HAND_PLATE, -0.004, -0.05, r + 0.04);                         // lower wrist guard plate
    for (const y of [0.04, 0.022, 0.004]) part(0.07, 0.004, 0.004, HAND_SEAM, -0.004, y, r + 0.049);   // grip ridges across the shell
    for (const x of [-0.045, 0.037]) part(0.003, 0.07, 0.003, HAND_SEAM, x, 0.02, r + 0.0485);         // stitched shell border
    for (const x of [-0.022, 0, 0.022]) part(0.004, 0.04, 0.003, HAND_SEAM, x, -0.07, r + 0.0385);    // tendon seams below the plate
    for (let i = 0; i < 4; i++) {
      const y = 0.048 - i * 0.03;
      const finger = new THREE.Group();
      finger.position.y = y;
      const fingerPart = (w, hh, d, mat, x, z, rx = 0, ry = 0, rz = 0) => {
        const mesh = new THREE.Mesh(roundedBoxGeo(w, hh, d), mat);
        mesh.position.set(x, 0, z);
        mesh.rotation.set(rx, ry, rz);
        finger.add(mesh);
      };
      fingerPart(0.019, 0.025, 0.026, HAND_PLATE, 0.047, r + 0.03);                         // knuckle guard bump
      fingerPart(0.022, 0.024, 0.065, HAND_GLOVE, 0.0535, r * 0.55);                        // finger: lower segment up the right side
      fingerPart(0.026, 0.023, 0.024, HAND_PLATE, 0.0535, -(r + 0.011));                    // padded middle joint at the corner
      fingerPart(0.05, 0.024, 0.021, HAND_GLOVE, 0.022, -(r + 0.011));                      // finger: middle segment across the front
      fingerPart(0.02, 0.021, 0.019, HAND_GLOVE, -0.012, -(r + 0.011), 0, 0.35, 0);         // finger: tip segment
      fingerPart(0.012, 0.017, 0.012, HAND_PAD, -0.026, -(r + 0.009), 0, 0.35, 0);         // rubber fingertip pad
      gripFingers.push(finger);
      h.add(finger);
    }
    // thumb on the left: base, padded joint, tip, pad
    part(0.028, 0.042, 0.06, HAND_GLOVE, -0.056, 0.05, 0.015, 0.1);
    part(0.032, 0.036, 0.022, HAND_PLATE, -0.057, 0.052, -0.017, 0.1);
    part(0.024, 0.032, 0.04, HAND_GLOVE, -0.056, 0.052, -0.045, 0.1);
    part(0.014, 0.012, 0.018, HAND_PAD, -0.059, 0.056, -0.066);
    wrist = [0, -0.05, r + 0.02];
  }

  const arm = new THREE.Group();
  h.add(arm);
  h.userData.wristLocal = new THREE.Vector3(wrist[0], wrist[1], wrist[2]);
  h.userData.isLeft = isLeft;
  h.userData.gripFingers = gripFingers;
  return h;
}

function attachHands(g, rightPos, rightTilt, rightGirth, leftPos, leftGirth) {
  const rh = makeHand(false, rightGirth), lh = makeHand(true, leftGirth);
  rh.position.set(rightPos[0], rightPos[1], rightPos[2]); rh.rotation.x = rightTilt;
  lh.position.set(leftPos[0], leftPos[1], leftPos[2]); lh.rotation.z = -Math.PI / 2; g.userData.leftBaseRz = -Math.PI / 2;   // palm on the left side of the gun, thumb on top

// ---- reload keyframes ----
// A pose is 15 numbers, all offsets from the gun's normal position (0 = at rest):
//   gun x,y,z, gun pitch, gun roll | left hand x,y,z, pitch | right hand x,y,z, pitch | item, aux
// item = how far the magazine is pulled out (rifle/AWP) or 1 while the right hand carries a shell (shotgun)
// aux  = bolt pulled back (AWP) or pump pulled back (shotgun), 0..1
const RP = { GX: 0, GY: 1, GZ: 2, GRX: 3, GRZ: 4, LX: 5, LY: 6, LZ: 7, LRX: 8, RX: 9, RY: 10, RZ: 11, RRX: 12, ITEM: 13, AUX: 14, CW: 15, CX: 16, CY: 17, CZ: 18, LRZ: 19, AL: 20 };
const K = (t, o = {}) => [t, o.gx || 0, o.gy || 0, o.gz || 0, o.grx || 0, o.grz || 0,
                             o.lx || 0, o.ly || 0, o.lz || 0, o.lrx || 0,
                             o.rx || 0, o.ry || 0, o.rz || 0, o.rrx || 0, o.item || 0, o.aux || 0,
                             o.cw || 0, o.cx || 0, o.cy || 0, o.cz || 0, o.lrz || 0, o.al || 0];

function sampleKeys(keys, p) {
  if (p <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) {
    if (p <= keys[i][0]) {
      const a = keys[i - 1], b = keys[i];
      let u = (p - a[0]) / (b[0] - a[0]);
      u = u * u * (3 - 2 * u);                       // ease in/out between keys
      return a.slice(1).map((v, j) => v + (b[j + 1] - v) * u);
    }
  }
  return keys[keys.length - 1].slice(1);
}

const RELOAD_BEEP = { out: [140, 0.03, "square", 0.03], in: [230, 0.03, "square", 0.03], click: [300, 0.02, "square", 0.03] };

// M4A1: tip the gun, left hand pulls the mag, fetches a new one from the pouch, seats it, taps the bolt release
function buildRifleReload() {
  const T = RELOAD_TILT;
  const LM = { lx: 0, ly: -0.115, lz: 0.36, lrx: 0.25 };                       // left hand around the mag
  const pull = (d) => ({ ...LM, ly: LM.ly - 0.98 * d, lz: LM.lz + 0.2 * d, item: d });   // mag slides out along its own axis
  const easeOut = { gx: T.gx * 0.3, gy: T.gy * 0.3, grz: T.grz * 0.3, grx: T.grx * 0.3 };
  return {
    keys: [
      K(0),
      K(0.14, { ...T, ...LM }),
      K(0.20, { ...T, ...LM }),
      K(0.32, { ...T, ...pull(0.28) }),
      K(0.42, { ...T, lx: -0.30, ly: -0.36, lz: 0.42, lrx: 0.4, item: 0.3 }),
      K(0.52, { ...T, ...pull(0.28) }),
      K(0.60, { ...T, ...LM }),
      K(0.64, { ...T, ...LM, gz: T.gz + 0.03 }),
      K(0.72, { ...T, ...LM, ly: -0.08, lz: 0.24 }),
      K(0.88, { ...easeOut, ly: -0.03, lz: 0.1 }),
      K(1.0)
    ],
    events: [[0.32, ...RELOAD_BEEP.out], [0.34, 155.5], [0.60, ...RELOAD_BEEP.in], [0.72, ...RELOAD_BEEP.click]],
    magHide: [0.34, 0.54]
  };
}

// M4A1 / MP5: the gun rolls a little onto its side, the left hand pulls the empty mag out and drops out of the bottom of the screen,
// then comes back up from below holding a fresh mag, slides it into the well and it seats with a metallic clack.
function buildMagReload() {
  const Tc = { gx: 0.30, gy: 0.03, gz: -0.06, grx: 0.16, grz: -0.85 };      // gentle roll to the side (less than before)
  const sc = (k) => ({ gx: Tc.gx * k, gy: Tc.gy * k, gz: Tc.gz * k, grx: Tc.grx * k, grz: Tc.grz * k });
  const LM = { lx: 0, ly: -0.115, lz: 0.36 };                               // left hand around the mag
  const pull = (d, o = {}) => ({ lx: 0, ly: LM.ly - 0.98 * d, lz: LM.lz + 0.2 * d, item: d, al: 1, ...o });
  const cam = (x, y, z, o = {}) => ({ cw: 1, cx: x, cy: y, cz: z, ...o });  // hand position in screen space (y below about -0.4 is off the bottom edge)
  return {
    keys: (() => { const T = 0.84, body = [
      K(0),
      K(0.09, { ...sc(0.55), lz: 0.05 }),                                                           // gun starts to roll
      K(0.18, { ...Tc, lx: 0, ly: -0.06, lz: 0.22, lrx: 0.15 }),                                    // hand slides down from the handguard
      K(0.24, { ...Tc, ...LM, lrx: 0.25 }),                                                         // fingers wrap the mag
      K(0.27, { ...Tc, ...LM, lrx: 0.25, gz: Tc.gz + 0.012 }),                                      // thumb on the release
      K(0.35, { ...Tc, ...pull(0.24, { lrx: 0.25 }) }),                                             // empty mag pulled out of the well
      K(0.44, { ...Tc, ...pull(0.24, { lrx: 0.3 }), ...cam(0, -0.40, 0) }),                         // hand heads straight down the screen with it
      K(0.51, { ...Tc, ...cam(0, -1.10, 0, { lrx: 0.3, al: 1 }) }),                                 // gone off the bottom edge
      K(0.55, { ...Tc, ...cam(0, -1.15, 0, { lrx: 0.4, al: 0 }) }),                                 // (mags swapped out of sight)
      K(0.60, { ...Tc, ...cam(0, -1.15, 0, { lrx: 0.4, al: 0 }) }),
      K(0.65, { ...Tc, ...cam(0, -0.60, 0, { lrx: 0.3, al: 0.8 }) }),                               // reappears from the bottom with the fresh mag
      K(0.71, { ...Tc, ...cam(0, -0.17, 0.02, { lrx: 0.3, al: 0.9 }) }),                            // held up in plain view
      K(0.76, { ...Tc, ...pull(0.30, { lrx: 0.25 }) }),                                             // lined up under the well
      K(0.81, { ...Tc, ...pull(0.08, { lrx: 0.2 }) }),                                              // sliding in
      K(0.84, { ...Tc, gz: Tc.gz + 0.02, ...pull(0.0, { lrx: 0.2 }) }),                             // seated: clack
      K(0.89, { ...Tc, ...pull(0.0, { ly: LM.ly + 0.02, lrx: 0.2 }) }),                             // palm tap
    ];
      const tail = [
        K(0.82, { ...sc(0.85), lx: 0, ly: -0.07, lz: 0.26, lrx: 0.2 }),                          // hand lets go of the mag, gun starts to straighten
        K(0.89, { ...sc(0.45), lx: 0, ly: -0.035, lz: 0.12, lrx: 0.12 }),                         // hand glides back up to the handguard
        K(0.95, { ...sc(0.14), lx: 0, ly: -0.008, lz: 0.03 }),                                    // nearly settled
        K(1.0)
      ];
      return [...body.map(k => { const c = k.slice(); c[0] = +(c[0] * T).toFixed(4); return c; }), ...tail]; })(),
    events: [[0.27, 150], [0.33, 140], [0.44, 155.5], [0.55, 160], [0.84, 235], [0.89, 245]].map(e => [+(e[0] * 0.84).toFixed(4), e[1]]),   // 155.5 = the empty magazine drops to the floor
    anchor: true, yawK: 1,
    spare: [0.50, 0.7056], magHide: [0.371, 0.7056]
  };
}

// AWP: same mag swap, then the right hand lets go of the grip and cycles the bolt
function buildSniperReload() {
  const T = RELOAD_TILT;
  const T2 = { gx: T.gx * 0.5, gy: T.gy * 0.5, gz: T.gz * 0.5, grx: T.grx * 0.5, grz: T.grz * 0.5 };
  const LM = { lx: 0, ly: -0.115, lz: 0.26, lrx: 0.2 };
  const pull = (d) => ({ ...LM, ly: LM.ly - d, item: d });
  const BH = { rx: 0.155, ry: 0.13, rz: -0.04 };                               // right hand on the bolt handle
  return {
    keys: [
      K(0),
      K(0.10, { ...T }),
      K(0.18, { ...T, ...LM }),
      K(0.30, { ...T, ...pull(0.24) }),
      K(0.40, { ...T, lx: -0.30, ly: -0.34, lz: 0.40, lrx: 0.4, item: 0.26 }),
      K(0.50, { ...T, ...pull(0.24) }),
      K(0.58, { ...T, ...LM }),
      K(0.62, { ...T, ...LM, gz: T.gz + 0.03 }),
      K(0.70, { ...T2 }),
      K(0.76, { ...T2, ...BH }),
      K(0.80, { ...T2, ...BH }),
      K(0.88, { ...T2, ...BH, rz: BH.rz + 0.12, aux: 1 }),
      K(0.93, { ...T2, ...BH, aux: 0 }),
      K(0.97, { ...T2 }),
      K(1.0)
    ],
    events: [[0.30, ...RELOAD_BEEP.out], [0.32, 155.5], [0.58, ...RELOAD_BEEP.in], [0.88, 280, 0.03, "square", 0.04], [0.93, 200, 0.03, "square", 0.04]],
    magHide: [0.32, 0.52]
  };
}

// Mossberg: left hand stays on the pump, right hand feeds shells in from the pouch one at a time, then racks the pump
function buildShotgunReload(shells) {
  const T = RELOAD_TILT;
  const n = Math.max(1, Math.min(5, shells));     // capped so each shell stays readable
  const L = 0.70 / n, s = 0.10;
  const PORT  = { rx: 0.04, ry: 0.04, rz: -0.10, rrx: 0.2 };
  const POUCH = { rx: 0.24, ry: -0.24, rz: 0.14, rrx: -0.2 };
  const keys = [K(0), K(s, { ...T })], events = [];
  for (let i = 0; i < n; i++) {
    const t0 = s + i * L;
    if (i > 0) keys.push(K(t0, { ...T, ...PORT, ry: 0, rz: -0.08 }));
    keys.push(K(t0 + 0.35 * L, { ...T, ...POUCH }));
    keys.push(K(t0 + 0.42 * L, { ...T, ...POUCH, item: 1 }));
    keys.push(K(t0 + 0.80 * L, { ...T, ...PORT, item: 1 }));
    keys.push(K(t0 + 0.86 * L, { ...T, ...PORT }));
    events.push([t0 + 0.84 * L, 250 + (i % 2) * 25, 0.015, "square", 0.025]);
  }
  keys.push(K(0.84, { ...T }));
  keys.push(K(0.89, { ...T, aux: 1 }));
  keys.push(K(0.95, { gx: T.gx * 0.2, gy: T.gy * 0.2, grz: T.grz * 0.2, grx: T.grx * 0.2 }));
  keys.push(K(1.0));
  events.push([0.89, 180, 0.04, "square", 0.04], [0.95, 240, 0.03, "square", 0.04]);
  return { keys, events };
}

// state for the reload animation currently playing
let reloadModel = null, reloadKeys = null, reloadEvents = [], reloadSpare = null, reloadMagHide = null, reloadAnchor = false;
const _reloadA = new THREE.Vector3();
const fallMags = [];
const _reloadTmp = new THREE.Vector3(), _reloadInv = new THREE.Matrix4(), _reloadInv2 = new THREE.Matrix4(), _reloadHold = new THREE.Vector3(), _reloadLM = new THREE.Vector3(0, -0.115, 0.36);
function spawnFallingMag(model) {                      // the spent magazine drops out of the gun and falls to the floor
  const u = model.userData; if (!u.mag) return;
  u.mag.updateWorldMatrix(true, false);
  const m = u.mag.clone(true);
  m.traverse(o => { o.layers.set(0); o.raycast = () => {}; o.visible = true; });
  u.mag.matrixWorld.decompose(m.position, m.quaternion, m.scale);
  const e = camera.matrixWorld.elements;
  const right = new THREE.Vector3(e[0], e[1], e[2]).normalize(), fwd = new THREE.Vector3(-e[8], -e[9], -e[10]).normalize();
  m.userData = { vel: right.multiplyScalar(-0.9 + Math.random() * 0.4).addScaledVector(fwd, 0.3).add(new THREE.Vector3(0, -0.6, 0)), spin: new THREE.Vector3(3 + Math.random() * 3, Math.random() * 2, 2 + Math.random() * 3), rest: false, life: 8, landed: false };
  scene.add(m); fallMags.push(m);
  if (fallMags.length > 4) scene.remove(fallMags.shift());
}
function updateFallingMags(dt) {
  const floorY = camera.position.y - curEye + 0.05;
  for (let i = fallMags.length - 1; i >= 0; i--) {
    const m = fallMags[i], u = m.userData;
    u.life -= dt; if (u.life <= 0) { scene.remove(m); fallMags.splice(i, 1); continue; }
    if (u.rest) continue;
    u.vel.y -= 9.8 * dt; m.position.addScaledVector(u.vel, dt);
    m.rotation.x += u.spin.x * dt; m.rotation.y += u.spin.y * dt; m.rotation.z += u.spin.z * dt;
    if (m.position.y < floorY) {
      m.position.y = floorY;
      if (!u.landed) { u.landed = true; GunSFX.reloadEvent(156); }
      if (Math.abs(u.vel.y) < 1.2) { u.rest = true; m.rotation.x = Math.PI / 2; m.rotation.z = Math.random() * 6; }
      else { u.vel.y *= -0.3; u.vel.x *= 0.5; u.vel.z *= 0.5; u.spin.multiplyScalar(0.5); }
    }
  }
}
let reloadDur = 1, reloadLastP = 0, reloadFade = 0, reloadGunX = 0, reloadYawK = 0;

function beginReloadAnimation(w, mag) {
  resetReloadParts(reloadModel);
  let r;
  if (w.type === "shotgun") { r = buildShotgunReload(w.magSize - mag); reloadModel = shotgunModel; }
  else if (w.type === "sniper") { r = buildSniperReload(); reloadModel = awpModel; }
  else if (w.type === "rifle" || w.type === "smg") { r = buildMagReload(); reloadModel = weaponModels[curWeaponNum]; }
  else { r = buildRifleReload(); reloadModel = weaponModels[curWeaponNum]; }
  reloadKeys = r.keys; reloadEvents = r.events; reloadSpare = r.spare || null; reloadMagHide = r.magHide || null; reloadAnchor = !!r.anchor; reloadYawK = r.yawK || 0;
  reloadDur = w.reloadMs; reloadLastP = 0; reloadFade = 1;
}

function resetReloadParts(model) {
  const u = model && model.userData;
  if (!u) return;
  if (u.mag) { u.mag.position.copy(u.magRest); u.mag.visible = true; }
  if (u.spare) u.spare.visible = false;
  if (u.rightHand && u.rightHand.userData.shell) u.rightHand.userData.shell.visible = false;
}

// Runs every frame after the bolt/pump animations. Keeps hands attached to their gun and plays the reload on top.
function applyReloadAnimation(dt) {
  reloadGunX = 0;
  let v = null, p = reloadLastP;
  const model = reloadModel;
  if (model && reloadKeys) {
    if (reloading) {
      p = Math.min(1, Math.max(0, 1 - (reloadEnd - gNow()) / reloadDur));
      for (const ev of reloadEvents) if (reloadLastP < ev[0] && p >= ev[0]) { if (ev[1] === 155.5) spawnFallingMag(model); else GunSFX.reloadEvent(ev[1]); }
      reloadLastP = p;
      reloadFade = 1;
    } else if (gNow() >= reloadEnd) {
      reloadFade = 0;                    // finished normally: the pose is already back at rest
    } else {
      reloadFade -= dt * 10;             // cancelled (weapon swap / new round): ease back to rest
    }
    if (reloadFade > 0.001) {
      v = sampleKeys(reloadKeys, p).map(x => x * reloadFade);
      reloadGunX = v[RP.GX];
      const _sm = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
      const envP = reloadFade * _sm(p / 0.12) * (1 - _sm((p - 0.78) / 0.22));   // the held-out offset eases in at the start and fully eases out by the last frame, so nothing snaps back
      weaponGroup.position.z -= 0.24 * envP; weaponGroup.position.x -= 0.05 * envP; weaponGroup.position.y += 0.04 * envP;   // held further out so the gun and the hands stay in view
      weaponGroup.position.x += v[RP.GX];
      if (reloadYawK) { const yk = Math.min(1, Math.abs(v[RP.GRZ]) / 0.85); weaponGroup.rotation.y += 0.16 * yk; weaponGroup.position.x += 0.10 * yk; reloadGunX += 0.10 * yk; }   // muzzle swings left, whole gun shifts right
      weaponGroup.position.y += v[RP.GY];
      weaponGroup.position.z += v[RP.GZ];
      weaponGroup.rotation.x += v[RP.GRX];
      weaponGroup.rotation.z += v[RP.GRZ];
      const u = model.userData;
      if (u.mag) {
        u.mag.position.copy(u.magRest).addScaledVector(u.magAxis, v[RP.ITEM]);
        const mh = reloadMagHide || u.magHide; u.mag.visible = !(p > mh[0] && p < mh[1]);
      }
      if (u.bolt) {
        u.bolt.position.z = -0.5 + v[RP.AUX] * 0.12;
        u.bolt.position.y = -0.18 + Math.min(1, v[RP.AUX] * 6) * 0.035;
      }
      if (u.pump) u.pump.position.z = -0.85 + v[RP.AUX] * 0.14;
      if (u.rightHand.userData.shell) u.rightHand.userData.shell.visible = v[RP.ITEM] > 0.5;
    } else {
      resetReloadParts(model);
      reloadModel = null; reloadKeys = null; reloadFade = 0;
    }
  }

  // hands sit on their gun (the shotgun's left hand rides the pump as it cycles)
  for (const m of Object.values(weaponModels)) {
    const u = m && m.userData;
    if (!u || !u.leftHand) continue;
    u.leftHand.visible = !((throwState && m === weaponModels[curWeaponNum] && throwGunLower() > 0.3) || (m === weaponModels[curWeaponNum] && ladderBlend > 0.5));   // the support hand lets go while the left hand throws
    u.leftHand.position.copy(u.leftRest);
    u.leftHand.rotation.x = 0; u.leftHand.rotation.z = u.leftBaseRz || 0;
    u.rightHand.position.copy(u.rightRest);
    u.rightHand.rotation.x = u.rightTilt;
    if (u.pump) u.leftHand.position.z += u.pump.position.z + 0.85;
  }
  if (v) {

  const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.078, 0.38, 18), HAND_SLEEVE);
