// Gives a knife-hand arm a fixed elbow point (so it swings like a real arm instead of rotating rigidly with the
// hand) and a long sleeve extension so the cut-off end never shows on screen.
function prepareKnifeArm(arm, dir1, dir2, restWrist, elbowShift) {
  arm.userData.baseQ = arm.quaternion.clone();
  arm.userData.restPos = restWrist.clone();
}

function makeKnifeFistHand() {
  const outer = new THREE.Group();
  const fist = makeHand(false, 0.105);                 // 0.105 = knife handle thickness
  const arm = fist.children[fist.children.length - 1]; // makeHand adds the arm last
  fist.remove(arm);
  fist.quaternion.copy(KNIFE_FIST_BASE_Q);
  const r = 0.105 / 2;
  // wrist point of the fist, expressed after the fist is turned onto the handle
  const wrist = new THREE.Vector3(0, -0.05, r + 0.02).applyQuaternion(KNIFE_FIST_BASE_Q);
  outer.add(fist);
  outer.userData.fist = fist;
  outer.userData.arm = arm;
  outer.userData.wrist = wrist;
  outer.userData.gripFingers = fist.userData.gripFingers;
  prepareKnifeArm(arm, new THREE.Vector3(0.10, -0.35, 1), new THREE.Vector3(0.45, -0.5, 1),
    KNIFE_PIVOT_REST.clone().add(wrist), new THREE.Vector3(0, 0, 0));
  return outer;
}

function makeKnifeLeftHand() {
  const hand = makeHand(true, 0.105);
  const arm = hand.children[hand.children.length - 1];
  hand.remove(arm);
  const wrist = new THREE.Vector3(0, -(0.105 / 2 + 0.022), 0.05);
  hand.userData.arm = arm;
  hand.userData.wrist = wrist;
  const restHand = KNIFE_PIVOT_REST.clone().add(KNIFE_LEFT_GRIP);
  prepareKnifeArm(arm, new THREE.Vector3(-0.15, -0.3, 1), new THREE.Vector3(-0.7, -0.5, 1),
    restHand.clone().add(wrist), new THREE.Vector3(-0.35, 0, 0));
  return hand;
}

function makeKnife() {
  const g = new THREE.Group();
  // satin-polished blade: reflective, but not a mirror
  const kEnv = getShinyEnv();
  const steel = new THREE.MeshPhysicalMaterial({
    color: 0xdde3e8, roughness: kEnv ? 0.22 : 0.3, metalness: kEnv ? 0.92 : 0.75,
    clearcoat: 0.15, clearcoatRoughness: 0.2, envMap: kEnv, envMapIntensity: 0.95
  });
  const fullerMat = new THREE.MeshStandardMaterial({ color: 0x8b969f, roughness: 0.4, metalness: kEnv ? 0.9 : 0.55, envMap: kEnv, envMapIntensity: 0.6 });
  const gripMat = new THREE.MeshStandardMaterial({ color: 0x20242a, roughness: 0.88, metalness: 0.04 });
  const gripDetail = new THREE.MeshStandardMaterial({ color: 0x343a41, roughness: 0.82, metalness: 0.08 });
  const spinPivot = new THREE.Group();
  spinPivot.position.set(0.14, -0.16, -0.245);
  const knifeBody = new THREE.Group();
  knifeBody.position.set(-0.14, 0.16, 0.245);
  spinPivot.add(knifeBody);
  g.add(spinPivot);
  knifeSpinPivot = spinPivot;

  // Tapered, pointed blade with a beveled profile and a visible central fuller.
  const bladeShape = new THREE.Shape();
  bladeShape.moveTo(-0.032, 0);
  bladeShape.lineTo(0.032, 0);
  bladeShape.lineTo(0.034, 0.30);
  bladeShape.lineTo(0.026, 0.47);
  bladeShape.lineTo(0.005, 0.59);
  bladeShape.lineTo(-0.032, 0.48);
  bladeShape.lineTo(-0.036, 0.12);
  bladeShape.closePath();
  const bladeGeometry = new THREE.ExtrudeGeometry(bladeShape, {
    steps: 1, depth: 0.02, bevelEnabled: true, bevelSegments: 2,
    bevelSize: 0.004, bevelThickness: 0.003
  });
  const blade = new THREE.Mesh(bladeGeometry, steel);
  blade.rotation.x = -Math.PI / 2;
  blade.position.set(0.14, -0.16, -0.40); knifeBody.add(blade);
  const fuller = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.003, 0.25), fullerMat);
  fuller.position.set(0.14, -0.139, -0.63); knifeBody.add(fuller);

  // Crossguard, contoured grip, grip texture, and a solid pommel make the knife silhouette distinct.
  const guard = new THREE.Mesh(new THREE.BoxGeometry(0.23, 0.04, 0.065), steel);
  guard.position.set(0.14, -0.16, -0.39); guard.rotation.z = 0.06; knifeBody.add(guard);
  const handle = new THREE.Mesh(new THREE.BoxGeometry(0.105, 0.105, 0.27), gripMat);
  handle.position.set(0.14, -0.16, -0.245); knifeBody.add(handle);
  for (let i = 0; i < 5; i++) {
    const groove = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.007, 0.004), gripDetail);
    groove.position.set(0.14, -0.115 - i * 0.022, -0.106); knifeBody.add(groove);
  }
  const pommel = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.052, 0.045, 12), steel);
  pommel.rotation.x = Math.PI / 2; pommel.position.set(0.14, -0.16, -0.09); knifeBody.add(pommel);
  // Right fist wraps the handle (grip axis turned from vertical to along the blade); the arm trails behind it.
  knifeRightHand = makeKnifeFistHand();
  knifeRightHand.position.copy(KNIFE_PIVOT_REST);
  knifeRightHand.userData.restPosition = knifeRightHand.position.clone();
  g.add(knifeRightHand);
  g.add(knifeRightHand.userData.arm);

  // Left hand: C-clamps the rear of the handle from underneath during the two-handed attack.
  knifeSupportHand = makeKnifeLeftHand();
  knifeSupportHand.position.copy(KNIFE_PIVOT_REST).add(KNIFE_LEFT_GRIP);
  knifeSupportHand.userData.restPosition = knifeSupportHand.position.clone();
  knifeSupportHand.visible = false;
  knifeSupportHand.userData.arm.visible = false;
  g.add(knifeSupportHand);
  g.add(knifeSupportHand.userData.arm);
  return g;
}

function setupWeaponModels() {
  scopePreviewTarget = new THREE.WebGLRenderTarget(settings.scopePreviewSize * 2, settings.scopePreviewSize * 2, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat, depthBuffer: true
  });
  scopePreviewCamera = new THREE.PerspectiveCamera(SCOPE_FOV, 1, camera.near, camera.far);

  weaponGroup = new THREE.Group();
  camera.add(weaponGroup);
  scene.add(camera);

  awpModel = makeAWP();
  m4Model = makeM4();
  shotgunModel = makeShotgun();
  pistolModel = makeGlock();
  smgModel = makeMP5();
  knifeModel = makeKnife();
  weaponModels = { 1: awpModel, 2: m4Model, 3: shotgunModel, 4: pistolModel, 5: smgModel, 6: knifeModel };
  for (const gm of [awpModel, m4Model, shotgunModel, pistolModel, smgModel]) { try { wearGun(gm); } catch (e) {} }

  weaponGroup.position.set(0.35, -0.25, -0.35);
  for (const model of Object.values(weaponModels)) weaponGroup.add(model);

  muzzleFlash = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeMuzzleFlashTexture(), color: 0xffffff, transparent: true, opacity: 0,
    depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  muzzleFlash.scale.set(0.6, 0.6, 0.6);
  muzzleFlash.position.set(0.14, -0.18, -1.5);
  muzzleFlash.raycast = () => {};
  weaponGroup.add(muzzleFlash);

  muzzleLight = new THREE.PointLight(0xffb060, 0, 5);
  muzzleLight.position.copy(muzzleFlash.position);
  weaponGroup.add(muzzleLight);
  muzzleCones = [[0.07, 0.6, 0xff8a2a, 0.5], [0.032, 0.42, 0xfff2c8, 0.85]].map(([r, h, col, op]) => {
    const cg = new THREE.ConeGeometry(r, h, 10, 1, true); cg.rotateX(-Math.PI / 2); cg.translate(0, 0, -h / 2);
    const cn = new THREE.Mesh(cg, new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
    cn.userData.op = op; cn.raycast = () => {}; cn.renderOrder = 3; weaponGroup.add(cn); return cn;
  });
  applySights();
}

function renderScopePreview() {
  if (!scopePreviewTarget || !scopePreviewCamera || !weaponGroup || !weaponGroup.visible ||
      curWeaponNum !== 1 || grenadeEquipped || scopeBlend <= 0.001 || scopeViewBlend >= 0.12) return;

  scopePreviewCamera.position.copy(camera.position);
  scopePreviewCamera.quaternion.copy(camera.quaternion);
  scopePreviewCamera.near = camera.near;
  scopePreviewCamera.far = camera.far;
  scopePreviewCamera.fov = scopeViewFov();   // same magnification as the rest of the screen
  scopePreviewCamera.aspect = 1;
  scopePreviewCamera.updateProjectionMatrix();

  const previousTarget = renderer.getRenderTarget();
  const wasVisible = weaponGroup.visible;
  weaponGroup.visible = false;  // render the world only, not the lens preview itself
  try {
    renderer.setRenderTarget(scopePreviewTarget);
    renderer.render(scene, scopePreviewCamera);
  } finally {
    renderer.setRenderTarget(previousTarget);
    weaponGroup.visible = wasVisible;
  }
}

function updateWeaponModelVisibility() {
  for (const model of Object.values(weaponModels)) model.visible = false;
  const selectedModel = weaponModels[curWeaponNum];
  if (selectedModel && !grenadeEquipped) selectedModel.visible = true;
  if (grenadeView && !throwState) {
    grenadeView.group.visible = grenadeEquipped && grenades > 0;
    grenadeView.nade.visible = grenades > 0;
    if (grenadeEquipped && grenades > 0) setGrenadeHoldPose();
  }
  if (grenadeEquipped) {
    weaponTextEl.textContent = `${UTILITY_TYPES[utilityType].name} ×${grenades}`;
  } else {
    const w = weapons[curWeaponNum];
    const mode = w.type === "melee" ? " (Melee)" : w.type === "shotgun" ? " (Pump)" : w.auto ? " (Auto)" : " (Semi)";
    weaponTextEl.textContent = w.name + mode;
  }
  updateHotbarHud();
}

const texCache = {}, matCache = {};
function canvasTex(key, draw, size = 256) {
  if (texCache[key]) return texCache[key];
  const c = document.createElement("canvas");
  c.width = c.height = size * 2;
  const cg = c.getContext("2d");
  cg.scale(2, 2);
  draw(cg, size);
  if (!/^sky_/.test(key)) {                                   // soften: blend in a blurred copy so no single brick, plank or speck grabs the eye
    const sm = document.createElement("canvas"); sm.width = sm.height = size >> 2;
    const sg = sm.getContext("2d"); sg.imageSmoothingEnabled = true; sg.drawImage(c, 0, 0, size >> 2, size >> 2);
    cg.globalAlpha = 0.4; cg.imageSmoothingEnabled = true; cg.drawImage(sm, 0, 0, size, size); cg.globalAlpha = 1;
    cg.globalCompositeOperation = "saturation"; cg.globalAlpha = 0.1; cg.fillStyle = "hsl(0,0%,50%)"; cg.fillRect(0, 0, size, size);        // mute the cartoon colours
    cg.globalCompositeOperation = "multiply"; cg.globalAlpha = 1; cg.fillStyle = "#e8e8e8"; cg.fillRect(0, 0, size, size);                  // and darken them
    cg.globalCompositeOperation = "source-over";
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 16;
  return (texCache[key] = t);
}
function dots(g, s, n, colors, maxSize) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = colors[(Math.random() * colors.length) | 0];
    const z = 1 + Math.random() * maxSize;
    g.fillRect(Math.random() * s, Math.random() * s, z, z);
  }
}
function blobs(g, s, n, rgb, maxR, alpha) {
  for (let i = 0; i < n; i++) {
    const r = 20 + Math.random() * maxR, x = r + Math.random() * (s - 2 * r), y = r + Math.random() * (s - 2 * r);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${rgb},${alpha})`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}

        g.fillRect(c * 32 + 1, r * 32 + 1, 30, 30);
      }
      dots(g, s, 3000, ["rgba(0,0,0,0.10)", "rgba(255,255,255,0.08)"], 2);
    } else {   // concrete slabs
      g.fillStyle = "#7d7f82"; g.fillRect(0, 0, s, s);
      dots(g, s, 7000, ["rgba(0,0,0,0.08)", "rgba(255,255,255,0.08)"], 2);

function boxMaterial(kind, tint) {
  const key = kind + (tint || "");
  if (!matCache[key]) {
    matCache[key] = new THREE.MeshStandardMaterial({
      map: boxTexture(kind, tint),
      roughness: (kind === "metal" || kind === "container" || kind === "deck") ? 0.55 : 0.9,
      metalness: (kind === "metal" || kind === "deck") ? 0.4 : kind === "container" ? 0.25 : 0
    });
  }

// Scale each face's UVs by its real size so textures keep the same scale on big walls and small crates
function scaleBoxUV(geo, w, h, d, tile) {
  const uv = geo.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];   // +x, -x, +y, -y, +z, -z
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
    const i = f * 4 + k;
    uv.setXY(i, uv.getX(i) * dims[f][0] / tile, uv.getY(i) * dims[f][1] / tile);
  }
  uv.needsUpdate = true;
}

function pickKind(w, d) {
  const list = MAP_STYLE[envMap] || ["concrete"];
  const k = list[Math.floor(Math.random() * list.length)];
  return (k === "container" && Math.max(w, d) < 6) ? "crate" : k;   // small cover is crates, only big boxes are containers
}

// Roof, steel beams and ceiling lamps for indoor maps
function buildIndoorShell() {
  const b = currentBounds, len = b.zMax - b.zMin, cz = (b.zMin + b.zMax) / 2, H = b.h || 10;
  const add = (m) => { scene.add(m); envObjects.push(m); return m; };
  const rt = boxTexture("metal").clone();
  rt.needsUpdate = true; rt.repeat.set(2 * b.x / 3, len / 3);
  const roof = add(new THREE.Mesh(new THREE.PlaneGeometry(2 * b.x, len), new THREE.MeshStandardMaterial({ map: rt, color: 0xb8b8b8, roughness: 0.8 })));
  roof.rotation.x = Math.PI / 2; roof.position.set(0, H, cz);
  const beamMat = new THREE.MeshStandardMaterial({ color: 0x2a2e35, roughness: 0.6, metalness: 0.4 });
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xfff6dc, fog: false });
  for (let z = b.zMin + 6; z < b.zMax; z += 12) {
    const beam = add(new THREE.Mesh(new THREE.BoxGeometry(2 * b.x, 0.6, 0.5), beamMat));
    beam.position.set(0, H - 0.3, z);

// Falling snow / drifting dust around the camera (mission maps only)
let fxPoints = null, fxKind = null, fxLocal = null;
function setAmbientFx(kind) {
  if (fxKind === kind && (fxPoints || !kind)) { if (fxPoints) fxPoints.visible = !!kind; return; }
  if (fxPoints) { scene.remove(fxPoints); fxPoints.geometry.dispose(); fxPoints.material.dispose(); fxPoints = null; }
  fxKind = kind;
  if (!kind) return;
  const n = kind === "snow" ? 1500 : 650, R = 34;
  fxLocal = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { fxLocal[i * 3] = (Math.random() * 2 - 1) * R; fxLocal[i * 3 + 1] = Math.random() * 22 - 4; fxLocal[i * 3 + 2] = (Math.random() * 2 - 1) * R; }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  fxPoints = new THREE.Points(geo, new THREE.PointsMaterial({
    color: kind === "snow" ? 0xffffff : 0xe3c98f, size: kind === "snow" ? 2.4 : 1.7, sizeAttenuation: false,
    transparent: true, opacity: kind === "snow" ? 0.85 : 0.4, depthWrite: false, fog: false
  }));
  fxPoints.frustumCulled = false;
  scene.add(fxPoints);
}
function updateAmbientFx(dt) {
  if (!fxPoints || !fxPoints.visible || !camera) return;
  const pos = fxPoints.geometry.attributes.position.array, n = fxLocal.length / 3, R = 34;
  const fall = fxKind === "snow" ? 2.6 : 0.2, wind = fxKind === "snow" ? 2.2 : 6.5, t = gameTime / 1000;
  for (let i = 0; i < n; i++) {
    const k = i * 3;
    fxLocal[k] += (wind + Math.sin(t * 0.7 + i) * 0.8) * dt;
    fxLocal[k + 1] -= (fall + (i % 5) * 0.25) * dt;
    fxLocal[k + 2] += Math.cos(t * 0.5 + i * 0.3) * 0.6 * dt;
    if (fxLocal[k] > R) fxLocal[k] -= 2 * R; if (fxLocal[k + 2] > R) fxLocal[k + 2] -= 2 * R; if (fxLocal[k + 2] < -R) fxLocal[k + 2] += 2 * R;
    if (fxLocal[k + 1] < -4) fxLocal[k + 1] += 26;
    pos[k] = camera.position.x + fxLocal[k]; pos[k + 1] = camera.position.y + fxLocal[k + 1] - 1; pos[k + 2] = camera.position.z + fxLocal[k + 2];
  }
  fxPoints.geometry.attributes.position.needsUpdate = true;
}

function applyEnvironment() {
  if (!scene || !hemiLight) return;
  const info = MAP_INFO[envMap], indoor = !!info.indoor, night = !indoor && settings.time === "night";
  const theme = MAP_THEME[envMap] || {};

  scene.background = new THREE.Color(fogCol);

  setAmbientFx(indoor ? null : (theme.fx || null));

  skyGroup.visible = !indoor;

    U.top.value.set(sk[0]); U.mid.value.set(sk[1]); U.cc.value.set(sk[2]); U.sh.value.set(sk[3]); U.cover.value = sk[4]; U.hor.value.set(fogCol);
  }
  starPoints.visible = night;
  const sunDir = (night ? new THREE.Vector3(-0.45, 0.75, -0.35) : new THREE.Vector3(0.62, 0.55, 0.45)).normalize();
  celestial.position.copy(sunDir).multiplyScalar(260);
  celestial.material.color.set(night ? 0xdfe8ff : 0xfffaf0);
  celestial.scale.setScalar(night ? 0.8 : 0.22); if (celestial.userData.glow) celestial.userData.glow.visible = !night && theme.sky !== "snow"; if (celestial.userData.halo) celestial.userData.halo.visible = !night && theme.sky !== "snow";

  hemiLight.color.set(indoor ? 0xfff4e0 : night ? 0x3b4c80 : (theme.hemi ?? 0xcfe4ff));
  hemiLight.groundColor.set(indoor ? 0x6a6a6a : night ? 0x242b3a : (theme.ground ?? 0x8a7f6e));
  hemiLight.intensity = indoor ? 1.2 : night ? 0.72 : 0.80;   // brighter fill so shaded sides stay readable

  sunLight.visible = !indoor;
  sunLight.color.set(night ? 0x9db4ff : (theme.sun ?? 0xffe6c0));
  sunLight.intensity = night ? 0.7 : (theme.sunI ?? 1.0) * 1.02;
  const b = currentBounds, cz = (b.zMin + b.zMax) / 2;
  const half = Math.hypot(b.x, (b.zMax - b.zMin) / 2) + 10;
  sunLight.target.position.set(0, 0, cz);
  sunLight.position.set(0, 0, cz).addScaledVector(sunDir, 120);
  const sc = sunLight.shadow.camera;
  sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.near = 1; sc.far = 300;
  sc.updateProjectionMatrix();
  sunLight.target.updateMatrixWorld();

  floorMesh.material.map = floorTexture(MAP_FLOOR[envMap]); floorMesh.material.needsUpdate = true;
  floorMesh.material.roughness = indoor ? 0.7 : 0.95;

function addBox(x, baseY, z, w, h, d, color=0x2a3142, kind=null) {

  kind = kind || forceKind || pickKind(w, d);

}

function addVisualStairRail(from, to) {
  const direction = to.clone().sub(from), length = direction.length();
  const rail = new THREE.Mesh(new THREE.BoxGeometry(0.07, length, 0.07),
    new THREE.MeshStandardMaterial({ color: 0x626a70, metalness: 0.72, roughness: 0.38 }));
  rail.position.copy(from).add(to).multiplyScalar(0.5);
  rail.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  rail.castShadow = true; rail.receiveShadow = true;
  scene.add(rail); envObjects.push(rail);
}

// Solid metal treads are spaced at a realistic riser height; support/collision code lets
// both the player and bots step up them instead of treating the flight like a wall.
function addStairFlight(x, firstZ, steps, rise, tread, direction = -1, width = 3.0, kind = "metal", baseY = 0, solid = false) {
  const topY = baseY + steps * rise;
  for (let i = 0; i < steps; i++) {
    const z = firstZ + direction * i * tread;
    if (solid) addBox(x, baseY, z, width, (i + 1) * rise, tread * 1.04, 0x4a5158, kind);   // solid ramp up from the surface below
    else addBox(x, baseY + i * rise, z, width, rise, tread * 1.04, 0x4a5158, kind);
  }
  const lastZ = firstZ + direction * (steps - 1) * tread;
  const railX = width / 2 - 0.12;
  for (const side of [-1, 1]) {
    addVisualStairRail(
      new THREE.Vector3(x + side * railX, baseY + 0.78, firstZ + direction * 0.15),
      new THREE.Vector3(x + side * railX, topY + 0.78, lastZ + direction * 0.15)
    );
  }
  const route = {
    low: new THREE.Vector3(x, baseY, firstZ - direction * 0.6),
    high: new THREE.Vector3(x, topY, lastZ + direction * 0.8),
    lowY: baseY, highY: topY
  };
  route.x = x; route.halfW = width / 2;
  route.zMin = Math.min(firstZ, lastZ) - tread / 2; route.zMax = Math.max(firstZ, lastZ) + tread / 2;
  route.nodeLow = navAdd(route.low.x, baseY, route.low.z);          // bots walk from the bottom node straight up to the top node
  route.nodeHigh = navAdd(route.high.x, topY, route.high.z);
  navLink(route.nodeLow, route.nodeHigh);
  stairRoutes.push(route);
  return route;
}

// Visible fixed steel ladder on a container face; W climbs and S descends while aligned.
function addContainerLadder(x, containerZ, height) {
  const z = containerZ + 2.5;
  const metal = new THREE.MeshStandardMaterial({ color: 0x697177, metalness: 0.8, roughness: 0.35 });
  const addPart = (w, h, d, px, py, pz) => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), metal);
    mesh.position.set(px, py, pz); mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh); envObjects.push(mesh);
  };
  for (const side of [-1, 1]) addPart(0.065, height, 0.075, x + side * 0.34, height / 2, z);
  const count = Math.floor(height / 0.30);
  for (let i = 1; i <= count; i++) addPart(0.70, 0.055, 0.07, x, i * height / (count + 1), z - 0.015);
  climbableLadders.push({ x, z, standZ: z + 0.46, baseY: 0, topY: height, topX: x, topZ: containerZ + 1.65 });
}

// -----------------------
// Detailed props (Foundry Atrium): small composite objects built from boxes and cylinders
// -----------------------
function addVisual(obj) {                 // decoration only: no collision, bullets pass through
  obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(obj); envObjects.push(obj); return obj;
}
function addSolid(obj) {                  // blocks movement and bullets
  obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(obj);
  if (obj.isGroup) {                      // groups are cleaned up with envObjects; their meshes take bullets
    envObjects.push(obj);
    obj.traverse(o => { if (o.isMesh) obstacles.push(o); });
  } else obstacles.push(obj);
  obstacleBoxes.push(new THREE.Box3().setFromObject(obj));
  return obj;
}

function addCableSpool(x, baseY, z) {      // big wooden spool on its side, axis along X

// A row of lockers / cabinets. axis "z": row runs along Z at fixed x, doors face +/-X (face). axis "x": mirrored.
function addCabinetRow(axis, x, baseY, z, count, face, colors, height = 2.0, width = 0.72, depth = 0.6) {
  for (let i = 0; i < count; i++) {
    const along = i * width;
    const cx = axis === "x" ? x + along : x, cz = axis === "z" ? z + along * (face === 0 ? 1 : 1) : z;
    const sizeX = axis === "x" ? width - 0.03 : depth, sizeZ = axis === "z" ? width - 0.03 : depth;
    const color = colors[i % colors.length];
    addPaintedBox(cx, baseY, cz, sizeX, height, sizeZ, color, 0.35, 0.55);
    const g = new THREE.Group();
    const fx = axis === "z" ? face * (depth / 2 + 0.012) : 0, fz = axis === "x" ? face * (depth / 2 + 0.012) : 0;
    const sw = axis === "z" ? 0.02 : width * 0.6, sd = axis === "x" ? 0.02 : width * 0.6;
    for (let s = 0; s < 4; s++) addPart(g, sw, 0.035, sd, fx, height * 0.82 - s * 0.07, fz, 0x101215, 0.2, 0.8);   // vent slits
    addPart(g, axis === "z" ? 0.03 : 0.05, 0.16, axis === "x" ? 0.03 : 0.05, fx * 1.4, height * 0.5, fz * 1.4, 0xc7ccd1, 0.7, 0.35);   // handle
    g.position.set(cx, baseY, cz);
    addVisual(g);
  }
}

  const lane = (cx, cz, w, d) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), yellow);

    scene.add(m); envObjects.push(m);
  };
  for (const lx of [-17.5, 17.5]) lane(lx, -42, 0.18, 100);          // walkway edge lines
  for (const lz of [-96, -18]) lane(0, lz, 35, 0.18);                  // cross lines

  }
  const stainTex = canvasTex("stain", (g, s) => { blobs(g, s, 7, "12,12,14", 70, 0.55); }, 256);
  const stainMat = new THREE.MeshBasicMaterial({ map: stainTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 });
  for (let i = 0; i < 14; i++) {

    m.position.set((Math.random() * 2 - 1) * 26, 0.035, -4 - Math.random() * 90);
    scene.add(m); envObjects.push(m);
  }
}

// Bot navigation for the Foundry: the two stair flights and a ring path around the upper gallery
function buildFoundryNav() {
  const U = 4.5;
  const sL = stairRoutes[0], sR = stairRoutes[1];
  const fl = navPlace(-14, U, 13), fm = navPlace(0, U, 13), fr = navPlace(14, U, 13);
  navLink(sL.nodeHigh, fl); navLink(sR.nodeHigh, fr); navChain([fl, fm, fr]);
  const zs = [11.5, 2, -10, -22, -34, -46, -58, -70, -82, -92.5];
  const west = zs.map(z => navPlace(-24.5, U, z)), east = zs.map(z => navPlace(24.5, U, z));
  const backW = navPlace(-12, U, -96), backM = navPlace(0, U, -96), backE = navPlace(12, U, -96);
  navLink(fl, west[0]); navChain(west); navLink(west[west.length - 1], backW); navChain([backW, backM, backE]);
  navLink(backE, east[east.length - 1]); navChain(east.slice().reverse()); navLink(east[0], fr);
}

// Solid, visible walls on the map edge so the playable area matches what you see
function addBoundaryWalls() {
  const b = currentBounds, T = 2, H = b.h || 8, col = 0x232733;
  forceKind = WALL_KIND[envMap] || "concrete";
  const midZ = (b.zMin + b.zMax) / 2;
  const lenZ = (b.zMax - b.zMin) + 2 * T;
  addBox(-b.x - T / 2, 0, midZ, T, H, lenZ, col);
  addBox( b.x + T / 2, 0, midZ, T, H, lenZ, col);
  addBox(0, 0, b.zMin - T / 2, 2 * b.x, H, T, col);
  addBox(0, 0, b.zMax + T / 2, 2 * b.x, H, T, col);
  forceKind = null;
}

// Courtyard dressing: stone arcade walls, windows, lamps, paved inlays, a statue on the centre block, benches, planters, trees, crates.
// Returns the floor rectangles [xMin, xMax, zMin, zMax] that its solid props use.
function addCourtyardDetails() {
  const W = currentBounds.x, zN = currentBounds.zMin, zS = currentBounds.zMax, midZ = (zN + zS) / 2, len = zS - zN;
  const stone = 0x8a8478, stoneD = 0x6a655b, stoneL = 0xa8a294, woodC = 0x6b4a2b, leaf = 0x3f7a38, leafD = 0x2f5d2b, dark = 0x161c24;
  const avoid = [];
  const vis = (w, h, d, x, y, z, color, metal = 0.08, rough = 0.88) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), propMat(color, metal, rough));
    m.position.set(x, y, z); return addVisual(m);
  };
  const glowBox = (w, h, d, x, y, z, color) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glowMat(color));
    m.position.set(x, y, z); scene.add(m); envObjects.push(m); return m;
  };
  const ball = (r, x, y, z, color) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 9), propMat(color, 0.0, 0.95));
    m.position.set(x, y, z); return addVisual(m);
  };
  const cylV = (rt, rb, h, x, y, z, color, metal = 0.1, rough = 0.85) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 14), propMat(color, metal, rough));
    m.position.set(x, y, z); return addVisual(m);
  };

  // ---- side walls: plinth, cornice, pilasters, arched-style windows, lanterns, banners, ivy
  for (const sd of [-1, 1]) {
    const fx = sd * (W - 0.18);
    vis(0.36, 0.7, len, fx, 0.35, midZ, stoneD);
    vis(0.7, 0.4, len, sd * (W - 0.35), 7.6, midZ, stoneL);
    vis(0.5, 0.18, len, sd * (W - 0.25), 7.2, midZ, stoneD);
    for (let z = zN + 4; z <= zS - 4; z += 8) {
      vis(0.42, 7.2, 0.9, sd * (W - 0.21), 3.6, z, stone);                                 // pilaster
      vis(0.6, 0.35, 1.2, sd * (W - 0.3), 0.85, z, stoneL);                                // pilaster base
      vis(0.6, 0.3, 1.2, sd * (W - 0.3), 7.05, z, stoneL);                                 // pilaster capital
      vis(0.2, 0.35, 0.2, sd * (W - 0.4), 4.4, z, 0x222629, 0.5, 0.5);                    // lantern bracket
      glowBox(0.14, 0.24, 0.14, sd * (W - 0.4), 4.4, z, 0xffcf80);
      const wz = z + 4;                                                                     // window between pilasters
      if (wz < zS - 1) {
        vis(0.08, 2.8, 1.8, sd * (W - 0.05), 4.7, wz, dark, 0.3, 0.3);
        if (Math.round((z - zN) / 8) % 2 === 0) glowBox(0.05, 2.4, 1.5, sd * (W - 0.1), 4.7, wz, 0xffd89a);   // lit window
        vis(0.16, 0.22, 2.3, sd * (W - 0.09), 6.2, wz, stoneL);                             // lintel
        vis(0.22, 0.2, 2.3, sd * (W - 0.11), 3.2, wz, stoneL);                              // sill
        vis(0.08, 2.8, 0.1, sd * (W - 0.09), 4.7, wz, stoneD);                              // mullion
      }
    }
    for (const bz of [zN + 12, zN + 36]) {                                                 // hanging banners
      vis(0.06, 3.2, 1.3, sd * (W - 0.07), 4.6, bz, sd < 0 ? 0x8a2a2a : 0x2a4a8a, 0.0, 0.95);
      vis(0.1, 0.12, 1.5, sd * (W - 0.08), 6.25, bz, 0x3a2a1c);
    }
    for (let i = 0; i < 16; i++)                                                           // ivy
      vis(0.12, rand(0.8, 2.4), rand(0.5, 1.5), sd * (W - 0.08), rand(0.9, 3.4), rand(zN + 3, zS - 3), i % 3 ? leaf : leafD, 0.0, 1.0);
  }

  // ---- far wall: plinth, cornice, pilasters, windows, big doorway
  vis(2 * W, 0.7, 0.36, 0, 0.35, zN + 0.18, stoneD);
  vis(2 * W, 0.4, 0.7, 0, 7.6, zN + 0.35, stoneL);
  for (let x = -18; x <= 18; x += 6) {
    vis(0.9, 7.2, 0.42, x, 3.6, zN + 0.21, stone);
    vis(1.2, 0.3, 0.6, x, 7.05, zN + 0.3, stoneL);
    glowBox(0.24, 0.24, 0.14, x, 4.4, zN + 0.4, 0xffcf80);
    if (Math.abs(x + 3) > 4 && x + 3 < W - 1) {
      vis(1.8, 2.8, 0.08, x + 3, 4.7, zN + 0.05, dark, 0.3, 0.3);
      vis(2.3, 0.22, 0.16, x + 3, 6.2, zN + 0.09, stoneL);
      vis(2.3, 0.2, 0.22, x + 3, 3.2, zN + 0.11, stoneL);
    }
  }
  vis(4.6, 4.9, 0.1, 0, 2.45, zN + 0.06, 0x3a2a1c, 0.1, 0.85);                             // double doors
  vis(0.1, 4.9, 0.12, 0, 2.45, zN + 0.12, 0x1d140d);
  vis(0.7, 5.3, 0.45, -2.7, 2.65, zN + 0.25, stoneL); vis(0.7, 5.3, 0.45, 2.7, 2.65, zN + 0.25, stoneL);
  vis(6.6, 0.6, 0.55, 0, 5.6, zN + 0.28, stoneL);
  vis(7.4, 0.3, 0.7, 0, 6.05, zN + 0.33, stone);
  // ---- near wall (behind the spawn)
  vis(2 * W, 0.7, 0.36, 0, 0.35, zS - 0.18, stoneD);
  vis(2 * W, 0.4, 0.7, 0, 7.6, zS - 0.35, stoneL);
  for (let x = -18; x <= 18; x += 6) {
    vis(0.9, 7.2, 0.42, x, 3.6, zS - 0.21, stone);
    vis(1.2, 0.3, 0.6, x, 7.05, zS - 0.3, stoneL);
    if (x + 3 < W - 1) { vis(1.8, 2.8, 0.08, x + 3, 4.7, zS - 0.05, dark, 0.3, 0.3); vis(2.3, 0.22, 0.16, x + 3, 6.2, zS - 0.09, stoneL); }
  }

  // ---- paved inlays: border band, medallion rings around the centre block, cross paths
  const inlay = (w, d, x, z, color) => vis(w, 0.02, d, x, 0.011, z, color, 0.0, 0.95);
  inlay(2 * W - 2, 0.5, 0, zN + 1.6, 0x57534b); inlay(2 * W - 2, 0.5, 0, zS - 1.6, 0x57534b);
  inlay(0.5, len - 3.2, -(W - 1.6), midZ, 0x57534b); inlay(0.5, len - 3.2, W - 1.6, midZ, 0x57534b);
  inlay(0.35, len - 4, 0, midZ, 0x6f6a60); inlay(2 * W - 4, 0.35, 0, -20, 0x6f6a60);
  for (const [r0, r1, col] of [[5.5, 6.0, 0x57534b], [8.2, 8.5, 0xb6b09f], [10.6, 11.1, 0x57534b]]) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(r0, r1, 56), propMat(col, 0.0, 0.95));
    ring.rotation.x = -Math.PI / 2; ring.position.set(0, 0.013, -20); addVisual(ring);
  }

  // ---- centre block becomes a monument: stepped base, cornice, urns, statue
  addBox(0, 0, -20, 8.6, 0.14, 8.6, 0x8a8478, "concrete");     // low steps (walkable)
  addBox(0, 0, -20, 7.9, 0.28, 7.9, 0x8a8478, "concrete");
  avoid.push([-4.4, 4.4, -24.4, -15.6]);
  vis(7.6, 0.3, 7.6, 0, 3.15, -20, stoneL);                                                    // cap on the 7 x 7 x 3 block
  vis(7.2, 0.15, 7.2, 0, 2.85, -20, stone);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {                                        // corner urns with plants
    cylV(0.28, 0.2, 0.55, sx * 3.0, 3.6, -20 + sz * 3.0, stoneL);
    ball(0.34, sx * 3.0, 4.05, -20 + sz * 3.0, leaf);
  }
  vis(1.5, 0.9, 1.5, 0, 3.75, -20, stone);                                                     // pedestal
  cylV(0.38, 0.52, 1.5, 0, 4.95, -20, 0x7a5a3a, 0.65, 0.4);                                   // bronze figure
  ball(0.24, 0, 5.9, -20, 0x7a5a3a); 
  vis(0.14, 0.9, 0.14, 0.45, 5.4, -20.15, 0x7a5a3a, 0.65, 0.4);                                // raised arm
  for (const sx of [-1, 1]) for (let i = 0; i < 5; i++) vis(0.1, rand(0.5, 1.6), rand(0.5, 1.2), sx * 3.52, rand(0.5, 2.4), -20 + rand(-3, 3), i % 2 ? leaf : leafD, 0.0, 1.0);   // ivy on the block

  // ---- lamp posts
  for (const [lx, lz] of [[-10, -13], [10, -13], [-10, -28], [10, -28]]) {
    addPaintedBox(lx, 0, lz, 0.3, 4.4, 0.3, 0x24282c, 0.5, 0.55);
    vis(0.7, 0.12, 0.12, lx, 4.4, lz, 0x24282c, 0.5, 0.55);
    cylV(0.2, 0.28, 0.4, lx, 4.65, lz, 0x24282c, 0.5, 0.55);
    glowBox(0.24, 0.3, 0.24, lx, 4.62, lz, 0xffe6a8);
    avoid.push([lx - 0.6, lx + 0.6, lz - 0.6, lz + 0.6]);
  }

  // ---- benches and stone planters along the side walls
  for (const sd of [-1, 1]) {
    for (const bz of [-7, -31]) {
      addPaintedBox(sd * 19.6, 0, bz, 0.7, 0.45, 2.4, woodC, 0.0, 0.9);                       // seat (low cover)
      vis(0.12, 0.55, 2.4, sd * 19.95, 0.72, bz, woodC, 0.0, 0.9);                              // backrest
      for (const lz of [-1, 1]) vis(0.5, 0.45, 0.12, sd * 19.6, 0.22, bz + lz * 1.0, 0x23272b, 0.5, 0.5);
      avoid.push([sd * 19.6 - 1, sd * 19.6 + 1, bz - 1.4, bz + 1.4]);
    }
    for (const pz of [-14, -26]) {
      addPaintedBox(sd * 19, 0, pz, 2.0, 0.75, 2.0, stoneD, 0.05, 0.9);                        // planter
      ball(0.62, sd * 19, 1.15, pz, leaf); ball(0.5, sd * 18.5, 1.3, pz + 0.4, leafD); ball(0.45, sd * 19.5, 1.25, pz - 0.35, leaf);
      avoid.push([sd * 19 - 1.3, sd * 19 + 1.3, pz - 1.3, pz + 1.3]);
    }
  }

  // ---- trees (trunk is solid, canopy is decoration so you can still see and shoot through the leaves)
  for (const [tx, tz] of [[-16, -2], [16, -2], [-17.5, -40], [17.5, -40]]) {
    addPaintedBox(tx, 0, tz, 0.5, 3.6, 0.5, 0x4a3320, 0.0, 0.95);
    cylV(1.0, 1.05, 0.3, tx, 0.15, tz, stoneD);                                                 // stone tree ring
    ball(1.7, tx, 4.6, tz, leaf); ball(1.3, tx + 0.9, 5.2, tz + 0.4, leafD); ball(1.2, tx - 0.9, 4.9, tz - 0.5, leaf);
    avoid.push([tx - 1.5, tx + 1.5, tz - 1.5, tz + 1.5]);
  }

  // ---- crate stacks and barrels in the back corners
  for (const sd of [-1, 1]) {
    addBox(sd * 19.4, 0, -44.2, 1.7, 1.4, 1.7, 0, "crate");
    addBox(sd * 19.4, 1.4, -44.2, 1.2, 1.0, 1.2, 0, "crate");
    addBox(sd * 17.2, 0, -45.2, 1.4, 1.1, 1.4, 0, "crate");
    addBarrelCluster(sd * 16.2, 0, -43.6, 3);
    avoid.push([sd * 19.4 - 2.2, sd * 19.4 + 2.2, -46.2, -42.2], [sd * 16.2 - 1.6, sd * 16.2 + 1.6, -45, -42.4]);
  }
  return avoid;
}

const MAP_WALL_H = { city: 12, desert: 8, mountain: 11, sea: 10 };

// Wall along `axis` ("x" or "z") from a1 to a2 at coordinate `fixed`, with openings [{a, b, y0, y1}] cut out of it.
function wallRun(axis, a1, a2, fixed, baseY, h, thick, kind, openings) {
  const ops = (openings || []).slice().sort((p, q) => p.a - q.a);
  const seg = (from, to, y0, y1) => {
    if (to - from < 0.02 || y1 - y0 < 0.02) return;
    const mid = (from + to) / 2, len = to - from;
    if (axis === "x") addBox(mid, baseY + y0, fixed, len, y1 - y0, thick, 0, kind);
    else addBox(fixed, baseY + y0, mid, thick, y1 - y0, len, 0, kind);
  };
  let cur = a1;
  for (const o of ops) {
    seg(cur, o.a, 0, h);
    seg(o.a, o.b, o.y1, h);        // lintel above the opening
    seg(o.a, o.b, 0, o.y0);        // sill below it
    cur = o.b;
  }
  seg(cur, a2, 0, h);
}

let _glassMat = null;
function glassPane(axis, a, b, fixed, y0, y1) {          // see-through window glass (visual only: bullets and bots pass the open window)
  _glassMat = _glassMat || new THREE.MeshStandardMaterial({ color: 0x9cc4e4, transparent: true, opacity: 0.22, roughness: 0.1, metalness: 0.5, depthWrite: false });
  const w = axis === "x" ? b - a : 0.05, d = axis === "x" ? 0.05 : b - a;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, y1 - y0, d), _glassMat);
  m.position.set(axis === "x" ? (a + b) / 2 : fixed, (y0 + y1) / 2, axis === "x" ? fixed : (a + b) / 2);
  m.castShadow = false;
  scene.add(m); envObjects.push(m);
}

// Walls, roof, doors and windows for a rectangular building. Returns the inner rectangle.
// doors: { n: [[centre, width]], s, e, w } (n = -z side, s = +z side, e = +x side, w = -x side)
function shell(o) {
  const T = o.thick || 0.5, base = o.baseY || 0, H = o.h, kind = o.kind || "brick";
  const winY0 = o.winY0 ?? 1.0, winY1 = o.winY1 ?? 2.5, winW = o.winW || 1.8, every = o.every || 4.5;
  const sides = { n: ["x", o.x1, o.x2, o.z1], s: ["x", o.x1, o.x2, o.z2], w: ["z", o.z1, o.z2, o.x1], e: ["z", o.z1, o.z2, o.x2] };
  for (const key of "nsew") {
    const [axis, a1, a2, fixed] = sides[key];
    const ops = [], doors = (o.doors && o.doors[key]) || [];
    for (const [c, w] of doors) ops.push({ a: c - w / 2, b: c + w / 2, y0: 0, y1: o.doorH || 2.8 });
    if ((o.windowSides ?? "nsew").includes(key) && !o.noWindows) {
      for (let c = a1 + 2.2; c < a2 - 2.2; c += every) {
        if (doors.some(([dc, dw]) => Math.abs(c - dc) < dw / 2 + winW / 2 + 0.6)) continue;
        ops.push({ a: c - winW / 2, b: c + winW / 2, y0: winY0, y1: winY1 });
        glassPane(axis, c - winW / 2, c + winW / 2, fixed, base + winY0, base + winY1);
      }
    }
    wallRun(axis, a1 - T / 2, a2 + T / 2, fixed, base, H, T, kind, ops);
  }
  if (!o.noRoof) addBox((o.x1 + o.x2) / 2, base + H, (o.z1 + o.z2) / 2, o.x2 - o.x1 + 0.9, 0.4, o.z2 - o.z1 + 0.9, 0, o.roofKind || "concrete");
  const inner = { x1: o.x1 + T / 2, x2: o.x2 - T / 2, z1: o.z1 + T / 2, z2: o.z2 - T / 2 };
  if (!o.noFloor) interiorFloor(inner, o.floorColor || 0x6b6258, base);
  if (!o.noLights) ceilingLights(inner, base + H - 0.06, o.lightEvery || 6);
  return inner;
}

// Many small decorative meshes (windows, lights, paint, props) are merged into one mesh per material: far fewer draw calls.
// Only decoration is merged; solid props keep their own meshes because bullets and line-of-sight rays test those.
function mergeStaticVisuals() {
  const byMat = new Map(), out = [];
  for (const o of envObjects) {
    const ok = o.isMesh && o.geometry && o.geometry.attributes.position && !Array.isArray(o.material) && o.parent === scene;
    if (!ok) { out.push(o); continue; }
    if (!byMat.has(o.material)) byMat.set(o.material, []);
    byMat.get(o.material).push(o);
  }
  const v = new THREE.Vector3(), nm = new THREE.Matrix3();
  for (const [mat, list] of byMat) {
    if (list.length < 4) { out.push(...list); continue; }
    let vTotal = 0, iTotal = 0;
    for (const m of list) { const g = m.geometry; vTotal += g.attributes.position.count; iTotal += g.index ? g.index.count : g.attributes.position.count; }
    const pos = new Float32Array(vTotal * 3), nor = new Float32Array(vTotal * 3), uv = new Float32Array(vTotal * 2), idx = new Uint32Array(iTotal);
    let vo = 0, io = 0, shadow = false;
    for (const m of list) {
      m.updateMatrixWorld(true);
      const g = m.geometry, pa = g.attributes.position, na = g.attributes.normal, ua = g.attributes.uv;
      nm.getNormalMatrix(m.matrixWorld);
      for (let i = 0; i < pa.count; i++) {
        v.fromBufferAttribute(pa, i).applyMatrix4(m.matrixWorld); pos[(vo + i) * 3] = v.x; pos[(vo + i) * 3 + 1] = v.y; pos[(vo + i) * 3 + 2] = v.z;
        if (na) { v.fromBufferAttribute(na, i).applyMatrix3(nm).normalize(); nor[(vo + i) * 3] = v.x; nor[(vo + i) * 3 + 1] = v.y; nor[(vo + i) * 3 + 2] = v.z; }
        if (ua) { uv[(vo + i) * 2] = ua.getX(i); uv[(vo + i) * 2 + 1] = ua.getY(i); }
      }
      const cnt = g.index ? g.index.count : pa.count;
      for (let i = 0; i < cnt; i++) idx[io + i] = (g.index ? g.index.getX(i) : i) + vo;
      vo += pa.count; io += cnt; shadow = shadow || m.castShadow;
      scene.remove(m);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3)); geo.setAttribute("normal", new THREE.BufferAttribute(nor, 3)); geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = shadow; mesh.receiveShadow = true; mesh.frustumCulled = false;
    scene.add(mesh); out.push(mesh);
  }
  envObjects.length = 0; envObjects.push(...out);
}

// ---------- Container Depot (rebuilt, 100 x 150 m)
function buildDepotMap() {
  setBounds(50, -130, 20);
  const rows = 6, cols = 6;
  for (let row = 0; row < rows; row++) {
    const z = -24 - row * 17;
    for (let col = 0; col < cols; col++) {
      const x = -37.5 + col * 15;
      const ladderContainer = (row === 1 && col === 1) || (row === 3 && col === 4) || (row === 4 && col === 2) || (row === 2 && col === 5);
      const double = (row + col * 2) % 5 === 0 && !ladderContainer;
      const h = ladderContainer ? 3.2 : (double ? 6.4 : 3.2);
      addBox(x, 0, z, 10, h, 4.8, 0, "container");
      if (ladderContainer) addContainerLadder(x, z, h);
      if (!double && !ladderContainer && Math.random() < 0.3) addBox(x + rand(-1, 1), h, z, 5, 2.6, 4.4, 0, "container");   // a loose box on top
    }
  }
  // alley cover: crates, barrels, pallet stacks and low barriers between the rows
  for (let k = 0; k < 5; k++) {
    const gz = -32.5 - k * 17;
    for (let j = 0; j < 2; j++) {
      const x = rand(-42, 42), t = Math.random();
      if (t < 0.4) addBox(x, 0, gz + rand(-1.5, 1.5), rand(1.8, 3.2), rand(1.2, 2.2), rand(1.8, 2.8), 0, "crate");
      else if (t < 0.7) kJersey(x, gz + rand(-1.5, 1.5), "x", 3.0);
      else addBarrelCluster(x, 0, gz + rand(-1.5, 1.5), 3);
    }
  }
  for (let i = 0; i < 4; i++) addPalletStack(rand(-44, 44), 0, -126 + rand(0, 3), 1.2, 1.2, 2);
  addDepotExtras();
}

    if (box.min.y >= feetY + curEye + 0.08) continue;   // pass beneath upper walkways

    for (let j = 0; j < 5; j++) { const a = 0.55 + j * 0.38, t = new THREE.Mesh(new THREE.BoxGeometry(0.010 * s, 0.0025 * s, 0.002 * s), dark); t.position.set(Math.cos(a) * r * 1.01, (-0.010 + (j % 2 ? 0.008 : -0.008)) * s, -Math.sin(a) * r * 1.01); t.rotation.y = a - Math.PI / 2; g.add(t); }
    for (let j = 0; j < 3; j++) ring(-0.046 - j * 0.008, cap, 0.0020);               // grip ribs near the base
  }
  addFuseHardware(g, s, H / 2 + 0.002 * s, r * 0.78, metal, cap);
  return g;
}

// Articulated grenade arm: an upper sleeve, elbow, forearm, wrist, detailed hand and grenade.
// The hand's built-in static forearm is hidden; the two animated limb segments replace it.
const GRENADE_SHOULDER = new THREE.Vector3(0, -0.18, 0.02);
const GRENADE_HOLD_POSE = [-0.02, -0.02, 0, -0.11, 0.14, 0.04, 0.25, -0.08];

function placeArmSegment(mesh, from, to) {
  const direction = to.clone().sub(from);
  const length = direction.length();
  mesh.position.copy(from).add(to).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.scale.y = length;
}

function applyGrenadeArmPose(pose) {
  if (!grenadeView) return;
  const elbow = new THREE.Vector3(-pose[0], pose[1], pose[2]);   // left arm: the stored right-arm toss is mirrored
  const wrist = new THREE.Vector3(-pose[3], pose[4], pose[5]);
  placeArmSegment(grenadeView.upperArm, GRENADE_SHOULDER, elbow);
  placeArmSegment(grenadeView.forearm, elbow, wrist);
  grenadeView.elbowJoint.position.copy(elbow);
  grenadeView.wristJoint.position.copy(wrist);
  grenadeView.hand.position.copy(wrist);
  grenadeView.hand.rotation.set(pose[6], pose[8] || 0, -pose[7]);
}
// Opens the fist: every finger swings out about its knuckle (0 = closed round the grenade, 1 = open hand)
function setGrenadeHandOpen(o) {
  if (!grenadeView) return;
  const fingers = grenadeView.hand.userData.gripFingers || [], r = 0.075 / 2, Kx = 0.047, Kz = r + 0.03, th = -1.15 * o, c = Math.cos(th), s = Math.sin(th);
  for (const f of fingers) { f.rotation.y = th; f.position.x = Kx - (Kx * c + Kz * s); f.position.z = Kz - (-Kx * s + Kz * c); }
}

function setGrenadeHoldPose() {
  if (!grenadeView) return;
  grenadeView.group.position.set(-0.36, -0.43, -0.52);
  grenadeView.group.rotation.set(0, 0, 0);
  applyGrenadeArmPose(GRENADE_HOLD_POSE);
}

function replaceHeldUtilityModel() {
  if (!grenadeView) return;
  const old = grenadeView.nade;
  if (old.parent) old.parent.remove(old);
  old.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
  const nade = makeUtilityModel(utilityType, 1.25);
  nade.position.set(0, 0.025, 0.065);
  grenadeView.hand.add(nade);
  grenadeView.nade = nade;
}

function updateUtilityInfo() {
  const info = document.getElementById("utilityInfo");
  if (info && UTILITY_TYPES[utilityType]) info.textContent = UTILITY_TYPES[utilityType].description;
}

function setSideUtility(type) {
  if (!UTILITY_TYPES[type]) return;
  utilityCounts[utilityType] = grenades;
  utilityType = type;
  settings.sideUtility = type;
  grenades = utilityCounts[type] ?? UTILITY_TYPES[type].startWith;

function setupGrenadeView() {
  const group = new THREE.Group();
  group.visible = false;
  const sleeve = new THREE.MeshStandardMaterial({ color: 0x111318, roughness: 0.88 });
  const glove = new THREE.MeshStandardMaterial({ color: 0x17191e, roughness: 0.78 });
  const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.050, 0.068, 1, 12), sleeve);
  const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.043, 0.054, 1, 12), sleeve);
  const elbowJoint = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 10), glove);

  const hand = makeHand(false, 0.075); hand.scale.x = -1; hand.userData.isLeft = true;   // a mirrored fist on the left arm rig
  hand.children[hand.children.length - 1].visible = false; // replace the static forearm with the animated rig

// Toss cycle in seconds: lift, pause, draw the elbow back, accelerate through release, then recover.
// Each key stores [time, elbow x/y/z, wrist x/y/z, hand pitch, hand roll].
const THROW_KEYS = [
  // t,    elbow x,y,z,         wrist x,y,z,          pitch, roll, yaw     (right-arm convention; x is mirrored for the left arm)
  [0.00, -0.02, -0.02, 0.00, -0.11, 0.14, 0.04,  0.25, -0.08, 0.00],   // held at the side
  [0.14, -0.06, -0.04, 0.04, -0.14, 0.13, 0.06,  0.10, -0.20, 0.00],   // the gun slides to the right, the hand lifts
  [0.34, -0.40, -0.12, 0.20, -0.68, -0.09, 0.40, -0.55, -0.70, 0.00],  // arm pulled back across the body to the right side
  [0.43, -0.43, -0.10, 0.23, -0.72, -0.07, 0.46, -0.70, -0.80, 0.00],  // wound up, fist turned inward
  [0.50, -0.20, 0.00, -0.04, -0.31, 0.15, -0.10,  0.50,  0.50, 0.00],  // swung out and forward: forearm rotating outward, fingers open, grenade leaves the hand
  [0.58,  0.00, 0.04, -0.10,  0.02, 0.21, -0.18,  0.70,  1.20, 0.00],  // follow-through, palm turned out
  [0.78, -0.05, 0.00, -0.02, -0.06, 0.09, -0.03,  0.45,  0.50, 0.00],
  [1.00, -0.02, -0.02, 0.00, -0.11, 0.14, 0.04,  0.25, -0.08, 0.00]
];
// Underhand toss: the hand drops low and back, then swings forward and up in a short scooping lob.
const THROW_KEYS_UNDER = [
  [0.00, -0.02, -0.02, 0.00, -0.11,  0.14,  0.04,  0.25, -0.08, 0.00],   // held at the side
  [0.10, -0.10, -0.10, 0.05, -0.18,  0.02,  0.08,  0.15, -0.20, 0.00],   // hand starts to drop
  [0.26, -0.22, -0.30, 0.18, -0.34, -0.50,  0.30, -0.15, -0.30, 0.00],   // low and back, palm up
  [0.34, -0.23, -0.32, 0.20, -0.36, -0.54,  0.33, -0.20, -0.35, 0.00],   // brief hold at the bottom of the swing
  [0.44, -0.14, -0.24, -0.06, -0.14, -0.30, -0.30,  0.70,  0.10, 0.00],  // scoop forward: grenade leaves the hand
  [0.54, -0.08, -0.14, -0.12, -0.04, -0.04, -0.36,  0.95,  0.30, 0.00],  // follow-through, hand rises
  [0.68, -0.04, -0.06, -0.04, -0.08,  0.08, -0.10,  0.50,  0.10, 0.00],
  [0.82, -0.02, -0.02,  0.00, -0.11,  0.14,  0.04,  0.25, -0.08, 0.00]
];

// Time-aware Catmull-Rom interpolation keeps the elbow and wrist moving through each key
// instead of easing to a stop at every pose like a mechanical piston.
function sampleGrenadeThrowPose(t, keys = THROW_KEYS) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const a = keys[i - 1], b = keys[i];
      const before = keys[Math.max(0, i - 2)], after = keys[Math.min(keys.length - 1, i + 1)];
      const dt = b[0] - a[0], u = (t - a[0]) / dt;
      const u2 = u * u, u3 = u2 * u;
      const h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u;
      const h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
      return a.slice(1).map((p1, j) => {
        const p2 = b[j + 1];
        const m1 = i === 1 ? 0 : (p2 - before[j + 1]) / (b[0] - before[0]) * dt;
        const m2 = i === keys.length - 1 ? 0 : (after[j + 1] - p1) / (after[0] - a[0]) * dt;
        return h00 * p1 + h10 * m1 + h01 * p2 + h11 * m2;
      });
    }
  }
  return keys[keys.length - 1].slice(1);
}

// 0..1: how far the gun has dropped out of the way for the throw (used by applyWeaponFeel)
function throwGunLower() {
  if (!throwState) return 0;
  const sm = x => x * x * (3 - 2 * x);
  const a = clamp(throwState.t / 0.16, 0, 1);
  const b = clamp((throwState.t - 0.62) / 0.26, 0, 1);
  return sm(a) * (1 - sm(b));
}

function grenadeSlotHtml() {
  return '<div class="slot gren" id="grenSlot"><span class="k">' + prettyKey(binds.grenade) + '</span>' +

function clearGrenades() {
  for (const g of liveGrenades) disposeGrenadeMesh(g.mesh);

function disposeGrenadeMesh(mesh) {
  scene.remove(mesh);
  mesh.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });

// ---- throwing ----
function tryThrowGrenade(mode = "over") {
  if (!roundActive || dying || swapping || throwState) return;
  if (gNow() < grenadeCooldownUntil) return;
  if (grenades <= 0) { beep(140, 0.05, "square", 0.04); return; }   // dry click
  if (scoped) setScoped(false);
  reloading = false;                // throwing interrupts a reload, like switching weapons does
  throwState = { t: 0, mode };
  throwReleased = false;
  if (grenadeView) {
    grenadeView.group.visible = true;
    grenadeView.nade.visible = true;
    grenadeView.group.position.set(-0.36, -0.43, -0.52);
    grenadeView.group.rotation.set(0, 0, 0);
    applyGrenadeArmPose(THROW_KEYS[0].slice(1)); setGrenadeHandOpen(0);
  }
  beep(360, 0.03, "triangle", 0.04);   // pin pull
  updateHUD();
}

function updateGrenadeThrow(dt) {
  if (!throwState || dt <= 0) return;
  throwState.t += dt;
  const t = throwState.t, under = throwState.mode === "under", TT = under ? THROW_TIME_U : THROW_TIME, TR = under ? THROW_RELEASE_U : THROW_RELEASE;
  if (grenadeView) {
    const pose = sampleGrenadeThrowPose(Math.min(t, TT), under ? THROW_KEYS_UNDER : THROW_KEYS);
    applyGrenadeArmPose(pose);
    const sm = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
    setGrenadeHandOpen(sm((t - (TR - 0.05)) / 0.09) * (1 - sm((t - (TT - 0.28)) / 0.2)));
  }
  if (!throwReleased && t >= TR) {
    throwReleased = true;
    if (grenadeView) grenadeView.nade.visible = false;
    releaseGrenade(throwState.mode);
  }
  if (t >= TT) {
    throwState = null; throwReleased = false; setGrenadeHandOpen(0);
    grenadeEquipped = false; updateWeaponModelVisibility();   // back to the gun once the toss is done
    // Cooldown begins when the grenade is released, not when the arm finishes recovering.
    if (grenadeView) {
      grenadeView.group.visible = grenadeEquipped && grenades > 0;
      grenadeView.nade.visible = grenades > 0;
      if (grenadeView.group.visible) setGrenadeHoldPose();
    }
    updateHotbarHud();
  }
}

function releaseGrenade(mode = "over") {
  const thrownType = utilityType;
  const utility = UTILITY_TYPES[thrownType];
  grenades = Math.max(0, grenades - 1);
  utilityCounts[thrownType] = grenades;
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd);
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const start = camera.position.clone().addScaledVector(fwd, 0.5).addScaledVector(right, -0.2);
  start.y -= 0.18;
  if (grenadeHitsBox(start)) start.copy(camera.position);   // pressed against a wall: let go from the eye instead
  const dir = fwd.clone();
  dir.y += mode === "under" ? 0.24 : 0.04;   // overhand: thrown nearly straight; underhand: a low lob
  dir.normalize();

  // Carry a little of the arm's forward/upward flick into the grenade's launch velocity.
  const sampleDt = 0.035;
  const before = sampleGrenadeThrowPose(Math.max(0, THROW_RELEASE - sampleDt));
  const after = sampleGrenadeThrowPose(Math.min(THROW_TIME, THROW_RELEASE + sampleDt));
  const armVelocity = new THREE.Vector3(
    -(after[3] - before[3]) / (2 * sampleDt),
    (after[4] - before[4]) / (2 * sampleDt),
    (after[5] - before[5]) / (2 * sampleDt)
  ).applyQuaternion(camera.quaternion).multiplyScalar(mode === "under" ? 0 : 0.10);
  const launchVelocity = dir.multiplyScalar(mode === "under" ? 8.5 : GRENADE.throwSpeed).add(armVelocity);
  grenadeCooldownUntil = gNow() + utility.cooldown * 1000;

  const s = GR_R / 0.042;
  const mesh = makeUtilityModel(thrownType, s);
  const ledColor = thrownType === "flash" ? 0x55ccff : thrownType === "smoke" ? 0xe0e4df : 0xff2a2a;
  const led = new THREE.Mesh(new THREE.SphereGeometry(0.011 * s, 8, 8), new THREE.MeshBasicMaterial({ color: ledColor }));
  led.position.y = 0.093 * s;          // blinking fuse light on top
  mesh.add(led);
  mesh.position.copy(start);
  mesh.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(mesh);

  const networkId = window.__fpsVersusActive && multiplayerSocket?.connected
    ? `${multiplayerSocket.id}-${Date.now().toString(36)}-${(++utilityProjectileSeq).toString(36)}` : null;
  const projectile = {
    mesh, led, vel: launchVelocity, fuse: utility.fuse, type: thrownType,
    spin: new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize(),
    lastSfx: -1e9, networkId, visualOnly: false
  };
  mesh.userData.liveGrenade = projectile;
  liveGrenades.push(projectile);
  if (networkId) {
    multiplayerSocket.emit("match:utility", {
      projectileId: networkId, type: thrownType,
      position: { x: start.x, y: start.y, z: start.z },
      velocity: { x: launchVelocity.x, y: launchVelocity.y, z: launchVelocity.z },
    });
  }
  beep(200, 0.06, "sawtooth", 0.04);   // whoosh
  updateHUD();
}

// ---- flight ----
// Is the grenade (a small sphere at p) overlapping any wall, crate or container?
function grenadeHitsBox(p) {
  const r = GR_R;
  for (const b of obstacleBoxes) {
    if (p.x > b.min.x - r && p.x < b.max.x + r &&
        p.y > b.min.y - r && p.y < b.max.y + r &&
        p.z > b.min.z - r && p.z < b.max.z + r) return true;
  }
  return false;
}

function grenadeBounceSfx(g) {
  if (gNow() - g.lastSfx < 90) return;
  g.lastSfx = gNow();
  beep(900, 0.012, "square", 0.025);
}

const SHOTGUN_GRENADE_BOOST = 32;
function detonateLiveGrenade(g) {
  const i=liveGrenades.indexOf(g);
  if(i<0)return false;
  const pos=g.mesh.position.clone();
  disposeGrenadeMesh(g.mesh);
  liveGrenades.splice(i,1);
  detonateUtility(pos,g.type,!!g.visualOnly);
  return true;
}
function applyGrenadeShot(g, action, direction) {
  if(!g||!liveGrenades.includes(g)||g.shotInteractionDone)return false;
  g.shotInteractionDone=true;g.shotInteractionPending=false;
  if(action==="detonate")return detonateLiveGrenade(g);
  if(action==="boost"&&direction){
    const dir=direction.clone().normalize();
    g.vel.addScaledVector(dir,SHOTGUN_GRENADE_BOOST);
    g.detonateOnImpact=true;
    return true;
  }
  return false;
}
function requestGrenadeShot(g, weapon, direction) {
  const weaponId=curWeaponNum;
  const action=weapon?.type==="sniper"?"detonate":weapon?.type==="shotgun"?"boost":null;
  if(!g||!action||g.shotInteractionDone||g.shotInteractionPending)return false;
  if(window.__fpsVersusActive){
    if(!g.networkId||!multiplayerSocket?.connected)return false;
    g.shotInteractionPending=true;
    multiplayerSocket.emit("match:utility-hit",{
      projectileId:g.networkId,weaponId,
      direction:{x:direction.x,y:direction.y,z:direction.z}
    });
    return true;
  }
  return applyGrenadeShot(g,action,direction);
}

function updateLiveGrenades(dt, visualOnlyOnly=false) {
  if (dt <= 0) return;
  const indoor = !!(MAP_INFO[runMap || activeMapName()] && MAP_INFO[runMap || activeMapName()].indoor);
  const bounce = GRENADE.bounce;

  for (let i = liveGrenades.length - 1; i >= 0; i--) {
    const g = liveGrenades[i];
    if (visualOnlyOnly && !g.visualOnly) continue;
    if (g.postFuse === undefined) g.postFuse = postImpactFuse(g.networkId);
    if (g.air === undefined) g.air = 6;
    if (g.hit) g.fuse -= dt; else if ((g.air -= dt) <= 0) g.fuse = 0;   // fuse only runs once it has landed (or after 6 s in the air)
    const p = g.mesh.position;

    // small sub-steps so a fast grenade can't tunnel through a thin wall
    const steps = Math.max(1, Math.ceil(g.vel.length() * dt / 0.2));
    const h = dt / steps;
    for (let s = 0; s < steps; s++) {
      let touchedSurface = false;
      g.vel.y -= GRENADE.gravity * h;

      p.x += g.vel.x * h;
      if (grenadeHitsBox(p) || p.x < -currentBounds.x + GR_R || p.x > currentBounds.x - GR_R) {
        touchedSurface = true;
        p.x -= g.vel.x * h; g.vel.x *= -bounce; g.vel.z *= 0.85; grenadeBounceSfx(g);
      }
      p.z += g.vel.z * h;
      if (grenadeHitsBox(p) || p.z < currentBounds.zMin + GR_R || p.z > currentBounds.zMax - GR_R) {
        touchedSurface = true;
        p.z -= g.vel.z * h; g.vel.z *= -bounce; g.vel.x *= 0.85; grenadeBounceSfx(g);
      }

      p.y += g.vel.y * h;
      let landed = false;
      if (grenadeHitsBox(p)) { p.y -= g.vel.y * h; landed = true; touchedSurface = true; }          // landed on (or hit the underside of) a box
      if (p.y < GR_R) { p.y = GR_R; landed = true; touchedSurface = true; }                          // floor
      if (indoor && p.y > currentBounds.h - GR_R) {                           // ceiling (indoor maps only)
        p.y = currentBounds.h - GR_R;
        touchedSurface = true;
        if (g.vel.y > 0) g.vel.y = -g.vel.y * bounce;
      }
      if (touchedSurface && !g.hit) { g.hit = true; g.fuse = g.postFuse; }
      if (g.detonateOnImpact && touchedSurface) { g.fuse = 0; break; }
      if (landed) {
        if (Math.abs(g.vel.y) > 1.5) {
          g.vel.y = -g.vel.y * bounce;
          g.vel.x *= 0.8; g.vel.z *= 0.8;          // each real bounce scrubs off some speed
          grenadeBounceSfx(g);
        } else {
          g.vel.y = 0;
          const roll = Math.exp(-3 * h);           // rolling friction while resting on something
          g.vel.x *= roll; g.vel.z *= roll;
        }
      }
    }

    // tumble in flight, blink faster as the fuse runs down
    const speed = g.vel.length();
    g.mesh.rotateOnAxis(g.spin, Math.min(14, speed * 0.9) * dt);
    g.led.visible = g.hit ? Math.sin(g.fuse * (g.fuse < 1 ? 42 : 15)) > 0 : Math.sin(g.air * 9) > 0;

function detonateUtility(pos, type, visualOnly=false) {
  if (type === "flash") { explodeFlash(pos); return; }

  if (window.__fpsVersusActive) explodeVersusGrenade(pos);

function explodeVersusGrenade(pos) {
  // Reuse the usual blast and self-knockback; remote damage is relayed through the match server.
  explodeGrenade(pos);
  const from = pos.clone(); from.y += 0.25;
  for (const player of latestPlayersSnapshot || []) {
    if (!player || player.id === multiplayerSocket.id || player.team === window.__fpsLocalTeam || player.alive === false || !player.position) continue;
    const c = new THREE.Vector3(player.position.x, player.position.y + 1.05, player.position.z);
    const d = c.distanceTo(pos);
    if (d > GRENADE.radius) continue;
    let damage = GRENADE.maxDmg * (1 - (1 - GRENADE.minFrac) * (d / GRENADE.radius));
    if (!hasLineOfSight(from, c) || lineBlockedBySmoke(from, c)) damage *= GRENADE.coverFrac;
    if (damage > 0.5) multiplayerSocket.emit("match:hit", { targetId: player.id, damage: Math.min(120, damage) });
    spawnVersusBloodHit(c, 1.25);
  }
}

// ---- explosion ----
function explodeGrenade(pos) {
  spawnBlast(pos);
  boomSound(pos);

  const R = GRENADE.radius;
  const from = pos.clone(); from.y += 0.25;     // so the floor under the blast doesn't count as cover
  let damaged = 0, killed = 0;

  for (const e of enemies.slice()) {
    if (e.userData.hp <= 0) continue;
    const c = e.position.clone(); c.y += 1.05;  // aim at the middle of the enemy
    const d = c.distanceTo(pos);
    if (d > R) continue;

    let dmg = GRENADE.maxDmg * (1 - (1 - GRENADE.minFrac) * (d / R));
    if (!hasLineOfSight(from, c)) dmg *= GRENADE.coverFrac;   // cover soaks up most of the blast

    e.userData.hp -= dmg;
    damaged++;
    drawHealthBar(e);
    spawnHitParticles(c, 0xffb347);
    score += 30;
    e.userData.lastSeenPlayer = camera.position.clone();
    e.userData.lastSeenTime = gNow();
    e.userData.state = "engage";
    e.userData.reactionAt = gNow() + rand(AI.reactionMin, AI.reactionMax) * 1000;

    if (e.userData.hp <= 0) {
      startEnemyDeath(e, null);
      const idx = enemies.indexOf(e);
      if (idx >= 0) enemies.splice(idx, 1);
      onEnemyKilled(e, false);
      killed++;
    }
  }

  if (killed >= 2) { score += 75 * (killed - 1); updateHUD("Multi-kill x" + killed + "!"); }
  if (damaged > 0) {
    flashHitMarker(killed > 0);
    beep(killed > 0 ? 720 : 520, 0.03, "square", 0.05);
  }
  // everyone nearby heard that
  lastShotTime = gNow();
  lastShotPos.copy(pos);

  // the player: screen shake, shove, and damage if you stood too close
  const chest = camera.position.clone(); chest.y -= 0.35;
  const pd = chest.distanceTo(pos);
  if (pd < 32) {
    shakeAmp = 0.02 * (0.3 + 0.7 * (1 - pd / 32));
    shakeT = SHAKE_DURATION * 3;
  }
  if (pd < R) {
    let f = 1 - (1 - GRENADE.minFrac) * (pd / R);
    if (!hasLineOfSight(from, camera.position)) f *= GRENADE.coverFrac;
    const away = chest.clone().sub(pos); away.y = 0;
    if (away.lengthSq() < 0.0001) away.set(Math.sin(yaw), 0, Math.cos(yaw));
    away.normalize();
    playerKnock.x += away.x * 9 * f;
    playerKnock.z += away.z * 9 * f;
    const m = Math.hypot(playerKnock.x, playerKnock.z);
    if (m > KNOCKBACK_MAX) { playerKnock.x *= KNOCKBACK_MAX / m; playerKnock.z *= KNOCKBACK_MAX / m; }
    if (GRENADE.selfMax > 0 && f * GRENADE.selfMax > 0.5) {
      const damage = GRENADE.selfMax * f;
      if (window.__fpsVersusActive) multiplayerSocket.emit("match:self-hit", { damage });
      else takeDamage(damage);
    }
  }
}

function lineBlockedBySmoke(from, to) {
  if (!smokeClouds.length) return false;
  const segment = to.clone().sub(from);
  const lengthSq = segment.lengthSq();

  for (const cloud of smokeClouds) {

// -----------------------
// Spawning / waves (more space, less "instant death")
// -----------------------
const recentSpawns = [];   // last few spawn points so bots do not stack up in one place

// Raised walkable decks (e.g. the atrium galleries): thin, wide slabs well above the floor
function spawnDecks() {
  return obstacleBoxes.filter(b =>
    (b.max.y - b.min.y) <= 0.6 && b.max.y > 2 &&
    (b.max.x - b.min.x) >= 3 && (b.max.z - b.min.z) >= 3);
}

function randomSpawnPosition() {
  const decks = spawnDecks();
  const playerFeet = camera.position.y - curEye;
  const zTop = currentBounds.zMax - 10, zSpan = Math.abs(currentBounds.zMin) + Math.abs(currentBounds.zMax) - 18;

  for (let tries = 0; tries < 250; tries++) {
    const relax = tries > 150;
    let x, z, y = 0;
    if (decks.length && Math.random() < 0.4) {
      // upstairs: pick a random spot on a random gallery deck
      const d = decks[(Math.random() * decks.length) | 0];
      x = d.min.x + 0.9 + Math.random() * Math.max(0.1, (d.max.x - d.min.x) - 1.8);
      z = d.min.z + 0.9 + Math.random() * Math.max(0.1, (d.max.z - d.min.z) - 1.8);
      x = clamp(x, -currentBounds.x + 2, currentBounds.x - 2);
      z = clamp(z, currentBounds.zMin + 2, currentBounds.zMax - 2);
      y = d.max.y;
    } else {
      x = (Math.random() * 2 - 1) * (currentBounds.x - 4);
      z = zTop - Math.random() * zSpan;
    }

    let ok = true;

    // not inside anything solid at this height (the floor slab and overhead decks are ignored)
    const pad = relax ? 0.7 : 1.2;
    for (const box of obstacleBoxes) {
      if (box.max.y <= y + MAX_STEP_HEIGHT + 0.05) continue;
      if (box.min.y >= y + 1.9) continue;
      if (x > box.min.x - pad && x < box.max.x + pad &&
          z > box.min.z - pad && z < box.max.z + pad) { ok = false; break; }
    }
    if (!ok) continue;

    // not too close to the player (a floor above/below is allowed to be closer)
    const dx = x - camera.position.x, dz = z - camera.position.z;
    const sameFloor = Math.abs(y - playerFeet) < 2;
    if (Math.hypot(dx, dz) < (sameFloor ? 18 : 10)) continue;

    // spread out: stay away from the last few spawn points
    if (!relax && recentSpawns.some(s => Math.abs(s.y - y) < 2 && Math.hypot(s.x - x, s.z - z) < 6)) continue;

    recentSpawns.push({ x, y, z });
    if (recentSpawns.length > 8) recentSpawns.shift();
    return { x, y, z };
  }
  // last resort: somewhere random on the ground floor (never the same fixed spot)
  return { x: (Math.random() * 2 - 1) * (currentBounds.x - 4), y: 0, z: zTop - Math.random() * zSpan };
}

function spawnEnemy(classKey=null) {
  if (!classKey) {
    const w = wave;
    const r = Math.random();
    if (w >= 4 && r < 0.20) classKey = "sniper";
    else if (w >= 2 && r < 0.45) classKey = "shotgun";
    else classKey = "rifler";
  }
  const e = makeEnemy(classKey);
  const p = randomSpawnPosition();
  e.position.set(p.x, p.y, p.z);
  e.userData.patrolAnchor.copy(e.position);
  e.traverse(o => { if (o.isMesh && !o.userData.noShadow) o.castShadow = true; });
  scene.add(e);
  enemies.push(e);
}

function clearEnemies() {
  for (const e of enemies) scene.remove(e);
  enemies.length = 0;
}

function startWave(n=1) {
  wave = n;
  // Refill the selected side utility at regular wave milestones.
  const utility = UTILITY_TYPES[utilityType];
  if (n > 1 && (n - 1) % utility.everyWaves === 0) grantGrenades(utility.perPack);
  timeSinceWaveStart = 0;

  // smaller scaling than "arcade swarm"
  waveBotsTotal = Math.max(2, Math.round((settings.baseEnemies + Math.floor(wave * 1.15)) * DIFF().count));
  waveBotsRemaining = waveBotsTotal;

  clearEnemies();

  // enemies are spawned one at a time by updateWaveSpawning() so you can reposition
  spawnRemaining = waveBotsTotal;
  spawnTimer = 0;
  nextWaveIn = -1;
}

// Runs from the game loop, so it pauses with the game and can't leak across restarts
function updateWaveSpawning(dt) {
  if (window.__fpsVersusActive) return;
  if (spawnRemaining > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      spawnRemaining--;
      spawnTimer = settings.spawnDelayMs / 1000;
      if (spawnRemaining === 0) updateHUD("Contact!");
    }
  }
  if (nextWaveIn > 0) {
    nextWaveIn -= dt;
    if (nextWaveIn <= 0) {
      nextWaveIn = -1;
      startWave(wave + 1);
    }
  }
}

function onEnemyKilled(enemy, headshot=false) {
  if (missionRun) {                       // missions: no waves, but objectives and supply drops care who died
    kills++; score += headshot ? 240 : 150; if (headshot) headshots++;
    missionOnKill(enemy);
    return;
  }
  waveBotsRemaining--;
  kills++;
  score += Math.round((headshot ? 240 : 150) * DIFF().score);
  if (headshot) headshots++;

  if (waveBotsRemaining <= 0 && nextWaveIn < 0) {
    updateHUD("Clear. Reposition.");
    nextWaveIn = 1.4;
  }
}

// -----------------------
// LOS + cover selection
// -----------------------
// PERF: the old version built a new Raycaster and ray-tested EVERY triangle of EVERY prop mesh (hundreds of
// cylinders/boxes in the Foundry Atrium), sorted all hits, and was called several times per bot per frame.
// Now: reuse one raycaster, reject meshes with a cheap cached bounding-box test first, and stop at the first hit.
const _losRay = new THREE.Raycaster();
const _losDir = new THREE.Vector3();
const _losHits = [];
function losBoxOf(mesh) {
  let bb = mesh.userData.losBox;
  if (!bb) {                                   // obstacles are static, so compute the world box once
    mesh.updateWorldMatrix(true, false);
    bb = mesh.userData.losBox = new THREE.Box3().setFromObject(mesh).expandByScalar(0.02);
  }
  return bb;
}
function segmentHitsBox(ox, oy, oz, dx, dy, dz, len, b) {
  let tmin = 0, tmax = len;
  if (Math.abs(dx) < 1e-9) { if (ox < b.min.x || ox > b.max.x) return false; }
  else { let t1 = (b.min.x - ox) / dx, t2 = (b.max.x - ox) / dx; if (t1 > t2) { const t = t1; t1 = t2; t2 = t; } if (t1 > tmin) tmin = t1; if (t2 < tmax) tmax = t2; if (tmin > tmax) return false; }
  if (Math.abs(dy) < 1e-9) { if (oy < b.min.y || oy > b.max.y) return false; }
  else { let t1 = (b.min.y - oy) / dy, t2 = (b.max.y - oy) / dy; if (t1 > t2) { const t = t1; t1 = t2; t2 = t; } if (t1 > tmin) tmin = t1; if (t2 < tmax) tmax = t2; if (tmin > tmax) return false; }
  if (Math.abs(dz) < 1e-9) { if (oz < b.min.z || oz > b.max.z) return false; }
  else { let t1 = (b.min.z - oz) / dz, t2 = (b.max.z - oz) / dz; if (t1 > t2) { const t = t1; t1 = t2; t2 = t; } if (t1 > tmin) tmin = t1; if (t2 < tmax) tmax = t2; if (tmin > tmax) return false; }
  return true;
}
function hasLineOfSight(from, to) {
  _losDir.subVectors(to, from);
  const dist = _losDir.length();
  if (dist < 0.001) return true;
  _losDir.divideScalar(dist);
  const dx = _losDir.x, dy = _losDir.y, dz = _losDir.z;
  _losRay.set(from, _losDir);
  _losRay.near = 0; _losRay.far = dist;
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (!segmentHitsBox(from.x, from.y, from.z, dx, dy, dz, dist, losBoxOf(o))) continue;
    _losHits.length = 0;
    o.raycast(_losRay, _losHits);              // precise test only for meshes the ray actually passes near
    if (_losHits.length) return false;         // first blocker is enough
  }
  return true;
}

// PERF: cover search tests ~6 spots per nearby box, each with a line-of-sight check. Several bots doing it in the
// same frame caused the spike when they spotted you, so only a couple of searches are allowed per frame.
let coverBudget = 2;
function findCoverPosition(enemyPos, playerPos) {
  if (coverBudget <= 0) return null;   // callers already handle "no cover found"; they simply try again later
  coverBudget--;
  let best = null;
  let bestScore = -1;

  const eLevel = enemyPos.y;
  for (const box of obstacleBoxes) {
    if (box.min.y > eLevel + 1.2) continue;   // hangs above this floor (a gallery deck, props on another floor)
    if (box.max.y < eLevel + 0.6) continue;   // too low to hide behind (floor slab, stair treads, anything below this floor)
    const center = box.getCenter(new THREE.Vector3());
    const dBox = center.distanceTo(enemyPos);
    if (dBox > AI.coverSearchRadius) continue;

    const samples = [
      new THREE.Vector3(box.max.x + 1.2, eLevel, center.z),
      new THREE.Vector3(box.min.x - 1.2, eLevel, center.z),
      new THREE.Vector3(center.x, eLevel, box.max.z + 1.2),
      new THREE.Vector3(center.x, eLevel, box.min.z - 1.2),
      new THREE.Vector3(box.max.x + 1.2, eLevel, box.max.z + 1.2),
      new THREE.Vector3(box.min.x - 1.2, eLevel, box.min.z - 1.2),
    ];

    for (const s of samples) {
      if (s.x < -currentBounds.x || s.x > currentBounds.x || s.z < currentBounds.zMin || s.z > currentBounds.zMax) continue;
      // on an upper gallery the cover spot must actually be on that gallery (not out over the void)
      if (eLevel > 1 && Math.abs(getSupportHeight(s.x, s.z, eLevel) - eLevel) > 0.6) continue;

      const playerEye = playerPos.clone();
      const breaks = !hasLineOfSight(s.clone().setY(enemyPos.y + 1.7), playerEye);
      if (!breaks) continue;

      const dE = s.distanceTo(enemyPos);
      const dP = s.distanceTo(playerPos);
      const sc = dP - dE * 0.55;
      if (sc > bestScore) { bestScore = sc; best = s; }

}

  const feetY = camera.position.y - curEye;

// Pushes the player backwards (opposite the aim direction) by a fixed amount for the weapon type
function applyPlayerKnockback(weaponType) {

  if (speed <= 0) return;
  playerKnock.x += Math.sin(yaw) * speed;   // forward is (-sin, -cos), so back is (+sin, +cos)
  playerKnock.z += Math.cos(yaw) * speed;

function startKnifeAttack(isAlt = false) {
  if (!roundActive || reloading || swapping || grenadeEquipped || sprintActive() || throwState) return;
  if (weapons[curWeaponNum].type !== "melee" || knifeAttackTimer > 0) return;
  const now = gNow();
  const cooldown = isAlt ? KNIFE_ALT_COOLDOWN : weapons[curWeaponNum].fireRate;
  if (now - current.lastShot < cooldown) return;

  current.lastShot = now;
  lastShotTime = now;
  lastShotPos.copy(camera.position);
  shots++;
  knifeAttackType = isAlt ? "alt" : "stab";
  if (!isAlt) { knifeAttackSide = knifeSlashSide; knifeSlashSide = -knifeSlashSide; }
  else {
    knifeAttackSide = 1;
    knifeAltVariant = knifeNextAlt;      // right click alternates: flip + chop, then spin + two-handed stab
    knifeNextAlt = 1 - knifeNextAlt;
  }
  knifeAttackTimer = isAlt ? KNIFE_ALT_DURATION : KNIFE_STAB_DURATION;
  knifeAttackHitPending = true;
  recoil = Math.max(recoil, isAlt ? 0.30 : 0.20);
  try { GunSFX.knifeSwing(!isAlt ? "slash" : (knifeAltVariant === 0 ? "heavy1" : "heavy2")); } catch (e) {}

}

function resolveKnifeAttack(isAlt) {
  const w = weapons[curWeaponNum];
  const origin = camera.position.clone();
  const hit = castBullet(origin, getShotDirection(0));
  // one short screen shake as the blade lands: small for the quick slash, a bit bigger for the heavy attack
  shakeAmp = 0;
  shakeT = SHAKE_DURATION * (isAlt ? 1.3 : 1.0);
  let landed = false, critical = false;
  if (hit.type === "enemy" && hit.enemy?.userData.remotePlayerId && hit.point.distanceTo(origin) <= w.range) {
    landed = true; critical = hit.part === "head";
    if (window.__fpsVersusActive && hit.enemy.userData.team !== window.__fpsLocalTeam) {
      const damage = critical ? (isAlt ? KNIFE_ALT_HEAD : w.headDmg) : (isAlt ? KNIFE_ALT_BODY : w.bodyDmg);
      multiplayerSocket.emit("match:hit", { targetId: hit.enemy.userData.remotePlayerId, damage: Math.min(120, damage) });
      spawnHitParticles(hit.point, 0x8b0a10);
      spawnVersusBloodHit(hit.point, critical ? 1.35 : 1);
      flashHitMarker(critical);
    }
  } else if (hit.type === "enemy" && hit.enemy && hit.enemy.userData.hp > 0 && hit.point.distanceTo(origin) <= w.range) {
    landed = true;
    critical = hit.part === "head";
    const damage = critical ? (isAlt ? KNIFE_ALT_HEAD : w.headDmg) : (isAlt ? KNIFE_ALT_BODY : w.bodyDmg);
    hit.enemy.userData.hp -= damage; hit.enemy.userData.lastHitAt = gNow();
    hit.enemy.userData.lastSeenPlayer = camera.position.clone();
    hit.enemy.userData.lastSeenTime = gNow();
    hit.enemy.userData.state = "engage";
    hit.enemy.userData.reactionAt = gNow() + rand(AI.reactionMin, AI.reactionMax) * 1000;
    drawHealthBar(hit.enemy);
    spawnHitParticles(hit.point, settings.blood ? 0x4a0606 : critical ? 0x88d7ff : 0xffe066);
    score += critical ? 65 : 30;
    if (hit.enemy.userData.hp <= 0) {
      startEnemyDeath(hit.enemy, origin);
      const idx = enemies.indexOf(hit.enemy);
      if (idx >= 0) enemies.splice(idx, 1);

  }

    hits++;

  } else if (hit.type === "wall" && hit.point.distanceTo(origin) <= w.range) {
